// ── Balanced masonry: place each card explicitly in the currently-shortest valid
// column window so the columns grow evenly — instead of grid-auto-flow:dense, which
// piles content into the first columns and leaves a ragged blank tail on the right.
// Heights use offsetHeight (UNZOOMED layout px): the embed preview applies `zoom` to
// the sheet, which scales getBoundingClientRect but not the 8px grid track, so a
// zoomed measurement would under-span and overlap. Reading order ≈ DOM order (early
// cards fill the top row across columns), same as the old dense flow.
function packWell(){
  const ROW = 8, GAP = 22;   // must match grid-auto-rows; GAP = vertical rhythm baked into each span
  document.querySelectorAll(".well").forEach(well=>{
    const items = [...well.children].filter(el=>el.matches(".story"));
    if(!items.length) return;
    // real rendered column count (covers --wellcols AND the responsive CSS fallback)
    const C = getComputedStyle(well).gridTemplateColumns.split(" ").filter(Boolean).length || 1;
    // reset to natural height at the card's final width (its span), so offsetHeight is right
    const meas = items.map(el=>{
      const span = Math.max(1, Math.min(parseInt(el.dataset.applied)||1, C));
      el.style.gridRow = ""; el.style.gridColumn = "span " + span;
      return { el, span };
    });
    meas.forEach(m=>{ m.rows = Math.max(1, Math.ceil((m.el.offsetHeight + GAP) / ROW)); });
    const colBottom = new Array(C).fill(0);   // last used row index per column
    meas.forEach(m=>{
      let bestK = 0, bestTop = Infinity;       // window [k, k+span) whose tallest column is lowest
      for(let k=0; k+m.span<=C; k++){
        let top = 0;
        for(let j=k;j<k+m.span;j++) if(colBottom[j]>top) top=colBottom[j];
        if(top < bestTop){ bestTop = top; bestK = k; }
      }
      m.el.style.gridColumn = (bestK+1) + " / span " + m.span;
      m.el.style.gridRow    = (bestTop+1) + " / span " + m.rows;
      for(let j=bestK;j<bestK+m.span;j++) colBottom[j] = bestTop + m.rows;
    });
  });
  if(ALL) renderGapButtons();   // board mode: offer to fill the ragged blank tail
}
// ── Gap-filler (board mode): mark every blank region in a well with a ＋ button —
// not just the ragged bottom tail, but TOP and INTERIOR holes too (a wide story can
// leave a neighbouring column empty in the middle). Per column we find the free
// vertical intervals (the complement of what the stories occupy), then merge
// adjacent columns whose free intervals overlap into rectangles. Clicking posts the
// gap's size to the board, which recommends a chronicle/image/ad that fits.
let _gapWrap = null;
function renderGapButtons(){
  if(!_gapWrap){ _gapWrap = document.createElement("div"); document.body.appendChild(_gapWrap); }
  _gapWrap.innerHTML = "";
  const sheet = document.querySelector(".sheet");
  const zoom = sheet ? (parseFloat(getComputedStyle(sheet).zoom)||1) : 1;
  const TH = 110*zoom;   // ignore holes shorter than ~110 unzoomed px
  document.querySelectorAll(".well").forEach(well=>{
    const stories = [...well.children].filter(e=>e.matches(".story"));
    if(!stories.length) return;
    const cs = getComputedStyle(well);
    const C = cs.gridTemplateColumns.split(" ").filter(Boolean).length || 1;
    const wr = well.getBoundingClientRect();
    const colGap = parseFloat(cs.columnGap) || 18;
    const colW = (wr.width - (C-1)*colGap) / C;
    // what each column is OCCUPIED by (intervals relative to the well top, viewport px)
    const occ = Array.from({length:C}, ()=>[]);
    let contentBottom = 0;
    stories.forEach(s=>{
      const r = s.getBoundingClientRect();
      const start = Math.max(0, Math.round((r.left - wr.left)/(colW+colGap)));
      const span  = Math.max(1, Math.round((r.width+colGap)/(colW+colGap)));
      const top = r.top - wr.top, bot = r.bottom - wr.top;
      contentBottom = Math.max(contentBottom, bot);
      for(let c=start;c<Math.min(C,start+span);c++) occ[c].push([top,bot]);
    });
    if(contentBottom<=0) return;
    // free vertical intervals per column (top hole + interior gaps + bottom tail)
    const free = Array.from({length:C}, ()=>[]);
    for(let c=0;c<C;c++){
      const iv = occ[c].sort((a,b)=>a[0]-b[0]);
      let cur = 0;
      for(const [t,b] of iv){ if(t-cur>TH) free[c].push([cur,t]); cur = Math.max(cur,b); }
      if(contentBottom-cur>TH) free[c].push([cur,contentBottom]);
    }
    // merge adjacent columns' overlapping free intervals into rectangular gaps
    const used = free.map(l=>l.map(()=>false));
    for(let c=0;c<C;c++) for(let i=0;i<free[c].length;i++){
      if(used[c][i]) continue;
      let top=free[c][i][0], bot=free[c][i][1]; used[c][i]=true;
      let c2=c+1;
      while(c2<C){
        let hit=-1;
        for(let j=0;j<free[c2].length;j++){ if(used[c2][j]) continue;
          const ov = Math.min(bot,free[c2][j][1]) - Math.max(top,free[c2][j][0]);
          if(ov>TH){ hit=j; break; } }
        if(hit<0) break;
        top=Math.max(top,free[c2][hit][0]); bot=Math.min(bot,free[c2][hit][1]); used[c2][hit]=true; c2++;
      }
      const cols=c2-c, gh=bot-top;
      if(gh<=TH) continue;
      const gx=wr.left + c*(colW+colGap), gw=cols*colW+(cols-1)*colGap, gy=wr.top+top;
      const sid = well.dataset.sectionId || "";
      const btn=document.createElement("button");
      btn.className="gap-add"; btn.type="button"; btn.textContent="＋";
      btn.title = (()=>{ try{ return I18n.t("paper.fillGap"); }catch(_){ return "＋"; } })();
      btn.style.left = (window.scrollX + gx + gw/2 - 19) + "px";
      btn.style.top  = (window.scrollY + gy + Math.min(gh/2, 70*zoom) - 19) + "px";
      const payload = { type:"daihbi-fill-gap", sectionId:sid, cols, widthPx:Math.round(gw/zoom), heightPx:Math.round(gh/zoom) };
      btn.addEventListener("click", e=>{ e.preventDefault(); e.stopPropagation(); try{ parent.postMessage(payload, location.origin); }catch(_){} });
      _gapWrap.appendChild(btn);
    }
  });
}
// In embed/preview mode, scale the full 1100px sheet down to fit the pane width
// (zoom reflows the layout box, so no leftover whitespace). No-op otherwise.
function applyEmbed(){
  if(!EMBED) return;
  const sheet = document.querySelector(".sheet"); if(!sheet) return;
  sheet.style.zoom = String(Math.min(1, (window.innerWidth || 1100) / 1100));
}
// Apply the editor's chosen well column count (papers.grid_cols). Opt-in only:
// when 0 we leave --wellcols to the responsive CSS, so non-customised editions
// are byte-for-byte unchanged. The AI-sidebar human zone (.well2) keeps its
// dedicated 2-column layout regardless.
function setWellCols(){
  const n = (PAPER && PAPER.gridCols) || 0;
  document.querySelectorAll(".well").forEach(w=>{
    if(w.classList.contains("well2")) return;
    if(n>0) w.style.setProperty("--wellcols", n); else w.style.removeProperty("--wellcols");
  });
}
let _packRAF;
function schedulePack(){
  applyEmbed();   // scale first so the masonry measures in the scaled space
  setWellCols();  // set track count before measuring so spans resolve correctly
  applyStorySpans();   // clamp each story's span to its well's real column count
  cancelAnimationFrame(_packRAF);
  _packRAF = requestAnimationFrame(()=>requestAnimationFrame(packWell));
  // images and webfonts change card heights — re-pack as they settle
  document.querySelectorAll(".well img").forEach(img=>{
    if(!img.complete){ img.addEventListener("load", packWell, {once:true}); img.addEventListener("error", packWell, {once:true}); }
  });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(packWell);
}
let _packResize;
window.addEventListener("resize", ()=>{ clearTimeout(_packResize); _packResize = setTimeout(()=>{ applyEmbed(); setWellCols(); applyStorySpans(); packWell(); }, 150); });

async function load(){
  if(!configured){
    $("#sheet").innerHTML = `<div class="empty">${esc(I18n.t("paper.notConnected"))}<br>
      ${esc(I18n.t("paper.addKeys"))} <code>web/config.js</code>.</div>`;
    return;
  }
  try{ PAPERS = await Papers.map(); }catch(e){ /* keep papers.js */ }
  PAPER = PAPERS[ISSUE] || fallbackPaper(); applyPaper();
  // Fixed-grid layout template (templates.sql): resolve the def + slot list once.
  // '' / missing / unresolvable → null → today's auto-flow well (nothing changes).
  TPL = null;
  if(PAPER.template){ try{ const r = await Templates.resolve(PAPER.template);
    if(r && r.def){ const slots = Templates.slots(r.def); if(slots.length) TPL = { def:r.def, slots }; }
  }catch(e){ TPL = null; } }
  let arts;
  try{
    // ALL mode (board canvas) shows every placement incl. drafts; public shows published only
    const placed = ALL ? await Placements.forIssue(ISSUE) : await Placements.publishedForIssue(ISSUE);
    // flatten placement (layout) + chronicle (text); placement photo overrides the suggested one.
    // Keep the placement id/kind/published so the board can edit a clicked element.
    arts = placed.filter(p=>p.article).map(p => ({ ...p.article,
      weight: p.weight, position: p.position,
      col_span: p.col_span || 0, img_cols: p.img_cols || 0, img_pos: p.img_pos || "top", img_crop: p.img_crop || "",   // editor layout (columns.sql / img_pos.sql / img_crop.sql)
      img_focus: p.img_focus || "", img_zoom: (p.img_zoom>0 ? p.img_zoom : 1),   // crop tool (img_crop_tool.sql)
      img_overlay: p.img_overlay || "", img_overlay_style: p.img_overlay_style || "band", img_overlay_pos: p.img_overlay_pos || "bottom",   // overlay text (img_overlay.sql)
      pid: p.id, kind: "placement", published: p.published !== false,
      section_id: p.section_id || null,                                    // rubrique (sections.sql)
      slot: (p.slot==null ? -1 : p.slot),                                  // template cell (templates.sql)
      elem: p.elem || "", text: p.text || "",                              // dummy element + caption/quote (dummy_layout.sql)
      lang: (p.article.lang)||"fr",
      image_url: p.image_url || p.article.image_url || "" }));
    // furniture: a placement with no article — an image filler (image_fill.sql) OR
    // a dummy element (mugshot/cartoon/photo = image, quote = text; dummy_layout.sql)
    const fillers = placed.filter(p=>!p.article && (p.image_url || p.text || p.elem)).map(p => ({
      isImage: !!p.image_url, headline:"", subhead:"", kicker:"", byline:"", body:"", source:"", lang:PAPER_LANG||"fr",
      weight: p.weight, position: p.position,
      col_span: p.col_span || 0, img_cols: p.img_cols || 0, img_pos: p.img_pos || "top", img_crop: p.img_crop || "",
      img_focus: p.img_focus || "", img_zoom: (p.img_zoom>0 ? p.img_zoom : 1),
      img_overlay: p.img_overlay || "", img_overlay_style: p.img_overlay_style || "band", img_overlay_pos: p.img_overlay_pos || "bottom",
      pid: p.id, kind: "placement", published: p.published !== false,
      section_id: p.section_id || null, slot: (p.slot==null ? -1 : p.slot),
      elem: p.elem || "", text: p.text || "", image_url: p.image_url }));
    arts = arts.concat(fillers);
    // Board (ALL) mode comes from forIssue() UNSORTED; the public view is already
    // weight+position sorted. Sort here too so the board preview matches the printed
    // order AND so a gap-fill's position:9999 lands it LAST → the balanced masonry
    // drops it into the emptiest column (the hole the editor clicked).
    const _WR = { lead:0, major:1, minor:2, brief:3 };
    arts.sort((a,b)=> (_WR[a.weight]??9)-(_WR[b.weight]??9) || (a.position||0)-(b.position||0));
  }
  catch(e){ $("#sheet").innerHTML = `<div class="empty">${esc(I18n.t("paper.loadFail"))}<br>${esc(e.message)}</div>`; return; }

  // Réclames: the editor lays them out (ad_placements), in their chosen order.
  // Fall back to auto-flowing all approved ads when nothing's been placed yet
  // (or before the ad_placements migration has run).
  let ads = [];
  try{
    // ALL mode: every ad placement (incl. drafts), each carrying its placement id so
    // the board can edit it. Public: published only, with the approved-ads fallback.
    const ap = ALL ? await AdPlacements.forIssue(ISSUE) : await AdPlacements.publishedForIssue(ISSUE);
    ads = ap.map(p=> p.ad ? { ...p.ad, pid:p.id, kind:"ad-placement", published:p.published!==false } : null).filter(Boolean);
    if(!ALL && !ads.length) ads = await Ads.listApproved(ISSUE);
  }catch(e){ if(!ALL){ try{ ads = await Ads.listApproved(ISSUE); }catch(_){} } }

  // photo credits: map each used image URL → its author (portfolio/media provenance)
  try{ CREDITS = await Media.creditsFor([...arts.map(a=>a.image_url), ...ads.map(d=>d.image_url)]); }catch(e){ CREDITS = {}; }

  // editor-defined rubriques (sections.sql); empty/absent → headerless single well
  try{ SECTIONS = await Sections.forIssue(ISSUE); }catch(e){ SECTIONS = []; }

  paintSheet(arts, ads);
  // tell the board/manage-modal the canvas is current (board re-syncs status; the
  // manage modal replies with the editor's unsaved form values so the preview is live)
  if(ALL || EMBED){ try{ parent.postMessage({ type:"daihbi-rendered" }, location.origin); }catch(_){} }
}

// Build the masthead + body into #sheet from already-fetched (arts, ads). Split out
// of load() so a live preview can repaint from cache (no re-fetch) when the editor
// edits the masthead/theme in the manage modal. Caches the data for that repaint.
let _lastArts = null, _lastAds = null;
function paintSheet(arts, ads){
  _lastArts = arts; _lastAds = ads;
  // edition's PRIMARY content language: lead article's lang, else most frequent, else "fr"
  PAPER_LANG = (() => {
    if(!arts.length) return "fr";
    const lead = arts.find(a=>a.weight==="lead");
    if(lead && lead.lang) return lead.lang;
    const tally = {};
    for(const a of arts){ const l = a.lang||"fr"; tally[l] = (tally[l]||0)+1; }
    return Object.keys(tally).sort((x,y)=>tally[y]-tally[x])[0] || "fr";
  })();
  // transparency: AI-written chronicles go in a 1-column sidebar on the right,
  // human chronicles fill a 2-column well on the left.
  const isAI = a => ["ia","ai"].includes(String(a.source||"").trim().toLowerCase());
  // image fillers never become the hero
  const leadAndRest = list => {
    const ld = list.find(a=>a.weight==="lead" && !a.isImage) || list.find(a=>!a.isImage) || null;
    const rst = list.filter(a=>a!==ld).map(a=> (a.weight==="lead" && !a.isImage) ? {...a,weight:"major"} : a);
    return [ld, rst];
  };
  // A "brief" spanning the full well (col_span ≥ the well's columns) is laid out
  // as a full-width FEUILLETON band UNDER the well — like the foot-of-page serial
  // novel of the old papers — instead of inside the masonry grid (where a span-all
  // item collides with the dense packing).
  const effCols = (PAPER.gridCols>0 ? PAPER.gridCols : 3);
  const isBand = a => !a.isImage && a.weight==="brief" && a.col_span>0 && a.col_span>=effCols;
  const bandArts = arts.filter(isBand);
  const mainArts = arts.filter(a=>!isBand(a));
  const bandHTML = bandArts.map(renderBand).join("");
  const aiArts = mainArts.filter(isAI);
  const humanArts = mainArts.filter(a=>!isAI(a));
  // Two-zone layout (AI chronicles in a separate sidebar) is OPT-IN per edition
  // (papers.ai_zone). Off by default → AI chronicles flow in the well like any
  // other, just wearing the "✦ Rédigé par IA" badge. (ai_zone.sql)
  const splitAI = !!PAPER.aiZone && aiArts.length>0 && humanArts.length>0;
  let bodyHTML;
  if(TPL && TPL.slots && TPL.slots.length){
    // Fixed-grid template: stories sit in their assigned cells; empty cells show a
    // ＋ (board mode). Unslotted/overflow stories + ads flow in a well below.
    bodyHTML = renderTemplateBody(arts, ads);
  } else if(arts.length===0){
    bodyHTML = `<div class="empty">${esc(I18n.t("paper.noArticles"))}<br><a href="editor.html?issue=${encodeURIComponent(ISSUE)}">${esc(I18n.t("paper.writeOne"))}</a></div>`;
  } else if(!splitAI){
    // classic full-width layout when the page is all-human OR all-AI; each story
    // still carries its own source badge (régiment or ✦ AI), so transparency holds.
    // RUBRIQUES (sections.sql): the lead is the edition hero on top; the rest is the
    // headerless default well (carries the ads), then each editor section as a titled
    // block in order. No sections / all-unsectioned → one well, exactly as before.
    const [lead,rest] = leadAndRest(mainArts);
    const known = new Set(SECTIONS.map(s=>s.id));
    const secOf = a => (a.section_id && known.has(a.section_id)) ? a.section_id : null;
    const inSec = id => rest.filter(a => secOf(a) === id);
    const well = (list, sid, extra="") => (list.length||extra) ? `<div class="well" data-section-id="${esc(sid||"")}">${list.map(renderStory).join("")}${extra}</div>` : "";
    const unsec = inSec(null);
    const defaultBlock = well(unsec, "", ads.map(renderAd).join(""));
    const secBlocks = SECTIONS.map(s => { const items=inSec(s.id);
      return items.length ? `<div class="section-head"><span>${esc(s.name||"")}</span></div>` + well(items, s.id) : ""; }).join("");
    bodyHTML = (lead?renderLead(lead):"") + defaultBlock + secBlocks + bandHTML;
  } else {
    const [hLead,hRest] = leadAndRest(humanArts);
    bodyHTML = `<div class="front">
      <div class="zone-human">
        ${hLead?renderLead(hLead):""}
        ${(hRest.length||ads.length)?`<div class="well well2">${hRest.map(renderStory).join("")}${ads.map(renderAd).join("")}</div>`:""}
      </div>
      <aside class="zone-ai">
        <div class="ai-head">${esc(pressL(PAPER_LANG).head)}</div>
        ${aiArts.map(renderStory).join("")}
      </aside>
    </div>` + bandHTML;
  }

  const footer = PAPER.slogans && PAPER.slogans.length
    ? `<div class="slogans">${PAPER.slogans.map(s=>`<span>${s}</span>`).join("")}</div>`
    : `<div class="colophon">${esc(PAPER.name)} · ${esc(I18n.t(arts.length>1?"paper.articles":"paper.article",{n:arts.length}))} · Warden</div>`;

  $("#sheet").innerHTML = `
    <div class="ear"><span>${PAPER.ear[0]||""}</span><span>${PAPER.ear[1]||""}</span><span>${PAPER.ear[2]||""}</span></div>
    <div class="nameplate ${PAPER.plate}">
      <div class="plate-row">
        ${PAPER.emblemLeft ? `<img class="emblem" src="${esc(PAPER.emblemLeft)}" alt="">` : (PAPER.emblemRight?`<span class="emblem-spacer"></span>`:"")}
        <div class="plate-name">
          <h1>${esc(PAPER.name)}</h1>
          ${PAPER.tagline ? `<div class="sub">${PAPER.tagline}</div>` : ""}
        </div>
        ${PAPER.emblemRight ? `<img class="emblem" src="${esc(PAPER.emblemRight)}" alt="">` : (PAPER.emblemLeft?`<span class="emblem-spacer"></span>`:"")}
      </div>
    </div>
    <div class="dateline-bar">
      <span>${fmtDate(new Date())}</span>
      <span class="mid">${esc(pressL(PAPER_LANG).ed.replace("{0}", ISSUE.toUpperCase()))}</span>
      <span>${PAPER.ear[2]||""}</span>
    </div>
    ${bodyHTML}
    ${arts.length ? footer : ""}
  `;
  // The page's content is in the edition's primary language — reflect that on
  // <html lang> (I18n.apply sets it to the UI language, so set it AFTER render).
  document.documentElement.lang = PAPER_LANG;
  schedulePack();   // snap the story cards together once laid out
}

// Live preview (manage modal): merge the editor's unsaved form values into PAPER and
// repaint from cache — no DB write, no reload. Theme/font apply via applyPaper + a
// CSS-var override; a custom style not yet loaded is fetched first.
let PREVIEW_FONT = "";
async function applyPreviewPatch(patch){
  if(patch.name      != null) PAPER.name      = patch.name;
  if(patch.tagline   != null) PAPER.tagline   = patch.tagline;
  if(patch.plate     != null) PAPER.plate     = patch.plate;
  if(patch.ear)               PAPER.ear       = patch.ear;
  if(patch.slogans)           PAPER.slogans   = patch.slogans;
  if(patch.emblemLeft  != null) PAPER.emblemLeft  = patch.emblemLeft;
  if(patch.emblemRight != null) PAPER.emblemRight = patch.emblemRight;
  if(patch.aiZone    != null) PAPER.aiZone    = patch.aiZone;
  if(patch.gridCols  != null) PAPER.gridCols  = patch.gridCols;   // front-page well columns (setWellCols runs in paintSheet)
  if(patch.theme     != null && patch.theme !== "__newstyle") PAPER.theme = patch.theme;
  if(patch.font      != null) PREVIEW_FONT = patch.font;
  // a custom style picked but not yet in CUSTOM → fetch the styles table once
  if(Styles.isCustom(PAPER.theme) && !CUSTOM[PAPER.theme]){ try{ await loadStyles(); }catch(_){} }
  applyPaper();                                  // theme/plate classes + style vars
  if(PREVIEW_FONT){ const s=$("#sheet"); if(s){ s.style.setProperty("--font-display",PREVIEW_FONT); s.style.setProperty("--font-head",PREVIEW_FONT); } }
  if(_lastArts) paintSheet(_lastArts, _lastAds||[]);
}
if(EMBED){
  window.addEventListener("message", e=>{
    if(e.origin!==location.origin) return;
    const d=e.data||{};
    if(d.type==="daihbi-preview" && d.patch) applyPreviewPatch(d.patch);
  });
}

async function savePNG(){
  if(typeof html2canvas==="undefined"){ alert("PNG export needs internet (html2canvas). Use Print → Save as PDF."); return; }
  const bg = getComputedStyle($("#sheet")).backgroundColor || "#f5efe1";
  const canvas = await html2canvas($("#sheet"),{scale:2,backgroundColor:bg,useCORS:true});
  const a=document.createElement("a");
  // filename matches the paper produced: slugified masthead name (accents stripped) + date
  const slug = (PAPER.name||ISSUE).normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || ISSUE;
  // English editions share the masthead name with their original, so tag them -en
  const langSuffix = PAPER.lang === "en" ? "-en" : "";
  a.download=`${slug}${langSuffix}-${(new Date()).toISOString().slice(0,10)}.png`;
  a.href=canvas.toDataURL("image/png"); a.click();
}

// ── Courrier des lecteurs (read = anonyme, commenter = connecté) ────────────
let ME_ID = null, MY_NAME = "", IS_EDITOR = false;

function fmtC(d){ return I18n.fmtDateTime(d,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); }

async function refreshMe(){
  const s = await Auth.session();
  ME_ID = s?.user?.id || null;
  if(ME_ID){ const p = await Profiles.me(); I18n.adoptProfile(p); MY_NAME = (p&&p.display_name) || s.user.email?.split("@")[0] || I18n.t("paper.reader"); IS_EDITOR = (p&&p.role)==="editor"; }
  else { MY_NAME=""; IS_EDITOR=false; }
}

async function loadComments(){
  let list=[]; try{ list = await Comments.list(ISSUE); }catch(e){ /* table maybe absent */ }
  $("#cList").innerHTML = list.length ? list.map(c=>`
    <div class="cmt">
      <div class="meta"><span class="who">${esc(c.author_name||I18n.t("paper.reader"))}</span><span>· ${fmtC(c.created_at)}</span>
        ${(c.author_id===ME_ID||IS_EDITOR)?`<button class="del" onclick="delComment('${c.id}')">${esc(I18n.t("paper.delete"))}</button>`:""}</div>
      <div class="txt">${esc(c.body)}</div>
    </div>`).join("") : `<div class="cmt-empty">${esc(I18n.t("paper.beFirst"))}</div>`;
}

function renderCBox(){
  const box=$("#cBox");
  if(ME_ID){
    box.innerHTML = `
      <div class="hint">${I18n.t("paper.commentAs",{name:esc(MY_NAME)})}</div>
      <textarea id="cText" placeholder="${esc(I18n.t("paper.reactionPh"))}"></textarea>
      <div class="row"><button onclick="postComment()">${esc(I18n.t("paper.publish"))}</button>
        <button class="ghost" onclick="cSignOut()">${esc(I18n.t("paper.signOut"))}</button></div>
      <div class="err" id="cErr"></div>`;
  } else {
    box.innerHTML = `
      <div class="hint">${esc(I18n.t("paper.freeRead"))}</div>
      <input id="cEmail" type="email" placeholder="${esc(I18n.t("auth.emailPh"))}">
      <input id="cPass" type="password" placeholder="${esc(I18n.t("paper.passwordPh"))}">
      <div class="row"><button onclick="cSignIn()">${esc(I18n.t("paper.signIn"))}</button>
        <button class="ghost" onclick="cSignUp()">${esc(I18n.t("paper.createReader"))}</button></div>
      <div style="font-size:.85rem;margin-top:.3rem"><a href="#" onclick="cForgot();return false">${esc(I18n.t("paper.forgotQ"))}</a></div>
      <div class="err" id="cErr"></div>`;
  }
}

async function postComment(){
  const t=$("#cText").value.trim(); if(!t){ $("#cErr").textContent=I18n.t("paper.writeSomething"); return; }
  try{ await Comments.add(ISSUE,t,MY_NAME); $("#cText").value=""; await loadComments(); }
  catch(e){ $("#cErr").textContent=e.message; }
}
async function delComment(id){ if(!confirm(I18n.t("paper.confirmDelete")))return; try{ await Comments.remove(id); await loadComments(); }catch(e){ alert(e.message); } }
async function cSignIn(){
  try{ await Auth.signInPassword($("#cEmail").value.trim(), $("#cPass").value); await afterAuth(); }
  catch(e){ $("#cErr").textContent=e.message; }
}
async function cSignUp(){
  const em=$("#cEmail").value.trim(), pw=$("#cPass").value;
  if(!em||pw.length<6){ $("#cErr").textContent=I18n.t("paper.emailPwMin"); return; }
  try{
    const d=await Auth.signUp(em,pw,{role:"reader"});
    if(d&&d.session){ await afterAuth(); }
    else { $("#cBox").innerHTML=`<div class="hint">${esc(I18n.t("paper.accountCreatedConfirm"))}</div>`; }
  }catch(e){ $("#cErr").textContent=e.message; }
}
async function cForgot(){
  const em=$("#cEmail").value.trim();
  if(!em){ $("#cErr").textContent=I18n.t("paper.enterEmailFirst"); return; }
  try{ await Auth.resetPassword(em);
    $("#cBox").innerHTML=`<div class="hint">${I18n.t("paper.resetSent",{email:esc(em)})}</div>`;
  }catch(e){ $("#cErr").textContent=e.message; }
}
async function cSignOut(){ await Auth.signOut(); await afterAuth(); }
async function afterAuth(){ await refreshMe(); renderCBox(); await loadComments(); }

async function initComments(){
  if(!configured || EMBED) return;   // no reader comments in the board preview
  $("#lecteurs").style.display="";
  await refreshMe(); renderCBox(); await loadComments();
  Comments.subscribe(ISSUE, loadComments);
}

// re-translate static chrome + re-render dynamic content when the UI language changes
document.addEventListener("daihbi:langchange", ()=>{
  I18n.apply(document);          // static chrome (+ sets <html lang> to UI lang)
  load();                        // re-render the paper (badges, dateline, footer count)
  if(configured) renderCBox();   // re-render the comment box strings
});

I18n.apply(document);   // translate static chrome on boot (set <html lang> to UI; render() overrides with content lang)

// live updates between collaborators
if(configured){ Placements.subscribe(ISSUE, load); AdPlacements.subscribe(ISSUE, load); }
load();
initComments();
</script>
