<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Petit Daihbi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1714; --paper:#f5efe1; --rule:#2a2622;
    --muted:#5b5349; --accent:#7a1f1a; --col-gap:1.6rem;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#6b6357;}
  body{font-family:"PT Serif",Georgia,"Times New Roman",serif;color:var(--ink);}

  .toolbar{
    position:sticky;top:0;z-index:50;display:flex;gap:.5rem;align-items:center;
    flex-wrap:wrap;padding:.6rem 1rem;background:#211f1c;color:#eee;
    font-family:system-ui,sans-serif;font-size:.85rem;box-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .toolbar .grow{flex:1}
  .toolbar b{font-family:"Playfair Display",serif;font-size:1rem;letter-spacing:.02em}
  .toolbar button,.toolbar a.btn{
    background:#3a3631;color:#f3ead6;border:1px solid #555;border-radius:5px;
    padding:.4rem .7rem;cursor:pointer;font:inherit;text-decoration:none;display:inline-flex;gap:.35rem;align-items:center;
  }
  .toolbar button:hover,.toolbar a.btn:hover{background:#4d473f}
  .toolbar button.primary{background:var(--accent);border-color:#a33;color:#fff}

  .stage{padding:1.5rem;display:flex;justify-content:center}
  .sheet{
    width:1100px;max-width:100%;background:var(--paper);
    background-image:radial-gradient(rgba(120,100,70,.06) 1px,transparent 1px);
    background-size:3px 3px;
    padding:2.6rem 2.8rem 3rem;box-shadow:0 6px 30px rgba(0,0,0,.5);border:1px solid #d8cdb2;
  }

  .ear{display:flex;justify-content:space-between;font-family:"Old Standard TT",serif;
       font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
       border-bottom:1px solid var(--rule);padding-bottom:.4rem}
  .nameplate{text-align:center;padding:.5rem 0 .2rem}
  .nameplate h1{font-family:"UnifrakturCook","Playfair Display",serif;font-weight:700;
    font-size:5.2rem;line-height:.95;margin:.2rem 0;letter-spacing:.01em}
  .nameplate .sub{font-family:"Old Standard TT",serif;font-style:italic;color:var(--muted);
    font-size:1rem;letter-spacing:.04em}
  /* per-paper masthead styles (data-driven by edition) */
  .plate-anton h1{font-family:"Anton","Oswald",Impact,sans-serif;font-weight:400;
    text-transform:uppercase;font-size:5.6rem;letter-spacing:.015em}
  .plate-anton .sub{font-family:"Oswald",sans-serif;font-style:normal;font-weight:700;
    text-transform:none;color:var(--ink);letter-spacing:.02em;font-size:1.05rem}
  /* L'Écho du Front — navy independent-journal identity */
  .plate-echo{--accent:#1f3a5f}
  .plate-echo h1{font-family:"Oswald",Impact,sans-serif;font-weight:700;
    text-transform:uppercase;font-size:5rem;letter-spacing:.02em;color:#1f3a5f}
  .plate-echo .nameplate .sub{font-family:"Oswald",sans-serif;font-style:normal;
    font-weight:500;text-transform:uppercase;color:#1f3a5f;letter-spacing:.04em;font-size:.95rem}
  .plate-echo .dateline-bar,.plate-echo .ear{color:#1f3a5f;border-color:#1f3a5f}
  .plate-echo .slogans{background:#1f3a5f;color:#fff;border:none;border-radius:2px;
    font-family:"Oswald",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  /* footer slogan bar (e.g. Vive les Wardens · Vive la 501e · Vive la France) */
  .slogans{display:flex;justify-content:space-between;align-items:center;gap:1rem;
    border-top:3px double var(--rule);border-bottom:3px double var(--rule);
    padding:.55rem .3rem;margin-top:1.5rem;
    font-family:"Old Standard TT",serif;font-weight:700;font-size:1.05rem;letter-spacing:.03em}
  .slogans span{flex:1;text-align:center}
  .slogans span:first-child{text-align:left}
  .slogans span:last-child{text-align:right}
  .dateline-bar{display:flex;justify-content:space-between;align-items:center;
    border-top:3px double var(--rule);border-bottom:3px double var(--rule);
    padding:.3rem .2rem;margin:.5rem 0 1.2rem;
    font-family:"Old Standard TT",serif;font-size:.78rem;letter-spacing:.05em;
    text-transform:uppercase;color:var(--ink)}
  .dateline-bar .mid{font-weight:700;letter-spacing:.12em}

  .lead{border-bottom:2px solid var(--rule);padding-bottom:1.1rem;margin-bottom:1.1rem}
  .kicker{font-family:"Old Standard TT",serif;text-transform:uppercase;letter-spacing:.18em;
    font-size:.72rem;color:var(--accent);font-weight:700;text-align:center;margin-bottom:.3rem}
  .lead h2{font-family:"Playfair Display",serif;font-weight:900;text-align:center;
    font-size:3.6rem;line-height:1.02;margin:.1rem 0 .3rem;text-transform:uppercase}
  .lead .deck{font-family:"Old Standard TT",serif;font-style:italic;text-align:center;
    font-size:1.15rem;color:var(--muted);margin-bottom:.5rem;
    border-bottom:1px solid #cbbfa3;padding-bottom:.7rem;max-width:46rem;margin:0 auto .5rem}
  .lead .byline{text-align:center;font-variant:small-caps;letter-spacing:.08em;font-size:.85rem;color:var(--muted);margin-bottom:.6rem}
  /* lead: drop-capped opening paragraph spans full width (clean drop cap),
     remaining paragraphs flow into balanced columns below */
  .lead .lead-open{font-size:1.06rem;line-height:1.55;text-align:justify;hyphens:auto;max-width:52rem;margin:0 auto}
  .lead .lead-open p{margin:0 0 .55rem}
  .lead .lead-open p:first-of-type::first-letter{font-family:"Playfair Display",serif;float:left;
    font-size:3.6rem;line-height:.66;padding:.12rem .5rem 0 0;color:var(--accent);font-weight:900}
  .lead .lead-cols{column-count:3;column-gap:var(--col-gap);column-rule:1px solid #cbbfa3;
    text-align:justify;hyphens:auto;font-size:1rem;line-height:1.5;margin-top:.7rem}
  .lead .lead-cols p{margin:0 0 .55rem;break-inside:avoid-column}

  .well{column-count:3;column-gap:var(--col-gap);column-rule:1px solid #cbbfa3;text-align:justify;hyphens:auto}
  .story{break-inside:avoid;margin:0 0 1.3rem;padding-bottom:1rem;border-bottom:1px solid #cbbfa3}
  .story:last-child{border-bottom:none}
  .story .kicker{text-align:left;margin-bottom:.15rem}
  .story h3{font-family:"Playfair Display",serif;line-height:1.04;margin:.1rem 0 .35rem}
  .story.major h3{font-size:1.8rem;font-weight:900}
  .story.minor h3{font-size:1.28rem;font-weight:700}
  .story.brief h3{font-size:1.05rem;font-weight:700}
  .story .byline{font-variant:small-caps;letter-spacing:.06em;font-size:.78rem;color:var(--muted);margin-bottom:.3rem}
  .story .body{font-size:.95rem;line-height:1.46}
  .story .body p{margin:0 0 .5rem}
  .story.brief .body{font-size:.9rem}
  .story img,.lead img{width:100%;height:auto;filter:grayscale(1) contrast(1.1);margin:.3rem 0 .5rem;border:1px solid #b9ad90}
  .story.major{-webkit-column-span:all;column-span:all;border-bottom:2px solid var(--rule);padding-bottom:.9rem;margin-bottom:1.1rem}
  .story.major .body{column-count:2;column-gap:var(--col-gap)}

  .colophon{margin-top:1.4rem;border-top:3px double var(--rule);padding-top:.5rem;text-align:center;
    font-family:"Old Standard TT",serif;font-size:.72rem;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
  .empty{padding:4rem 2rem;text-align:center;color:var(--muted);font-style:italic}
  .empty a{color:var(--accent)}

  @page{size:A3 portrait;margin:12mm}
  @media print{
    body{background:#fff}
    .toolbar{display:none !important}
    .stage{padding:0}
    .sheet{box-shadow:none;border:none;width:100%;padding:0}
    .well{column-count:5}
  }
</style>
</head>
<body>

<div class="toolbar">
  <b>Le Petit Daihbi</b>
  <span class="grow"></span>
  <button onclick="load()">↻ Refresh</button>
  <a class="btn" href="editor.html">✎ Edit articles</a>
  <button onclick="savePNG()">🖼 PNG</button>
  <button class="primary" onclick="window.print()">⎙ Print / PDF</button>
</div>

<div class="stage">
  <div class="sheet" id="sheet"><div class="empty">Loading the press…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="config.js"></script>
<script src="papers.js"></script>
<script src="daihbi.js"></script>
<script>
const $ = (s,r=document)=>r.querySelector(s);
const { Articles, esc, md, configured } = window.Daihbi;

// Paper registry now lives in papers.js (shared with the editor).
const PAPERS = window.DAIHBI_PAPERS || {};
const ISSUE = window.Daihbi.ISSUE;
const PAPER = PAPERS[ISSUE] || {
  name: ISSUE.replace(/-/g," ").replace(/\b\w/g,c=>c.toUpperCase()),
  tagline: "", plate: "plate-fraktur",
  ear: ["Édition", "", "Warden"], slogans: [],
};

// reflect the chosen paper in the chrome
document.title = PAPER.name;
$(".toolbar b").innerHTML = PAPER.name;
$(".toolbar a.btn").href = "editor.html?issue=" + encodeURIComponent(ISSUE);
$("#sheet").className = "sheet " + (PAPER.plate || "");

function imgTag(url){ return url ? `<img src="${esc(url)}" alt="">` : ""; }
function kicker(a){ return a.kicker ? `<div class="kicker">${esc(a.kicker)}</div>` : ""; }
function byline(a){ return a.byline ? `<div class="byline">par ${esc(a.byline)}</div>` : ""; }

function renderLead(a){
  // split the rendered body into the opening paragraph (drop-capped, full width)
  // and the remaining paragraphs (flowed into columns) — avoids the drop-cap
  // landing in the wrong column inside a multicol block.
  const html = md(a.body) || "<p></p>";
  const m = html.match(/^(\s*<p>[\s\S]*?<\/p>)([\s\S]*)$/);
  const open = m ? m[1] : html;
  const rest = (m ? m[2] : "").trim();
  return `<section class="lead">
    ${kicker(a)}<h2>${esc(a.headline)}</h2>
    ${a.subhead ? `<div class="deck">${esc(a.subhead)}</div>` : ""}
    ${byline(a)}${imgTag(a.image_url)}
    <div class="lead-open">${open}</div>
    ${rest ? `<div class="lead-cols">${rest}</div>` : ""}
  </section>`;
}
function renderStory(a){
  return `<article class="story ${esc(a.weight)}">
    ${kicker(a)}<h3>${esc(a.headline)}</h3>${byline(a)}${imgTag(a.image_url)}
    ${a.subhead ? `<p><em>${esc(a.subhead)}</em></p>` : ""}
    <div class="body">${md(a.body)}</div>
  </article>`;
}
function fmtDate(d){
  return d.toLocaleDateString("fr-FR",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
}

async function load(){
  if(!configured){
    $("#sheet").innerHTML = `<div class="empty">Not connected yet.<br>
      Add your Supabase URL + anon key to <code>web/config.js</code>.</div>`;
    return;
  }
  let arts;
  try{ arts = await Articles.listPublished(); }
  catch(e){ $("#sheet").innerHTML = `<div class="empty">Could not load articles.<br>${esc(e.message)}</div>`; return; }

  const leads = arts.filter(a=>a.weight==="lead");
  const lead = leads[0] || null;
  const rest = arts.filter(a=>a!==lead).map(a=> a.weight==="lead" ? {...a,weight:"major"} : a);

  const footer = PAPER.slogans && PAPER.slogans.length
    ? `<div class="slogans">${PAPER.slogans.map(s=>`<span>${s}</span>`).join("")}</div>`
    : `<div class="colophon">${esc(PAPER.name)} · ${arts.length} article${arts.length>1?"s":""} · Warden</div>`;

  $("#sheet").innerHTML = `
    <div class="ear"><span>${PAPER.ear[0]||""}</span><span>${PAPER.ear[1]||""}</span><span>${PAPER.ear[2]||""}</span></div>
    <div class="nameplate ${PAPER.plate}">
      <h1>${esc(PAPER.name)}</h1>
      ${PAPER.tagline ? `<div class="sub">${PAPER.tagline}</div>` : ""}
    </div>
    <div class="dateline-bar">
      <span>${fmtDate(new Date())}</span>
      <span class="mid">ÉDITION « ${esc(ISSUE).toUpperCase()} »</span>
      <span>${PAPER.ear[2]||""}</span>
    </div>
    ${arts.length===0
      ? `<div class="empty">Aucun article publié.<br><a href="editor.html?issue=${encodeURIComponent(ISSUE)}">En écrire un →</a></div>`
      : (lead?renderLead(lead):"") +
        (rest.length?`<div class="well">${rest.map(renderStory).join("")}</div>`:"") +
        footer}
  `;
}

async function savePNG(){
  if(typeof html2canvas==="undefined"){ alert("PNG export needs internet (html2canvas). Use Print → Save as PDF."); return; }
  const canvas = await html2canvas($("#sheet"),{scale:2,backgroundColor:"#f5efe1",useCORS:true});
  const a=document.createElement("a");
  a.download=`le-petit-daihbi-${(new Date()).toISOString().slice(0,10)}.png`;
  a.href=canvas.toDataURL("image/png"); a.click();
}

// live updates between collaborators
if(configured) Articles.subscribe(load);
load();
</script>
</body>
</html>
