<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Petit Daihbi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=PT+Mono&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Abril+Fatface&family=Marcellus&family=Yeseva+One&family=Bebas+Neue&family=Pirata+One&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1714; --paper:#f5efe1; --rule:#2a2622;
    --muted:#5b5349; --accent:#7a1f1a; --col-gap:1.6rem;
    /* hairlines / borders / divider — themes can retint these */
    --hair:#cbbfa3; --imgborder:#b9ad90; --dash:#9a7f55; --aihead:#7a5a2a;
    --grain:rgba(120,100,70,.06);
    /* type roles — a theme swaps these to change the whole paper's voice */
    --font-body:"PT Serif",Georgia,"Times New Roman",serif;
    --font-head:"Playfair Display",Georgia,serif;
    --font-display:"UnifrakturCook","Playfair Display",serif;
    --font-meta:"Old Standard TT",Georgia,serif;
    --font-mono:"PT Mono","Courier Prime",ui-monospace,monospace;
    /* photo treatment — duotone/grayscale per theme */
    --photo-filter:grayscale(.55) sepia(.22) contrast(1.05);
    --avatar-filter:grayscale(.5) sepia(.38) contrast(1.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#6b6357;}
  body{font-family:var(--font-body);color:var(--ink);}

  /* .toolbar nav styled by shared nav.css */
  .toolbar{
    position:sticky;top:0;z-index:50;display:flex;gap:.5rem;align-items:center;
    flex-wrap:wrap;padding:.6rem 1rem;font-size:.85rem;
  }
  .toolbar .grow{flex:1}
  .toolbar b{font-size:1rem}

  .stage{padding:1.5rem;display:flex;justify-content:center}
  /* embed/preview mode (board.html iframe, ?embed=1): a clean, chrome-free,
     scaled-to-fit miniature front page. The sheet keeps its true 1100px width
     so the whole layout scales down (via applyEmbed's zoom) instead of reflowing
     to one column; toolbar + reader comments are hidden. */
  body.embed{background:#fff}
  body.embed .toolbar{display:none}
  body.embed .lecteurs{display:none !important}
  body.embed .stage{padding:0;background:#fff}
  body.embed .sheet{width:1100px;max-width:none;margin:0;box-shadow:none;border:none}
  /* board "all" mode: every article is a clickable edit target; drafts dimmed + ribboned */
  body.allmode .lead,body.allmode .story,body.allmode .adbox{position:relative;cursor:pointer;border-radius:2px;transition:outline-color .1s}
  body.allmode .lead:hover,body.allmode .story:hover,body.allmode .adbox:hover{outline:2px solid var(--accent);outline-offset:3px}
  body.allmode .draft{opacity:.5}
  /* floating "edit image" affordance shown on photo hover (board edit mode) */
  .img-edit-btn{position:absolute;z-index:9;width:28px;height:28px;padding:0;line-height:1;font-size:.95rem;cursor:pointer;
    border:1px solid var(--imgborder);background:rgba(255,255,255,.94);color:#3a342a;border-radius:7px;
    box-shadow:0 1px 5px rgba(0,0,0,.3);display:none}
  .img-edit-btn:hover{background:#fff;outline:2px solid var(--accent);outline-offset:1px}
  /* drag-to-resize grip (bottom-right of a photo) — width snaps to the story's columns */
  .img-resize-grip{position:absolute;z-index:9;width:18px;height:18px;cursor:nwse-resize;display:none;
    background:#fff;border:1.5px solid var(--accent);border-radius:0 0 4px 0;box-shadow:0 1px 4px rgba(0,0,0,.35);touch-action:none}
  .img-resize-grip::after{content:"";position:absolute;right:3px;bottom:3px;width:7px;height:7px;
    border-right:2px solid var(--accent);border-bottom:2px solid var(--accent)}
  .rsz-badge{position:absolute;z-index:10;background:var(--accent);color:#fff;font-family:var(--font-meta),system-ui;
    font-size:.66rem;font-weight:700;letter-spacing:.04em;padding:.1rem .4rem;border-radius:4px;pointer-events:none;display:none;white-space:nowrap}
  body.allmode.resizing{cursor:nwse-resize!important;user-select:none}
  /* gap-filler: a subtle ＋ over a well's ragged blank tail (board mode), bright on hover */
  .gap-add{position:absolute;z-index:8;width:38px;height:38px;border-radius:50%;border:2px dashed var(--accent);
    background:rgba(255,255,255,.85);color:var(--accent);font-size:1.25rem;font-weight:700;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;opacity:.3;transition:opacity .12s,transform .12s}
  .gap-add:hover{opacity:1;background:#fff;transform:scale(1.08);box-shadow:0 2px 8px rgba(0,0,0,.25)}
  /* drag-to-arrange: grab a story/lead by its text and drop it elsewhere on the
     front. The dragged card dims; a coloured bar marks where it will land. */
  body.allmode .lead,body.allmode .story{cursor:grab}
  body.allmode.dragging,body.allmode.dragging *{cursor:grabbing!important;user-select:none}
  body.allmode .story.dragsrc,body.allmode .lead.dragsrc{opacity:.4;outline:2px dashed var(--accent);outline-offset:3px}
  .drop-ind{position:absolute;z-index:11;background:var(--accent);border-radius:3px;pointer-events:none;display:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.6),0 1px 6px rgba(0,0,0,.35)}
  .drop-ind.vert{width:4px}.drop-ind.horiz{height:4px}
  body.allmode .draft::after{content:var(--drafttxt,"DRAFT");position:absolute;top:.25rem;right:.25rem;z-index:3;
    background:var(--accent);color:#fff;font-family:var(--font-meta);font-size:.6rem;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;padding:.06rem .42rem;border-radius:2px;pointer-events:none}
  .sheet{
    width:1100px;max-width:100%;background:var(--paper);
    background-image:radial-gradient(var(--grain) 1px,transparent 1px);
    background-size:3px 3px;
    padding:2.6rem 2.8rem 3rem;box-shadow:0 6px 30px rgba(0,0,0,.5);border:1px solid var(--imgborder);
  }

  .ear{display:flex;justify-content:space-between;font-family:var(--font-meta);
       font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
       border-bottom:1px solid var(--rule);padding-bottom:.4rem}
  .nameplate{text-align:center;padding:.5rem 0 .2rem}
  /* regiment crests flanking the masthead (full colour, not toned) */
  .plate-row{display:flex;align-items:center;justify-content:center;gap:1.6rem}
  .plate-row .plate-name{flex:0 1 auto;min-width:0}
  .emblem{height:92px;width:auto;flex:0 0 auto;object-fit:contain}
  .emblem-spacer{flex:0 0 92px}
  @media(max-width:640px){.emblem,.emblem-spacer{height:54px;flex-basis:54px}}
  .nameplate h1{font-family:var(--font-display);font-weight:700;
    font-size:5.2rem;line-height:.95;margin:.2rem 0;letter-spacing:.01em}
  .nameplate .sub{font-family:var(--font-meta);font-style:italic;color:var(--muted);
    font-size:1rem;letter-spacing:.04em}
  /* per-paper masthead styles (data-driven by edition) */
  .plate-anton h1{font-family:"Anton","Oswald",Impact,sans-serif;font-weight:400;
    text-transform:uppercase;font-size:5.6rem;letter-spacing:.015em}
  .plate-anton .sub{font-family:"Oswald",sans-serif;font-style:normal;font-weight:700;
    text-transform:none;color:var(--ink);letter-spacing:.02em;font-size:1.05rem}
  /* L'Écho du Front — navy independent-journal identity */
  .plate-echo{--accent:#1f3a5f}
  .plate-echo h1{font-family:"Oswald",Impact,sans-serif;font-weight:700;
    text-transform:uppercase;font-size:5rem;letter-spacing:.02em;color:#1f3a5f}
  .plate-echo .nameplate .sub{font-family:"Oswald",sans-serif;font-style:normal;
    font-weight:500;text-transform:uppercase;color:#1f3a5f;letter-spacing:.04em;font-size:.95rem}
  .plate-echo .dateline-bar,.plate-echo .ear{color:#1f3a5f;border-color:#1f3a5f}
  .plate-echo .slogans{background:#1f3a5f;color:#fff;border:none;border-radius:2px;
    font-family:"Oswald",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  /* footer slogan bar (e.g. Vive les Wardens · Vive la 501e · Vive la France) */
  .slogans{display:flex;justify-content:space-between;align-items:center;gap:1rem;
    border-top:3px double var(--rule);border-bottom:3px double var(--rule);
    padding:.55rem .3rem;margin-top:1.5rem;
    font-family:var(--font-meta);font-weight:700;font-size:1.05rem;letter-spacing:.03em}
  .slogans span{flex:1;text-align:center}
  .slogans span:first-child{text-align:left}
  .slogans span:last-child{text-align:right}
  .dateline-bar{display:flex;justify-content:space-between;align-items:center;
    border-top:3px double var(--rule);border-bottom:3px double var(--rule);
    padding:.3rem .2rem;margin:.5rem 0 1.2rem;
    font-family:var(--font-meta);font-size:.78rem;letter-spacing:.05em;
    text-transform:uppercase;color:var(--ink)}
  .dateline-bar .mid{font-weight:700;letter-spacing:.12em}

  .lead{border-bottom:2px solid var(--rule);padding-bottom:1.1rem;margin-bottom:1.1rem}
  .kicker{font-family:var(--font-meta);text-transform:uppercase;letter-spacing:.18em;
    font-size:.72rem;color:var(--accent);font-weight:700;text-align:center;margin-bottom:.3rem}
  .lead h2{font-family:var(--font-head);font-weight:900;text-align:center;
    font-size:3.6rem;line-height:1.02;margin:.1rem 0 .3rem;text-transform:uppercase}
  .lead .deck{font-family:var(--font-meta);font-style:italic;text-align:center;
    font-size:1.15rem;color:var(--muted);margin-bottom:.5rem;
    border-bottom:1px solid var(--hair);padding-bottom:.7rem;max-width:46rem;margin:0 auto .5rem}
  .lead .byline{text-align:center;font-variant:small-caps;letter-spacing:.08em;font-size:.85rem;color:var(--muted);margin-bottom:.6rem}
  /* lead: drop-capped opening paragraph spans full width (clean drop cap),
     remaining paragraphs flow into balanced columns below */
  .lead .lead-open{font-size:1.06rem;line-height:1.55;text-align:justify;hyphens:auto;max-width:52rem;margin:0 auto}
  .lead .lead-open p{margin:0 0 .55rem}
  .lead .lead-open p:first-of-type::first-letter{font-family:var(--font-head);float:left;
    font-size:3.6rem;line-height:.66;padding:.12rem .5rem 0 0;color:var(--accent);font-weight:900}
  .lead .lead-cols{column-count:3;column-gap:var(--col-gap);column-rule:1px solid var(--hair);
    text-align:justify;hyphens:auto;font-size:1rem;line-height:1.5;margin-top:.7rem}
  .lead .lead-cols p{margin:0 0 .55rem;break-inside:avoid-column}
  /* lead with an inset photo: single justified flow, text wraps the floated photo */
  .lead-flow{max-width:62rem;margin:0 auto;text-align:justify;hyphens:auto;font-size:1.02rem;line-height:1.55}
  .lead-flow p{margin:0 0 .6rem}
  .lead-flow .lead-open{max-width:none;margin:0}
  /* lead photo wrappers are <figure>; border/filter live on the inner image */
  .lead-flow .lead-photo{float:right;width:42%;max-width:380px;margin:.2rem 0 .7rem 1.4rem}
  .lead-flow .lead-photo.flt-left{float:left;margin:.2rem 1.4rem .7rem 0}
  .lead-flow .lead-photo .photoframe > img{max-height:none}
  @media(max-width:640px){.lead-flow .lead-photo{float:none;width:100%;margin:.4rem 0}}
  /* lead hero banner: photo above the text, full width and bigger than the float */
  .lead-banner{display:block;width:100%;margin:.55rem 0 .95rem}
  .lead-banner .photoframe > img{max-height:520px;object-fit:cover}
  .lead .cropwrap > img{max-height:none}

  /* masonry "snap" grid: stories are cards packed into the shortest column via
     dense flow + JS row-spans (packWell); DOM order is preserved (the grid only
     changes visual placement). grid-auto-rows is the fine row unit packWell
     spans against; align-items:start lets each card size to its content. */
  .well{display:grid;grid-template-columns:repeat(var(--wellcols,3),minmax(0,1fr));
    column-gap:var(--col-gap);grid-auto-rows:8px;grid-auto-flow:row dense;align-items:start;
    text-align:justify;hyphens:auto}
  /* rubrique (section) heading band above a section's well (sections.sql) */
  .section-head{display:flex;align-items:center;gap:.7rem;margin:1.4rem 0 .9rem;
    font-family:var(--font-head);font-weight:800;text-transform:uppercase;letter-spacing:.1em;
    font-size:.92rem;color:var(--accent)}
  .section-head::before{content:"";flex:0 0 1.1rem;height:0;border-top:3px solid var(--accent)}
  .section-head::after{content:"";flex:1;height:0;border-top:1px solid var(--rule);opacity:.5}
  .section-head + .well{margin-top:0}
  /* ── fixed-grid layout template (templates.sql): containers placed by col/row,
        each holding ＋ slots; a filled cell holds a story, an empty one a ＋ ── */
  .tplgrid{display:grid;gap:1.1rem;grid-auto-rows:minmax(60px,auto);margin:.4rem 0 1rem}
  .tplcont{display:flex;flex-direction:column;gap:.5rem;min-width:0}
  .tplcont-h{font-family:var(--font-head);font-weight:800;text-transform:uppercase;
    letter-spacing:.09em;font-size:.74rem;color:var(--accent);border-bottom:1px solid var(--rule);padding-bottom:.2rem}
  .tplslots{display:grid;gap:1rem;flex:1;align-items:start}
  .tplcell{min-width:0}
  .tplstory{min-width:0}
  .tplstory h2{font-family:var(--font-display);font-weight:800;line-height:1.04;font-size:1.9rem;margin:.1rem 0 .2rem}
  .tplstory h3{font-family:var(--font-head);font-weight:700;line-height:1.08;font-size:1.18rem;margin:.1rem 0 .2rem}
  .tplstory .body{text-align:justify;hyphens:auto;font-size:.92rem}
  .tplstory.k-brief .body{font-size:.82rem}
  .tplphoto{display:block;margin:.1rem 0 .5rem;padding:0}
  .tplempty{display:flex}
  .tplempty.pub{display:none}                   /* empty cells only show on the board */
  .tplplus{flex:1;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.15rem;border:2px dashed var(--rule);border-radius:8px;background:#00000005;color:var(--muted);
    cursor:pointer;font:inherit}
  .tplplus:hover{border-color:var(--accent);color:var(--accent);background:#7a1f1a0d}
  .tplplus > span{font-size:1.7rem;line-height:1}
  .tplplus > small{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em}
  .tpl-loose{margin-top:1rem}
  /* ── dummy element types (dummy_layout.sql) — FINISHED look (public reader) ── */
  .tplstory.elem-quote .pullquote{font-family:var(--font-display);font-size:1.5rem;line-height:1.25;
    font-style:italic;color:var(--accent);border-top:3px solid var(--accent);border-bottom:1px solid var(--rule);
    margin:.2rem 0;padding:.5rem 0;quotes:"«" "»";}
  .tplstory.elem-quote .pullquote::before{content:open-quote}.tplstory.elem-quote .pullquote::after{content:close-quote}
  .tplstory.elem-mugshot .mugshot{margin:0;text-align:center}
  .tplstory.elem-mugshot .mugshot .mugph,.tplstory.elem-mugshot figure.photo{width:100%;aspect-ratio:1/1}
  .tplstory.elem-mugshot .mugph{display:block;background:#0000000d;border:1px solid var(--imgborder)}
  .tplstory.elem-mugshot figcaption{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:.2rem}
  .tplstory.elem-cartoon figure.photo{border:1.5px solid var(--ink)}
  .tplstory .cap{font-size:.68rem;color:var(--muted);font-style:italic;margin-top:.18rem}
  /* ── DUMMY schematic — board/planning view only (body.allmode) ── */
  .tplstory.dummy{position:relative}
  .tplstory.dummy .dlabel{font-family:var(--font-head);font-weight:800;text-transform:uppercase;letter-spacing:.05em;
    font-size:.6rem;color:var(--accent);border-bottom:1px dashed var(--rule);padding-bottom:.12rem;margin-bottom:.25rem}
  .tplstory.dummy .dlabel i{font-style:normal;opacity:.7;font-weight:600}
  .tplstory.dummy h2{font-size:1.5rem;line-height:1.02;margin:.1rem 0}
  .tplstory.dummy h3{font-size:1rem;line-height:1.05;margin:.1rem 0}
  .tplstory.dummy .byl{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:.05rem 0 .25rem}
  .tplstory.dummy .imgph{width:100%;aspect-ratio:4/3;background:repeating-linear-gradient(135deg,#0000,#0000 9px,#0000000f 9px,#0000000f 18px);border:1px dashed var(--rule)}
  .tplstory.dummy.elem-cartoon .imgph{aspect-ratio:1/1}
  .tplstory.dummy.elem-mugshot .mugph,.tplstory.dummy.elem-mugshot figure.photo{width:100%;aspect-ratio:1/1}
  .tplstory.dummy .pullquote{border-top:2px solid var(--accent);padding-top:.3rem;font-style:italic;color:var(--accent);font-size:1.05rem}
  /* greeking: lorem-bars standing in for body copy; theme-agnostic via currentColor */
  .greek{display:flex;flex-direction:column;gap:5px;margin-top:.2rem;opacity:.55}
  .greek > span{height:5px;border-radius:2px;background:currentColor}
  .greek > span:nth-child(3n){width:78%}.greek > span:nth-child(3n+1){width:96%}.greek > span:nth-child(3n+2){width:88%}
  .greek > span:last-child{width:42%}
  /* transparency split: human stories (2-col) on the left, AI (1-col) on the right */
  .front{display:grid;grid-template-columns:2fr 1fr;gap:1.6rem;align-items:start}
  .front .zone-human{min-width:0}
  .front .zone-ai{min-width:0;border-left:2px dashed var(--dash);padding-left:1.2rem}
  .front .zone-ai .ai-head{font-family:var(--font-head);font-weight:700;text-transform:uppercase;
    letter-spacing:.09em;font-size:.74rem;color:var(--aihead);border-bottom:2px dashed var(--dash);padding-bottom:.35rem;margin-bottom:.8rem}
  .front .zone-ai .story h3{font-size:1.3rem;font-weight:800}
  .front .zone-ai .story .body{font-size:.9rem}
  .well2{--wellcols:2}
  @media(max-width:760px){.front{grid-template-columns:1fr}
    .front .zone-ai{border-left:none;border-top:2px dashed var(--dash);padding-left:0;padding-top:.8rem}}
  @media(max-width:820px){.well{--wellcols:2}}
  @media(max-width:520px){.well,.well2{--wellcols:1!important}}   /* beats the inline grid_cols on phones */
  /* each story is a grid card; align-items:start keeps it content-height inside
     its (taller) spanned grid area, so the divider hugs the text. */
  .story{break-inside:avoid;margin:0;padding-bottom:1rem;border-bottom:1px solid var(--hair)}
  .story .kicker{text-align:left;margin-bottom:.15rem}
  /* headlines: left-aligned & balanced, never justified/hyphenated (the .well sets
     justify+hyphens for body text, which the h3 would otherwise inherit → ugly
     word gaps and mid-word breaks like "se-ront-ils"). */
  .story h3{font-family:var(--font-head);line-height:1.04;margin:.1rem 0 .35rem;text-align:left;text-wrap:balance;hyphens:none}
  .story.major h3{font-size:1.8rem;font-weight:900}
  .story.minor h3{font-size:1.28rem;font-weight:700}
  .story.brief h3{font-size:1.05rem;font-weight:700}
  .story .byline{font-variant:small-caps;letter-spacing:.06em;font-size:.78rem;color:var(--muted);margin-bottom:.3rem}
  /* body flows into --bodycols internal text columns (set inline per story to
     match its column span); single column when an inset photo is floated. */
  .story .body{font-size:.95rem;line-height:1.46;column-count:var(--bodycols,1);column-gap:var(--col-gap)}
  .story .body p{margin:0 0 .5rem}
  .story.brief .body{font-size:.9rem}
  .story img,.lead img{width:100%;height:auto;filter:var(--photo-filter);margin:.3rem 0 .5rem;border:1px solid var(--imgborder)}
  /* photo inside the body is a banner that spans all text columns (so the text
     keeps flowing in `--bodycols` columns below it); .inset snaps it to fewer
     columns (narrower banner), .full fills the story width. The deck spans all. */
  /* a photo is a <figure class="photo"> wrapping the image (or crop frame) + its
     author credit, so the caption stays under the image in every position. */
  .story .body > figure.photo{column-span:all;display:block;margin:.1rem 0 .55rem;padding:0}
  .story .body > figure.photo.full{width:100%}
  .story .body > figure.photo.inset{width:var(--inset)}
  /* Word-style float positions: image hugs a side, text wraps (single-column body) */
  .story .body > figure.photo.flt-left{column-span:none;float:left;width:var(--inset);margin:.15rem .8rem .4rem 0}
  .story .body > figure.photo.flt-right{column-span:none;float:right;width:var(--inset);margin:.15rem 0 .4rem .8rem}
  /* the image (or crop frame) sits in a relative .photoframe so an overlay can be
     positioned over it without covering the credit line below */
  figure.photo > .photoframe{display:block;position:relative;width:100%;line-height:0}
  .photoframe > img,.photoframe > .cropwrap{display:block;width:100%;height:auto;margin:0;border:1px solid var(--imgborder);filter:var(--photo-filter)}
  /* overlay text laid OVER the image (img_overlay.sql): a caption band or a poster
     title, with a dark scrim for legibility; never filtered, never grabs the pointer
     (so the board's edit-mode hover/dblclick still reach the image underneath). */
  .imgoverlay{position:absolute;left:0;right:0;margin:0;box-sizing:border-box;pointer-events:none;color:#fff;hyphens:none}
  .imgoverlay.ov-bottom{bottom:0}
  .imgoverlay.ov-top{top:0}
  .imgoverlay.ov-center{top:50%;transform:translateY(-50%);text-align:center}
  .ov-band{font-family:var(--font-meta);font-size:.82rem;font-weight:700;letter-spacing:.02em;line-height:1.18;text-shadow:0 1px 3px rgba(0,0,0,.65);padding:1.5rem .6rem .5rem}
  .ov-band.ov-top{padding:.5rem .6rem 1.5rem}
  .ov-band.ov-center{padding:.55rem .7rem}
  .ov-band.ov-bottom{background:linear-gradient(to top,rgba(0,0,0,.74),rgba(0,0,0,0))}
  .ov-band.ov-top{background:linear-gradient(to bottom,rgba(0,0,0,.74),rgba(0,0,0,0))}
  .ov-band.ov-center{background:rgba(0,0,0,.5)}
  .ov-cover{font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:clamp(1.3rem,4.4vw,2.7rem);line-height:1.02;letter-spacing:.01em;text-shadow:0 2px 12px rgba(0,0,0,.72);padding:.6rem .7rem}
  .ov-cover.ov-bottom{padding-top:1.6rem;background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,0))}
  .ov-cover.ov-top{padding-bottom:1.6rem;background:linear-gradient(to bottom,rgba(0,0,0,.62),rgba(0,0,0,0))}
  .ov-cover.ov-center{background:rgba(0,0,0,.42)}
  /* crop frame: clips a cover-fit image so a forced aspect-ratio + focal point + zoom apply */
  .cropwrap{overflow:hidden;line-height:0;background:#0000000d}
  .cropwrap > img{width:100%;height:100%;object-fit:cover;display:block;border:0;margin:0;filter:none}
  /* photo credit (illustrator) under every image */
  figure.photo > .credit{font-size:.62rem;line-height:1.3;color:var(--muted);font-style:italic;margin:.16rem 0 0;text-align:left;hyphens:none}
  .story .body > .deckline{column-span:all;margin:.1rem 0 .45rem;font-size:.92rem;text-align:left;hyphens:none}
  @media(max-width:520px){.story .body{column-count:1!important}}
  /* foot-of-page feuilleton band (full-width brief), under the well */
  .footband{grid-column:auto;border-top:3px double var(--rule);border-bottom:none;
    margin-top:1.3rem;padding:.7rem 0 0;break-inside:avoid}
  .footband > h3{font-family:var(--font-head);font-weight:900;font-size:1.55rem;text-align:left;text-wrap:balance;margin:.1rem 0 .2rem}
  .footband .deckline{font-style:italic;color:var(--muted);margin:.1rem 0 .45rem}
  .footband .band-body{column-count:5;column-gap:var(--col-gap);column-rule:1px solid var(--hair);
    text-align:justify;hyphens:auto;font-size:.86rem;line-height:1.46;margin-top:.3rem}
  .footband .band-body p{margin:0 0 .5rem;break-inside:avoid}
  @media(max-width:760px){.footband .band-body{column-count:2}}
  @media(max-width:520px){.footband .band-body{column-count:1}}
  .byline .avatar{width:22px;height:22px;border-radius:50%;object-fit:cover;border:1px solid #2a2620;
    filter:var(--avatar-filter);vertical-align:middle;margin-right:.4rem;background:#e9e1cd}
  .lead .byline .avatar{width:32px;height:32px;margin-right:.55rem}
  .byline .src{display:inline-block;font-variant:normal;font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;
    padding:.05rem .42rem;border-radius:999px;margin-left:.4rem;vertical-align:middle;border:1px solid var(--imgborder);color:#6a6253}
  .byline .src.reg{background:#e7decb}
  .byline .src.ai{background:#efe4d2;border-style:dashed;border-color:var(--dash);color:#7a5a2a}
  .byline .src.tr{background:#e7eef0;border-style:dashed;border-color:#9fb3bd;color:#3a5560}
  /* tiny content-language badge — shown only when a story's lang differs from the edition's */
  .lbadge{font-family:"Oswald",system-ui,sans-serif;font-size:.58rem;font-weight:700;letter-spacing:.06em;
    background:#1f3a5f;color:#fff;border-radius:3px;padding:.08rem .3rem;
    vertical-align:middle;margin-left:.4rem}
  .lead img{max-height:380px;object-fit:cover;margin:.5rem 0 .2rem}
  /* a "major" story is a wide card spanning two grid columns (full width in the
     2-col human zone); its body flows in matching internal text columns. The
     grid-column span is set inline per story by renderStory (editor-controlled),
     so the static span here is only the auto/no-JS fallback. */
  .story.major{border-bottom:2px solid var(--rule);padding-bottom:.9rem}
  @media(max-width:520px){.story[style*="grid-column"]{grid-column:span 1 !important}}

  /* sponsor réclame box in the well */
  .adbox{break-inside:avoid;border:2px solid var(--rule);padding:.5rem .6rem;margin:0;
    background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(120,100,70,.05) 6px,rgba(120,100,70,.05) 12px)}
  .adbox .ad-label{text-align:center;font-family:var(--font-meta);text-transform:uppercase;
    letter-spacing:.3em;font-size:.6rem;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:.25rem;margin-bottom:.4rem}
  .adbox .ad-title{font-family:var(--font-head);font-weight:900;text-align:center;font-size:1.3rem;line-height:1.05;margin:.1rem 0}
  .adbox .ad-maker{text-align:center;font-variant:small-caps;letter-spacing:.06em;color:var(--accent);font-size:.85rem;margin-bottom:.3rem}
  .adbox .ad-link{text-align:center;font-size:.72rem;color:var(--muted);word-break:break-all;margin-top:.3rem}
  .adbox .body{font-size:.92rem;line-height:1.4;text-align:center}

  .colophon{margin-top:1.4rem;border-top:3px double var(--rule);padding-top:.5rem;text-align:center;
    font-family:var(--font-meta);font-size:.72rem;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
  .empty{padding:4rem 2rem;text-align:center;color:var(--muted);font-style:italic}
  .empty a{color:var(--accent)}

  /* ─── PAPER THEMES ───────────────────────────────────────────────────────
     A theme is a full reskin of the sheet: palette + type roles + photo
     treatment + texture. Applied as `theme-<key>` on .sheet; selected by the
     toolbar picker (live, per-edition) and registered in themes.js. The
     per-edition `plate-*` masthead identity layers on top of the theme.
     `theme-classic` keeps the :root defaults, so it needs no rules. */

  /* Fujimoto / "Look Back" — warm newsprint, soft charcoal ink, faded
     terracotta accent, overcast blue-grey rules; literary serifs for the
     copy and a utilitarian monospace for kickers/datelines/captions, with a
     halftone dot pattern on the tinted blocks for an old-press feel. */
  .sheet.theme-fujimoto{
    --ink:#2B2D31; --paper:#EADFC9; --rule:#626D71; --muted:#626D71; --accent:#C87A65;
    --hair:#cabd9e; --imgborder:#b3a684; --dash:#C87A65; --aihead:#a55c47;
    --grain:rgba(98,109,113,.10);
    --font-body:"EB Garamond","Lora",Georgia,serif;
    --font-head:"PT Serif","Playfair Display",Georgia,serif;
    --font-display:"PT Serif","Playfair Display",serif;
    --font-meta:"PT Mono","Courier Prime",ui-monospace,monospace;
    --font-mono:"PT Mono","Courier Prime",ui-monospace,monospace;
    --photo-filter:grayscale(.72) sepia(.30) contrast(1.06) brightness(1.02);
    --avatar-filter:grayscale(.6) sepia(.35) contrast(1.05);
  }
  /* halftone on the tinted blocks → printed-by-an-old-press texture */
  .sheet.theme-fujimoto .adbox{
    background:transparent;
    background-image:radial-gradient(var(--rule) .6px,transparent .7px);
    background-size:4px 4px;
  }
  .sheet.theme-fujimoto .front .zone-ai{
    background-image:radial-gradient(rgba(200,122,101,.18) .6px,transparent .7px);
    background-size:5px 5px;
  }
  .sheet.theme-fujimoto .lead h2,
  .sheet.theme-fujimoto .story h3{letter-spacing:-.005em}

  /* Noir d'encre — stark modern tabloid: true black on white, red accent,
     condensed sans display/headlines, full-grayscale photos, no paper grain. */
  .sheet.theme-noir{
    --ink:#0d0d0d; --paper:#ffffff; --rule:#0d0d0d; --muted:#4a4a4a; --accent:#c01818;
    --hair:#d2d2d2; --imgborder:#1c1c1c; --dash:#9a9a9a; --aihead:#c01818;
    --grain:transparent;
    --font-body:"Lora",Georgia,serif;
    --font-head:"Oswald","Playfair Display",sans-serif;
    --font-display:"Anton","Oswald",sans-serif;
    --font-meta:"Oswald",sans-serif;
    --photo-filter:grayscale(1) contrast(1.12);
    --avatar-filter:grayscale(1) contrast(1.1);
  }
  .sheet.theme-noir .nameplate h1,
  .sheet.theme-noir .lead h2{text-transform:uppercase;letter-spacing:.01em}

  /* Gazette — calm cool-grey broadsheet: slate ink on near-white, teal
     accent, Playfair display over Lora body, lightly desaturated photos. */
  .sheet.theme-gazette{
    --ink:#23303a; --paper:#f3f5f7; --rule:#9fb0bb; --muted:#5c6b75; --accent:#2f6f8f;
    --hair:#cfd8de; --imgborder:#bcc7ce; --dash:#9fb0bb; --aihead:#2f6f8f;
    --grain:rgba(60,90,110,.05);
    --font-body:"Lora",Georgia,serif;
    --font-head:"Playfair Display",Georgia,serif;
    --font-display:"Playfair Display",Georgia,serif;
    --font-meta:"EB Garamond",Georgia,serif;
    --photo-filter:grayscale(.25) contrast(1.03) saturate(.9);
    --avatar-filter:grayscale(.2) contrast(1.02);
  }

  /* Brasil — tropical sports tabloid: jungle green + gold on warm cream,
     Anton uppercase masthead, VIVID (non-vintage) photos, verde-amarela
     slogan bar — the "É PENTA!" euphoria. */
  .sheet.theme-brasil{
    --ink:#173f1f; --paper:#fbf7e6; --rule:#2e7d32; --muted:#4f7a52; --accent:#009c3b;
    --hair:#bfe3c2; --imgborder:#86c98c; --dash:#f2c200; --aihead:#1565c0;
    --grain:rgba(0,156,59,.05);
    --font-body:"Lora","PT Serif",Georgia,serif;
    --font-head:"Oswald","Anton",sans-serif;
    --font-display:"Anton","Oswald",Impact,sans-serif;
    --font-meta:"Oswald",sans-serif;
    --font-mono:"PT Mono","Courier Prime",ui-monospace,monospace;
    --photo-filter:saturate(1.15) contrast(1.06);
    --avatar-filter:saturate(1.1) contrast(1.04);
  }
  .sheet.theme-brasil .nameplate h1,
  .sheet.theme-brasil .lead h2{text-transform:uppercase;letter-spacing:.01em}
  .sheet.theme-brasil .slogans{background:#009c3b;color:#ffdf00;border-color:#00692a;
    font-family:"Oswald",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em}

  /* Expédition — Clair Obscur mood: a DARK gilded broadsheet. Warm near-black
     "paper", parchment text, bright antique gold for masthead/headlines, engraved
     Art-Nouveau caps (Cinzel Decorative) over Garamond, a gold double frame, a
     candlelit centre-glow, photos toned to warm grey-gold. Painted by candlelight. */
  .sheet.theme-expedition{
    --ink:#e8dcc1; --paper:#15110c; --rule:#7c6427; --muted:#a4906a; --accent:#cca24c;
    --gold-title:#e3c884; --hair:#5a4a22; --imgborder:#8a6e2c; --dash:#cca24c; --aihead:#cca24c;
    --grain:rgba(204,162,76,.05);
    --font-body:"Cormorant Garamond","EB Garamond",Georgia,serif;
    --font-head:"Cinzel","Marcellus",Georgia,serif;
    --font-display:"Cinzel Decorative","Cinzel",serif;
    --font-meta:"Marcellus","Old Standard TT",serif;
    --font-mono:"Marcellus","Old Standard TT",serif;
    --photo-filter:grayscale(.22) sepia(.42) saturate(.95) contrast(1.05) brightness(.9);
    --avatar-filter:grayscale(.18) sepia(.4) contrast(1.05) brightness(.92);
    color:var(--ink);
    /* candlelit centre-glow + painterly warm mottling + fine gold grain on warm
       black, gilt double frame (the Clair-Obscur "peint à la bougie" ground) */
    background:
      radial-gradient(115% 70% at 50% 16%, rgba(204,162,76,.11), transparent 58%),
      radial-gradient(42% 32% at 16% 38%, rgba(126,74,42,.12), transparent 62%),
      radial-gradient(46% 36% at 84% 72%, rgba(92,60,40,.12), transparent 62%),
      radial-gradient(var(--grain) 1px, transparent 1px),
      #15110c;
    background-size:auto, auto, auto, 4px 4px, auto;
    border:1px solid var(--accent);
    box-shadow:0 12px 55px rgba(0,0,0,.75), inset 0 0 0 5px rgba(204,162,76,.12),
               inset 0 0 0 6px rgba(0,0,0,.5), inset 0 0 0 7px rgba(204,162,76,.18);
  }
  /* parchment body (Cormorant runs light → lift weight/size a touch) */
  .sheet.theme-expedition .lead .lead-open,
  .sheet.theme-expedition .story .body,
  .sheet.theme-expedition .tplstory .body{font-size:1.06rem;font-weight:500;line-height:1.5;color:var(--ink)}
  /* gold headlines + masthead + section labels */
  .sheet.theme-expedition .lead h2,.sheet.theme-expedition .story h3,
  .sheet.theme-expedition .tplstory h2,.sheet.theme-expedition .tplstory h3,
  .sheet.theme-expedition .tplcont-h,.sheet.theme-expedition .section-head,
  .sheet.theme-expedition .ear{color:var(--accent)}
  .sheet.theme-expedition .ear,
  .sheet.theme-expedition .dateline-bar{border-color:var(--accent);color:var(--muted)}
  .sheet.theme-expedition .dateline-bar .mid{color:var(--accent)}
  /* Clair-Obscur signature: pale-champagne lead/section titles wrapped in gilt
     « guillemets » (cf. « CHARACTERS » / « GUSTAVE » on the official site) */
  .sheet.theme-expedition .lead h2,
  .sheet.theme-expedition .section-head > span{color:var(--gold-title)}
  .sheet.theme-expedition .lead h2::before,
  .sheet.theme-expedition .section-head > span::before{content:"«\00a0";color:var(--accent);font-weight:400}
  .sheet.theme-expedition .lead h2::after,
  .sheet.theme-expedition .section-head > span::after{content:"\00a0»";color:var(--accent);font-weight:400}
  .sheet.theme-expedition .kicker{color:var(--accent);letter-spacing:.12em}
  .sheet.theme-expedition .byline,.sheet.theme-expedition .deck,
  .sheet.theme-expedition .credit,.sheet.theme-expedition figure.photo > .credit{color:var(--muted)}
  .sheet.theme-expedition .slogans{background:rgba(204,162,76,.06);color:var(--accent);
    border-color:var(--accent);font-style:italic;letter-spacing:.06em}
  .sheet.theme-expedition .lead .lead-open p:first-of-type::first-letter{color:var(--accent)}
  .sheet.theme-expedition .photoframe > img,
  .sheet.theme-expedition .photoframe > .cropwrap{border-color:var(--imgborder)}
  .sheet.theme-expedition .tplstory.elem-quote .pullquote{color:var(--accent);
    border-color:var(--accent);font-family:var(--font-display);font-style:italic;
    text-align:center;font-size:1.7rem;line-height:1.3;border-top-width:2px;border-bottom:2px solid var(--accent);
    padding:.7rem 1rem;letter-spacing:.01em}
  /* keep the dummy/greeking legible on black */
  .sheet.theme-expedition.allmode .greek,.allmode .sheet.theme-expedition .greek{opacity:.4}
  /* Plate — Expédition masthead: tall engraved gold caps + a dim parchment sub */
  .plate-expedition h1{font-family:"Cinzel Decorative","Cinzel",serif;font-weight:700;
    color:var(--accent);letter-spacing:.05em;font-size:4.6rem;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  .plate-expedition .nameplate .sub{font-family:"Marcellus",serif;font-style:italic;
    color:var(--muted);letter-spacing:.07em;font-size:1rem}

  /* toolbar theme picker */
  .toolbar .themepick{display:inline-flex;align-items:center;gap:.3rem;font-size:.85rem}
  .toolbar .themepick select{font:inherit;padding:.25rem .4rem;border-radius:4px;
    border:1px solid #5a534a;background:#2c2924;color:#f3ead6;cursor:pointer}

  /* Courrier des lecteurs — web only, not part of the printed paper */
  .lecteurs{max-width:760px;margin:0 auto 3rem;padding:0 1rem;color:#ece3cf;font-family:system-ui,sans-serif}
  .lecteurs h3{font-family:var(--font-head);color:#f3ead6;font-size:1.5rem;margin:.2rem 0 1rem;text-align:center}
  .clist{display:flex;flex-direction:column;gap:.7rem;margin-bottom:1.2rem}
  .cmt{background:#2c2924;border:1px solid #4a443c;border-radius:8px;padding:.6rem .8rem}
  .cmt .meta{font-size:.72rem;color:#a89f8b;margin-bottom:.2rem;display:flex;gap:.5rem;align-items:center}
  .cmt .meta .who{color:#e4c98a;font-weight:600}
  .cmt .meta .del{margin-left:auto;background:none;border:none;color:#b98;cursor:pointer;font-size:.8rem}
  .cmt .txt{font-size:.92rem;line-height:1.45;white-space:pre-wrap}
  .cmt-empty{color:#8a8170;font-style:italic;text-align:center;padding:.5rem}
  .cbox{background:#2c2924;border:1px solid #4a443c;border-radius:8px;padding:.8rem}
  .cbox textarea,.cbox input{width:100%;font:inherit;background:#1f1c18;color:#f3ead6;border:1px solid #5a534a;border-radius:6px;padding:.5rem .6rem;margin-bottom:.5rem;box-sizing:border-box}
  .cbox textarea{min-height:70px;resize:vertical}
  .cbox .row{display:flex;gap:.5rem}
  .cbox button{font:inherit;border:none;border-radius:6px;padding:.5rem .9rem;cursor:pointer;background:var(--accent);color:#fff;font-weight:600}
  .cbox button.ghost{background:#3a3631;color:#f3ead6;border:1px solid #5a534a}
  .cbox .hint{font-size:.78rem;color:#a89f8b;margin-bottom:.5rem}
  .cbox .err{color:#ff9b8e;font-size:.8rem;min-height:1em}

  @page{size:A3 portrait;margin:12mm}
  @media print{
    body{background:#fff}
    .toolbar,.lecteurs{display:none !important}
    .stage{padding:0}
    .sheet{box-shadow:none;border:none;width:100%;padding:0}
    .well{--wellcols:4}
  }
</style>

  });

  function photoHost(t){

  const grip = document.createElement("div"); grip.className = "img-resize-grip"; document.body.appendChild(grip);
  const badge = document.createElement("div"); badge.className = "rsz-badge"; document.body.appendChild(badge);
  let imgBtnHost = null, gripBox = null, resizing = false;
  // the resizable photo box of a STORY (lead banners have no per-column size)
  function storyPhotoBox(t){
    const host = photoHost(t); if(!host || !host.classList.contains("story")) return null;
    const img = t.tagName === "IMG" ? t : t.querySelector("img");
    const fig = img && img.closest("figure.photo"); if(!fig) return null;

  }

      const sp = storyPhotoBox(e.target);

  });

  let rz = null;

    if(!rz) return;

  grip.addEventListener("pointercancel", endResize);

  // ── drag-to-arrange: grab a chronicle (well story or the lead) and drop it to

  // (weight), so one gesture reorders AND re-ranks. Ads keep the dock controls.
  // The board resolves the drop via moveArticle() and reloads the preview. ──────
  const dropInd = document.createElement("div"); dropInd.className = "drop-ind"; document.body.appendChild(dropInd);
  // a draggable/target card = a placed CHRONICLE (lead or well story), never an ad
  const isDragCard = el => !!el && el.matches(".story[data-pid],.lead[data-pid]")
    && (el.dataset.kind || "placement") === "placement" && !el.classList.contains("adbox");
  function dragCardAt(x, y){
    const stack = (document.elementsFromPoint ? document.elementsFromPoint(x, y) : [document.elementFromPoint(x, y)]);
    for(const n of stack){ const c = n && n.closest && n.closest(".story[data-pid],.lead[data-pid]"); if(isDragCard(c)) return c; }

    if(e.target.closest("figure.photo, .img-resize-grip, .img-edit-btn")) return;

    if(!isDragCard(src)) return;
    drag = { src, x0:e.clientX, y0:e.clientY, on:false, weight:null, beforePid:null, pid:src.dataset.pid };
    try{ src.setPointerCapture(e.pointerId); }catch(_){}
  });

      if(Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;   // threshold → real drag
      drag.on = true; dragMoved = true;

    drag.src.style.pointerEvents = "";
    if(!tgt || tgt === drag.src){ dropInd.style.display = "none"; drag.weight = drag.beforePid = null; return; }

    const after = isLead ? (e.clientY > r.top + r.height/2) : (e.clientX > r.left + r.width/2);

    // reflects the sheet's zoom, so no extra scaling is needed)
    if(isLead){ dropInd.className = "drop-ind horiz"; dropInd.style.left = (window.scrollX + r.left) + "px";
      dropInd.style.width = r.width + "px"; dropInd.style.top = (window.scrollY + (after ? r.bottom : r.top) - 2) + "px"; }
    else { dropInd.className = "drop-ind vert"; dropInd.style.top = (window.scrollY + r.top) + "px";
      dropInd.style.height = r.height + "px"; dropInd.style.left = (window.scrollX + (after ? r.right : r.left) - 2) + "px"; }
    dropInd.style.display = "block";
  });

    for(const w of ["lead","major","minor","brief"]) if(el.classList.contains(w)) return w;

  }

    if(!drag) return;
    const d = drag; drag = null;
    dropInd.style.display = "none"; document.body.classList.remove("dragging");

    }
  }
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);
}

// ("style:<id>"). Populated async by loadStyles(); applied as inline CSS vars.
let CUSTOM = {};
const THEME_KEY = "daihbi-theme-" + ISSUE;
const knownTheme = k => !!(THEMES[k] || CUSTOM[k]);
function rawThemePref(){
  const url = new URLSearchParams(location.search).get("theme");

function populateThemes(){
  const sel = $("#themeSel"); if(!sel) return;
  const opt = (k,label) => `<option value="${esc(k)}">${esc(label)}</option>`;
  let html = Object.entries(THEMES).map(([k,t]) => opt(k, t.label||k)).join("");
  const custom = Object.entries(CUSTOM);
  if(custom.length) html += custom.map(([k,t]) => opt(k, t.label||k)).join("");
  sel.innerHTML = html;

// Apply a custom style's `def` as inline CSS variables on the sheet (or clear
// them when switching back to a built-in theme, whose look lives in CSS).
function applyStyleVars(def){
  const s = $("#sheet"); if(!s) return;
  ["--paper","--ink","--accent","--rule","--muted",
   "--font-head","--font-display","--font-body","--font-meta",
   "--photo-filter","--avatar-filter"].forEach(p => s.style.removeProperty(p));
  if(!def) return;
  const set = (p,v) => { if(v) s.style.setProperty(p, v); };
  set("--paper",def.paper); set("--ink",def.ink); set("--accent",def.accent);
  set("--rule",def.rule); set("--muted",def.muted);
  set("--font-head",def.fontHead); set("--font-display",def.fontHead);
  set("--font-body",def.fontBody); set("--font-meta",def.fontBody);
  set("--photo-filter",def.photoFilter); set("--avatar-filter",def.photoFilter);
}

function applyPaper(){
  document.title = PAPER.name;
  $(".toolbar b").innerHTML = PAPER.name;
  const ll = $("#layoutLink"); if(ll) ll.href = "board.html?issue=" + encodeURIComponent(ISSUE);
  const fl = $("#flipLink"); if(fl) fl.href = "flip.html?issue=" + encodeURIComponent(ISSUE);
  THEME = resolveTheme();
  const isCustom = !!CUSTOM[THEME];
  $("#sheet").className = "sheet " + (PAPER.plate || "") + (isCustom ? " theme-custom" : " theme-" + THEME);
  applyStyleVars(isCustom ? CUSTOM[THEME].def : null);
  const sel = $("#themeSel"); if(sel) sel.value = THEME;

async function loadStyles(){
  try{
    const list = await Styles.list();
    CUSTOM = {};
    list.forEach(st => { CUSTOM[Styles.key(st.id)] = { label: st.name, def: st.def }; });
  }catch(e){ CUSTOM = {}; }
  populateThemes();
  applyPaper();   // re-apply once custom styles are known (initial run falls back to classic)
}

function langBadge(a){

function srcBadge(a){

// Compose the byline prefix + name. French/Italian "de"/"di" elide to "d'" before
// a vowel ("de Adam" → "d'Adam"); and if the byline is already an elided credit
// ("d'après …"), the prefix is dropped so it doesn't read "de d'après".
function bylineName(a){
  if(!a.byline) return "";
  const pre = pressL(a.lang || PAPER_LANG).by;        // de / by / di / por / von …
  const b = a.byline.trim();
  const elides = (pre === "de" || pre === "di");
  if(elides && /^d['’]/i.test(b)) return esc(a.byline);                      // already "d'…" → no prefix
  if(elides && /^[aeiouyàâäéèêëîïîôöùûü]/i.test(b)) return `d’${esc(a.byline)}`;  // de + voyelle → d'
  return `${esc(pre)} ${esc(a.byline)}`;
}
function byline(a){

  const open = m ? m[1] : html;
  const rest = (m ? m[2] : "").trim();

    ${a.subhead ? `<div class="deck">${esc(a.subhead)}</div>` : ""}
    ${byline(a)}`;

    const pos = a.img_pos || "top";

      return `<section class="lead${draftCls(a)}"${editAttrs(a)} data-span="${a.col_span||0}">${head}
        <div class="lead-flow">
          ${leadPhoto(a, "lead-photo " + (pos === "left" ? "flt-left" : "flt-right"))}
          <div class="lead-open">${open}</div>${rest}

    }
    // pos "top" → full-width hero banner above the text (bigger)
    return `<section class="lead${draftCls(a)}"${editAttrs(a)} data-span="${a.col_span||0}">${head}
      ${leadPhoto(a, "lead-banner")}
      <div class="lead-open">${open}</div>
      ${rest ? `<div class="lead-cols">${rest}</div>` : ""}
    </section>`;
  }
  return `<section class="lead${draftCls(a)}"${editAttrs(a)} data-span="${a.col_span||0}">${head}
    <div class="lead-open">${open}</div>
    ${rest ? `<div class="lead-cols">${rest}</div>` : ""}
  </section>`;
}
// Lead photo with the crop tool baked in at render (the lead isn't inside a .well,
// so applyStorySpans never touches it). A forced ratio or a zoom → clipping frame.
function leadPhoto(a, cls){
  const data = `data-imgpos="${esc(a.img_pos||"top")}" data-crop="${esc(a.img_crop||"")}" data-focus="${esc(imgFocus(a))}" data-zoom="${imgZoom(a)}"`;
  const z = imgZoom(a), crop = a.img_crop||"";
  let inner;
  if(crop || z>1){
    const ratio = CROP_RAT[crop] || (cls.indexOf("lead-banner")>=0 ? "2/1" : "3/2");
    const istyle = `object-position:${esc(imgFocus(a))};transform:scale(${z});transform-origin:${esc(imgFocus(a))}`;
    inner = `<span class="cropwrap" style="aspect-ratio:${ratio}"><img src="${esc(a.image_url)}" alt="" style="${istyle}"></span>`;
  } else {
    inner = `<img src="${esc(a.image_url)}" alt="" style="object-position:${esc(imgFocus(a))}">`;
  }
  return `<figure class="${cls} photo" ${data}><div class="photoframe">${inner}${overlayEl(a)}</div>${creditLine(a.image_url)}</figure>`;
}
// Crop-tool ratios (img_crop) + neutral helpers shared by stories and the lead.
const CROP_RAT = { "2x1":"2/1", "16x9":"16/9", "3x2":"3/2", "4x3":"4/3", "1x1":"1/1", "3x4":"3/4" };
function imgFocus(a){ return a.img_focus || "50% 50%"; }
function imgZoom(a){ const z = parseFloat(a.img_zoom); return (z>1) ? z : 1; }
// Overlay text laid over the image (img_overlay.sql): a caption band or a poster
// title, anchored top/center/bottom. Empty text → nothing (image unchanged).
function overlayEl(a){
  const t = (a.img_overlay||"").trim(); if(!t) return "";
  const st  = a.img_overlay_style==="cover" ? "cover" : "band";
  const pos = (a.img_overlay_pos==="top"||a.img_overlay_pos==="center") ? a.img_overlay_pos : "bottom";
  return `<figcaption class="imgoverlay ov-${st} ov-${pos}">${esc(t)}</figcaption>`;
}
// A photo carrying the editor's crop settings as data-*; when a ratio is forced
// OR a zoom is applied it becomes a clipping .cropwrap frame (so object-position +
// scale crop inside it), otherwise a plain <img> (focus still set, harmless).
function storyPhoto(a, imgc){
  const data = `data-imgc="${imgc}" data-imgpos="${esc(a.img_pos||"top")}" data-crop="${esc(a.img_crop||"")}" data-focus="${esc(imgFocus(a))}" data-zoom="${imgZoom(a)}"`;
  const z = imgZoom(a), crop = a.img_crop||"";
  let inner;
  if(crop || z>1){
    const istyle = `object-position:${esc(imgFocus(a))};transform:scale(${z});transform-origin:${esc(imgFocus(a))}`;
    inner = `<span class="cropwrap"><img src="${esc(a.image_url)}" alt="" style="${istyle}"></span>`;
  } else {
    inner = `<img src="${esc(a.image_url)}" alt="" style="object-position:${esc(imgFocus(a))}">`;
  }
  // figure wraps the photo (in a relative .photoframe, so an overlay can sit over
  // it) + its author credit, which stays below the image
  return `<figure class="photo" ${data}><div class="photoframe">${inner}${overlayEl(a)}</div>${creditLine(a.image_url)}</figure>`;
}
// A standalone image filler (image_fill.sql): a photo-only card that flows in the
// well like any story (so the masonry packs/balances it), no headline/body.
function renderImageFill(a){
  const span = a.col_span>0 ? a.col_span : 1;
  const imgc = a.img_cols>0 ? a.img_cols : span;
  return `<article class="story imgfill" data-span="${span}"${editAttrs(a)}>
    <div class="body">${storyPhoto(a, imgc)}</div></article>`;
}
function renderStory(a){
  if(a.isImage) return renderImageFill(a);
  // Editor-chosen layout is carried as data-* and APPLIED by applyStorySpans()
  // once the well's real column count is known — so a span can never exceed the
  // columns actually available (e.g. the 2-col human zone), which would overflow
  // the grid and collide. data-span 0 = auto by weight (major=2, else 1).
  const span = a.col_span > 0 ? a.col_span : (a.weight === "major" ? 2 : 1);
  const imgc = a.image_url ? (a.img_cols > 0 ? a.img_cols : span) : 0;  // 0 = no photo
  const img = a.image_url ? storyPhoto(a, imgc) : "";
  return `<article class="story ${esc(a.weight)}${draftCls(a)}" data-span="${span}"${editAttrs(a)}>
    ${kicker(a)}<h3>${esc(a.headline)}</h3>${byline(a)}
    <div class="body">${a.subhead ? `<p class="deckline"><em>${esc(a.subhead)}</em></p>` : ""}${img}${md(a.body)}</div>
  </article>`;
}
// ── Fixed-grid template (templates.sql) ────────────────────────────────────
// Render the front as the template's fixed grid: each CONTAINER is positioned by
// col/span/row, holding its ＋ slots. A placement with `slot===idx` fills that
// cell; an empty cell shows a ＋ (board/ALL mode only). Unslotted or overflow
// stories + ads flow in a normal well BELOW the grid so nothing is ever lost.
// The element kind a placement renders as: its stored elem (dummy_layout.sql) wins
// (durable across template switches), else the slot's kind, else its weight.
function elemKindOf(a, sl){ return (a && a.elem) || (sl && sl.kind) || (a && a.weight) || "minor"; }
// Greeking — lorem-bars standing in for body copy in the DUMMY (board) view only.
function greek(lines){ lines = Math.max(1, lines||4); let s=""; for(let i=0;i<lines;i++) s+=`<span></span>`; return `<div class="greek">${s}</div>`; }
function slotLabel(sl){
  const m = Templates.elemMeta(sl.kind);
  return m.font ? `${m.label} · ${m.font}` : m.label;
}
// FINISHED render of a filled cell (public reader + manage preview). Branches on
// the element kind: story = headline+body; mugshot/cartoon/photo = a figure; quote
// = a pull-quote blockquote (placement.text).
function renderSlotCard(a, sl){
  const kind = elemKindOf(a, sl);
  const meta = Templates.elemMeta(kind);
  // leadPhoto bakes crop ratio/focus/zoom inline, so no applyStorySpans is needed
  // (the grid is fixed — packWell/applyStorySpans only touch .well/.story).
  const photo = a.image_url ? leadPhoto(a, "tplphoto") : "";
  if(kind==="quote"){
    return `<article class="tplstory elem-quote"${editAttrs(a)}>
      <blockquote class="pullquote">${esc(a.text||"")}</blockquote></article>`;
  }
  if(kind==="mugshot"){
    return `<article class="tplstory elem-mugshot"${editAttrs(a)}>
      <figure class="mugshot">${photo||`<span class="mugph"></span>`}${a.text?`<figcaption>${esc(a.text)}</figcaption>`:""}</figure></article>`;
  }
  if(kind==="cartoon" || kind==="photo" || a.isImage){
    const cls = kind==="cartoon" ? "elem-cartoon" : "elem-photo";
    return `<article class="tplstory ${cls}"${editAttrs(a)}>${photo}${a.text?`<figcaption class="cap">${esc(a.text)}</figcaption>`:""}</article>`;
  }
  const big = (kind==="lead");
  return `<article class="tplstory k-${esc(kind)}${draftCls(a)}"${editAttrs(a)}>
    ${kicker(a)}${big?`<h2>${esc(a.headline)}</h2>`:`<h3>${esc(a.headline)}</h3>`}${byline(a)}
    <div class="body">${a.subhead?`<p class="deckline"><em>${esc(a.subhead)}</em></p>`:""}${photo}${md(a.body)}</div>
  </article>`;
}
// DUMMY render of a filled cell (board/ALL view only): the schematic the editor
// plans on — element label + font annotation, the real headline so they know what
// sits there, and greeking instead of prose. Furniture (quote/mug/cartoon/photo)
// shows its label + a hint of its content.
function renderDummyCard(a, sl){
  const kind = elemKindOf(a, sl);
  const meta = Templates.elemMeta(kind);
  const tag = `<div class="dlabel">${esc(meta.label)}${meta.font?` · <i>${esc(meta.font)}</i>`:""}</div>`;
  if(kind==="quote") return `<article class="tplstory dummy elem-quote"${editAttrs(a)}>${tag}<blockquote class="pullquote">${esc(a.text||"…")}</blockquote></article>`;
  if(kind==="mugshot") return `<article class="tplstory dummy elem-mugshot"${editAttrs(a)}>${tag}<figure class="mugshot">${a.image_url?leadPhoto(a,"tplphoto"):`<span class="mugph"></span>`}</figure></article>`;
  if(kind==="cartoon"||kind==="photo"||a.isImage) return `<article class="tplstory dummy elem-${esc(kind==="cartoon"?"cartoon":"photo")}"${editAttrs(a)}>${tag}${a.image_url?leadPhoto(a,"tplphoto"):`<div class="imgph"></div>`}</article>`;
  const big = (kind==="lead");
  return `<article class="tplstory dummy k-${esc(kind)}${draftCls(a)}"${editAttrs(a)}>
    ${tag}${big?`<h2>${esc(a.headline)}</h2>`:`<h3>${esc(a.headline)}</h3>`}<div class="byl">${esc((a.byline?("— "+a.byline):"")||"")}</div>
    ${greek(big?7:4)}</article>`;
}
function renderTemplateBody(arts, ads){
  const def = TPL.def, cols = Math.max(1, def.cols||6), flat = TPL.slots;
  // map slot index → the (first) art assigned to it; everything else is "loose"
  const bySlot = {}, loose = [];
  arts.forEach(a=>{ const s=(a.slot==null?-1:a.slot);
    if(s>=0 && s<flat.length && bySlot[s]===undefined) bySlot[s]=a; else loose.push(a); });
  // container geometry, keyed by id (fallback name) — matches Templates.slots()
  const cmeta = {}; (def.containers||[]).forEach(c=>{ cmeta[c.id||c.name||""]=c; });
  // group the flat slots by container, preserving each slot's global idx + order
  const groups = []; let cur = null;
  flat.forEach(sl=>{ if(!cur || cur.cid!==sl.container){ cur={cid:sl.container, name:sl.containerName, items:[]}; groups.push(cur); } cur.items.push(sl); });
  let grid = `<div class="tplgrid" style="grid-template-columns:repeat(${cols},1fr)">`;
  groups.forEach(g=>{
    const c = cmeta[g.cid] || {};
    const col = Math.min(cols, Math.max(1, c.col||1));
    const span = Math.max(1, Math.min(cols-col+1, c.span||1));
    const perRow = Math.max(1, Math.min(span, (c.perRow|0)|| span));
    const cells = g.items.map(sl=>{
      const a = bySlot[sl.idx];
      const elem = Templates.elemFor(sl.kind);
      if(a) return `<div class="tplcell filled">${ALL ? renderDummyCard(a, sl) : renderSlotCard(a, sl)}</div>`;
      if(ALL) return `<div class="tplcell tplempty"><button class="tplplus" data-slot="${sl.idx}" data-kind="${esc(sl.kind)}" data-elem="${esc(elem)}" data-image="${sl.image||Templates.elemMeta(sl.kind).content==="image"?1:0}" title="${esc(I18n.t("paper.fillSlot"))}"><span>＋</span><small>${esc(slotLabel(sl))}</small></button></div>`;
      return `<div class="tplcell tplempty pub"></div>`;
    }).join("");
    grid += `<div class="tplcont" style="grid-column:${col} / span ${span};grid-row:${Math.max(1,c.row||1)}">
      ${(c.name||g.name)?`<div class="tplcont-h">${esc(c.name||g.name)}</div>`:""}
      <div class="tplslots" style="grid-template-columns:repeat(${perRow},1fr)">${cells}</div>
    </div>`;
  });
  grid += `</div>`;
  // loose stories (unslotted / overflow) + ads → normal well under the grid.
  // Orphan FURNITURE (a quote/mugshot detached from its cell, e.g. after a template
  // switch) is meaningless without a host → drop it from the public render; photo/
  // cartoon are self-contained images and fall back to the image-filler render.
  const looseReal = loose.filter(a=>{
    if(a.elem==="quote" || a.elem==="mugshot") return false;
    return !a.isImage || a.image_url;
  });
  const looseHTML = (looseReal.length||ads.length)
    ? `<div class="well tpl-loose" data-section-id="">${looseReal.map(renderStory).join("")}${ads.map(renderAd).join("")}</div>` : "";
  return grid + looseHTML;
}

// Apply each story's column span (clamped to its well's real column count), its
// matching internal text-column count, and the photo banner width. Runs before
// packWell so heights are measured against the final widths.
function applyStorySpans(){
  document.querySelectorAll(".well").forEach(well=>{
    const cols = parseInt(getComputedStyle(well).getPropertyValue("--wellcols")) || 3;
    well.querySelectorAll(":scope > .story").forEach(el=>{
      const want = parseInt(el.dataset.span) || 1;
      const span = Math.max(1, Math.min(want, cols));
      el.style.gridColumn = "span " + span;
      el.style.setProperty("--bodycols", span);
      el.dataset.applied = span;   // the story's real column span (resize snaps the photo to it)
      // photo block = a <figure class="photo"> wrapping the <img>/.cropwrap + credit
      const ph = el.querySelector(":scope > .body > figure.photo");
      if(ph){
        // the image lives inside a .photoframe now; .cropwrap (an ancestor of its
        // img) sorts before the plain photo <img> in document order, so this picks
        // the crop frame when present, else the bare image
        const inner = ph.querySelector(".cropwrap, img");
        const isFrame = inner && inner.classList.contains("cropwrap");
        const imgc = Math.max(1, Math.min(parseInt(ph.dataset.imgc) || span, span));
        const pos = ph.dataset.imgpos || "top";
        const insetCalc = `calc(((${imgc} * (100% - ${span-1} * var(--col-gap))) / ${span}) + ${imgc-1} * var(--col-gap))`;
        if(pos === "left" || pos === "right"){
          // float + wrap (Word-style): single-column body so the text flows around it
          el.style.setProperty("--bodycols", 1);
          ph.className = "photo " + (pos === "left" ? "flt-left" : "flt-right");
          el.style.setProperty("--inset", imgc >= span ? "55%" : insetCalc);
        } else if(imgc < span){ ph.className = "photo inset"; el.style.setProperty("--inset", insetCalc); }
        else { ph.className = "photo full"; el.style.removeProperty("--inset"); }
        // crop-to-fill: a forced aspect-ratio goes on the inner box being clipped.
        const crop = ph.dataset.crop || "";
        if(isFrame){
          // frame needs a height: forced ratio, else a sane default so zoom-only crops show
          inner.style.aspectRatio = CROP_RAT[crop] || "3/2";
        }
      }
    });
  });
  // The lead is a full-width hero outside the well, so "Colonnes" (col_span) can't be a
  // grid span — it sets how many text columns its body flows into (0/auto → CSS default).
  document.querySelectorAll(".lead").forEach(lead=>{
    const cols = parseInt(lead.dataset.span) || 0;
    const body = lead.querySelector(":scope > .lead-cols");   // only the "top"/no-photo layout has it
    if(body) body.style.columnCount = cols>0 ? cols : "";
  });
}
// Full-width feuilleton band at the foot of the page (a brief spanning the well).
function renderBand(a){
  return `<section class="story footband${draftCls(a)}"${editAttrs(a)}>
    ${kicker(a)}<h3>${esc(a.headline)}</h3>${byline(a)}
    ${a.subhead ? `<p class="deckline"><em>${esc(a.subhead)}</em></p>` : ""}
    <div class="band-body">${md(a.body)}</div>
  </section>`;
}
function fmtDate(d){
  return I18n.fmtDate(d,{weekday:"long",year:"numeric",month:"long",day:"numeric"}, PAPER_LANG);
}
function renderAd(ad){
  const cat = (window.DAIHBI_AD_CAT_LABEL && ad.category) ? window.DAIHBI_AD_CAT_LABEL(ad.category) : I18n.t("paper.adFallback");
  return `<aside class="story adbox cat-${esc(ad.category||"fabricant")}${draftCls(ad)}"${editAttrs(ad)}>
    <div class="ad-label">${esc(cat)}</div>
    ${ad.image_url?`<img src="${esc(ad.image_url)}" alt="">`:""}
    <h3 class="ad-title">${esc(ad.title)}</h3>
    ${ad.maker?`<div class="ad-maker">${esc(ad.maker)}</div>`:""}
    ${ad.body?`<div class="body"><p>${esc(ad.body)}</p></div>`:""}
    ${ad.link?`<div class="ad-link">${esc(ad.link)}</div>`:""}
