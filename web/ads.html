<style>
  :root{--ink:#1f1c18;--accent:#7a1f1a;--line:#d8cdb2;--bg:#ece5d4;--panel:#f7f2e6}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
  /* header visuals come from shared nav.css; layout stays here */
  header{display:flex;align-items:center;gap:.7rem;padding:.7rem 1.1rem}
  header h1{font-size:1.25rem;margin:0}
  header .grow{flex:1}
  main{max-width:1760px;margin:1.4rem auto;padding:0 1.2rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem}
  .card h2{font-family:"Playfair Display",serif;margin:.1rem 0 .8rem;font-size:1.2rem}
  label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:#6a6253;margin:.6rem 0 .25rem;font-weight:600}
  input,select,textarea{width:100%;font:inherit;padding:.5rem .6rem;border:1px solid #c9bda0;border-radius:6px;background:#fff;color:var(--ink)}
  textarea{min-height:80px;resize:vertical}
  .dz{border:1px dashed #c9bda0;border-radius:8px;padding:.6rem;background:#fffdf7;margin-top:.25rem}
  .dz img{max-width:100%;max-height:150px;border:1px solid #b9ad90;border-radius:4px;display:block;margin-top:.5rem}
  .bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem}
  .bar .grow{flex:1}
  button.go{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:.55rem .9rem;font:inherit;cursor:pointer;font-weight:600}
  button.ghost{background:#fff;border:1px solid #c9bda0;border-radius:6px;padding:.55rem .9rem;font:inherit;cursor:pointer}
  .ad{border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem;margin-bottom:.6rem;background:#fff;display:flex;gap:.6rem}
  .ad img{width:84px;height:64px;object-fit:cover;border:1px solid #b9ad90;border-radius:4px;flex:none}
  .ad .info{flex:1;min-width:0}
  .ad .t{font-weight:700}
  .ad .m{font-size:.78rem;color:#6a6253}
  .ad .acts{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.35rem}
  .ad .acts button{font:inherit;font-size:.74rem;border:1px solid #c9bda0;background:#fff;border-radius:5px;padding:.2rem .5rem;cursor:pointer}
  .ad .acts .ok{background:#2f6b3f;color:#fff;border-color:#2f6b3f}
  .ad .acts .no{color:#b33}
  .st{font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:.05rem .35rem;border:1px solid #c9bda0;background:#efe7d4}
  .st.review{background:#caa23a;color:#1a1714;border-color:#caa23a}
  .st.approved{background:#2f6b3f;color:#fff;border-color:#2f6b3f}
  .st.rejected{background:#9a3b32;color:#fff;border-color:#9a3b32}
  .err{color:#b33;font-size:.82rem;min-height:1em;margin-top:.3rem}
  /* gate */
  .gate{position:fixed;inset:0;background:#211f1c;color:#f3ead6;display:flex;align-items:center;justify-content:center;padding:1rem}
  .gate .gc{background:#2c2924;border:1px solid #4a443c;border-radius:12px;padding:2rem;max-width:420px;width:92%;text-align:center}
  .gate h2{font-family:"Playfair Display",serif;font-size:1.8rem;margin:.2rem 0 .4rem}
  .gate input{background:#1f1c18;color:#f3ead6;border:1px solid #5a534a;margin:.4rem 0}
  .gate .authtabs{display:flex;gap:.4rem;margin-bottom:.5rem}
  .gate .authtabs button{flex:1;font:inherit;background:#1f1c18;color:#cdc4b2;border:1px solid #5a534a;border-radius:8px;padding:.5rem;cursor:pointer}
  .gate .authtabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .gate button.full{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:.65rem;font:inherit;font-weight:600;cursor:pointer;margin-top:.3rem}
  .gate a{color:#e8b9b2}
  /* ── réclame preview: a faithful mini of paper.html's .adbox ── */
  .adbox{break-inside:avoid;border:2px solid #b9ad90;padding:.55rem .65rem;margin:0;background:#f7f2e6;
    font-family:"PT Serif",Georgia,serif;color:#1f1c18;
    background-image:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(120,100,70,.05) 6px,rgba(120,100,70,.05) 12px)}
  .adbox .ad-label{text-align:center;font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:.3em;
    font-size:.55rem;color:#6a6253;border-bottom:1px solid #b9ad90;padding-bottom:.25rem;margin-bottom:.4rem}
  .adbox img{width:100%;display:block;margin:.2rem 0 .4rem;border:1px solid #b9ad90;filter:grayscale(.25) sepia(.12)}
  .adbox .ad-title{font-family:"Playfair Display",serif;font-weight:900;text-align:center;font-size:1.25rem;line-height:1.05;margin:.1rem 0;word-break:break-word}
  .adbox .ad-maker{text-align:center;font-variant:small-caps;letter-spacing:.06em;color:var(--accent);font-size:.82rem;margin-bottom:.3rem}
  .adbox .body{font-size:.86rem;line-height:1.4;text-align:center}
  .adbox .body p{margin:.2rem 0}
  .adbox .ad-link{text-align:center;font-size:.68rem;color:#6a6253;word-break:break-all;margin-top:.3rem}
  /* live preview inside the form */
  .livewrap{margin-top:1rem;border-top:1px dashed #c9bda0;padding-top:.7rem}
  #livePrev{max-width:280px;margin:.3rem auto 0}
  /* list: a masonry wall of réclame previews + infinite scroll (like illustrateurs) */
  .lhead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.4rem}
  .lhead h2{margin:0;flex:none}
  .lhead input[type=search]{flex:1;min-width:10rem;font:inherit;padding:.45rem .6rem;border:1px solid #c9bda0;border-radius:7px;background:#fff;color:var(--ink)}
  .chk{display:flex;align-items:center;gap:.35rem;font-size:.82rem;color:#6a6253;cursor:pointer;white-space:nowrap}
  .filters{display:flex;gap:.35rem;flex-wrap:wrap;margin:.1rem 0 .5rem}
  .chip{font:inherit;font-size:.8rem;border:1px solid #c9bda0;background:#fff;color:#5a5246;border-radius:999px;padding:.25rem .65rem;cursor:pointer;white-space:nowrap}
  .chip:hover{background:#efe7d4}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chip .c{opacity:.6;margin-left:.2rem}
  .summary{font-size:.82rem;color:#8a8070;margin:.1rem 0 .6rem}
  #wall{column-width:220px;column-gap:14px}
  .adtile{break-inside:avoid;-webkit-column-break-inside:avoid;margin:0 0 14px;background:#fff;
    border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .adtile .adbox{border-radius:0;border-width:0;cursor:pointer}
  .adtile:hover{border-color:var(--accent)}
  .adtools{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;padding:.45rem .55rem;border-top:1px solid var(--line);background:var(--panel)}
  .adtools button{font:inherit;font-size:.74rem;border:1px solid #c9bda0;background:#fff;border-radius:5px;padding:.2rem .5rem;cursor:pointer}
  .adtools .ok{background:#2f6b3f;color:#fff;border-color:#2f6b3f}
  .adtools .no{color:#b33}
  .adtools .tmeta{flex-basis:100%;font-size:.7rem;color:#6a6253;margin-top:.1rem}
  #sentinel{height:1px}
  .empty{color:#8a8070;font-style:italic;text-align:center;padding:2.2rem}
  /* + Nouvelle réclame: modal (mirrors illustrateurs' add-image modal) */
  .lhead button.go{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:7px;padding:.5rem .85rem;font:inherit;font-weight:600;cursor:pointer;flex:none}
  .amodal{position:fixed;inset:0;background:rgba(20,18,16,.75);z-index:140;display:none;align-items:flex-start;justify-content:center;padding:1.2rem;overflow:auto}
  .amodal.open{display:flex}
  .acard{background:#fbf8ef;border:1px solid #c9bda0;border-radius:12px;width:min(840px,96vw);margin:auto;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,.5)}
  .ahead{display:flex;align-items:center;padding:.75rem 1rem;border-bottom:1px solid var(--line);font-family:"Playfair Display",serif;font-size:1.15rem}
  .ahead .grow{flex:1}
  .ahead .x{border:1px solid var(--line);background:#fff;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:1rem;line-height:1}
  .abody{padding:.9rem 1.1rem 1.1rem;overflow:auto;max-height:84vh}
  .adgrid{display:grid;grid-template-columns:1fr 280px;gap:1.4rem;align-items:start}
  @media(max-width:680px){.adgrid{grid-template-columns:1fr}}
  .adprevcol{position:sticky;top:0}
  .adprevcol > label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:#6a6253;margin:0 0 .35rem;font-weight:600}
  .adprevcol #livePrev{max-width:none;margin:0}
</style>

<body>

<div class="gate" id="gate"><div class="gc" id="gc" data-i18n="ads.gateLoading">Chargement…</div></div>

<header id="hdr" style="display:none">
  <a class="navhome" href="index.html" data-i18n="ads.kiosk">📰 Kiosque</a>
  <h1>Publisheur <span style="opacity:.6;font-size:.8rem">· <span data-i18n="ads.suffix">Studio publicitaire</span></span></h1>
  <span class="grow"></span>
  <span class="navuser" id="navuser"></span>
</header>

<main id="app" style="display:none">
  <div class="card">
    <div class="lhead">
      <h2 id="listTitle" data-i18n="ads.listMine">Mes réclames</h2>
      <button class="go" id="newAdBtn" onclick="openNew()" data-i18n="ads.newAd">➕ Nouvelle réclame</button>
      <input type="search" id="q" oninput="render()" data-i18n-ph="ads.searchPh" placeholder="Rechercher un titre, un sponsor, un texte…">
      <label class="chk" id="pendingWrap" style="display:none"><input type="checkbox" id="pendingOnly" onchange="render()"> <span data-i18n="ads.pendingOnly">À valider seulement</span></label>
    </div>
    <div class="filters" id="filters"></div>
    <div class="summary" id="summary"></div>
    <div id="wall"></div>
    <div id="sentinel"></div>
  </div>
</main>

<!-- + Nouvelle réclame: create / edit modal -->
<div class="amodal" id="adModal">
  <div class="acard">
    <div class="ahead"><b id="formTitle" data-i18n="ads.formNew">Nouvelle réclame</b><span class="grow"></span><button class="x" onclick="closeForm()" aria-label="✕">✕</button></div>
    <div class="abody" id="adFormBody">
      <div class="adgrid">
        <div class="adfields">
          <label data-i18n="ads.category">Type de réclame</label><select id="f_category"></select>
          <label data-i18n="ads.title">Titre</label><input id="f_title" placeholder="Ex. Aciéries de la Bleusaille" data-i18n-ph="ads.titlePh">
          <label data-i18n="ads.maker">Fabricant / sponsor / chaîne</label><input id="f_maker" placeholder="Fabricant, régiment, chaîne…" data-i18n-ph="ads.makerPh">
          <label data-i18n="ads.body">Texte</label><textarea id="f_body" placeholder="Votre message publicitaire…" data-i18n-ph="ads.bodyPh"></textarea>
          <label data-i18n="ads.link">Lien (optionnel)</label><input id="f_link" placeholder="https://… (Discord, boutique…)" data-i18n-ph="ads.linkPh">
          <label data-i18n="ads.issue">Édition ciblée</label><select id="f_issue"></select>
          <label data-i18n="ads.lang">Langue de la réclame</label><select id="f_lang"></select>
          <label data-i18n="ads.visual">Visuel</label>
          <div class="dz" id="dz">
            <div class="bar"><input id="f_image" placeholder="https://… ou téléversez" oninput="prev(this.value)" style="flex:1" data-i18n-ph="ads.imagePh">
              <button class="ghost" onclick="document.querySelector('#file').click()">📷</button>
              <input id="file" type="file" accept="image/*" style="display:none" onchange="pick(this.files[0])"></div>
            <img id="preview" style="display:none">
            <div class="err" id="imgErr"></div>
          </div>
        </div>
        <div class="adprevcol">
          <label data-i18n="ads.previewLabel">Aperçu dans le journal</label>
          <div id="livePrev"></div>
        </div>
      </div>
      <div class="bar">
        <span class="grow"></span>
        <button class="ghost" id="delBtn" style="display:none" onclick="delAd()" data-i18n="ads.delete">Supprimer</button>
        <button class="ghost" onclick="save('draft')" data-i18n="ads.draft">Brouillon</button>
        <button class="go" onclick="save('review')" data-i18n="ads.submit">Soumettre à un éditeur</button>
      </div>
      <div class="err" id="formErr"></div>
    </div>
  </div>
</div>

let PAPERS = window.DAIHBI_PAPERS || {};
let MYROLE="reader", MYPROFILE=null, ME=null, current=null, pendingImg="";
let ADS=[], FILTERED=[], SHOWN=0, _io=null; const PAGE=36;
const activeCats=new Set();

const esc2 = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function showGate(h){ $("#gate").style.display="flex"; $("#gc").innerHTML=h; }
function hideGate(){ $("#gate").style.display="none"; }

function loginScreen(mode){
  const up = mode==="signup";
  showGate(`<h2>${esc2(I18n.t("ads.gateTitle"))}</h2>
    <div class="authtabs"><button class="${up?"":"on"}" onclick="loginScreen('signin')">${esc2(I18n.t("ads.gateSignin"))}</button>
      <button class="${up?"on":""}" onclick="loginScreen('signup')">${esc2(I18n.t("ads.gateSignup"))}</button></div>
    <input id="g_email" type="email" placeholder="${esc2(I18n.t("auth.emailPh"))}">
    <input id="g_pass" type="password" placeholder="${esc2(I18n.t("auth.pwPh"))}">
    <button class="full" onclick="${up?"doSignUp()":"doSignIn()"}">${up?esc2(I18n.t("ads.gateCreateBtn")):esc2(I18n.t("ads.gateSignin"))}</button>
    <div class="err" id="gErr"></div>
    ${up?"":`<p style="margin-top:.7rem;font-size:.85rem"><a href="#" onclick="doForgot();return false">${esc2(I18n.t("ads.forgotQ"))}</a></p>`}
    <p style="margin-top:.7rem;font-size:.85rem"><a href="index.html">${esc2(I18n.t("ads.backKiosk"))}</a></p>`);
}
async function doForgot(){
  const em=$("#g_email").value.trim();
  if(!em){ $("#gErr").textContent=I18n.t("ads.enterEmailFirst"); return; }
  try{ await Auth.resetPassword(em);
    $("#gc").innerHTML=`<h2>${esc2(I18n.t("ads.checkEmailTitle"))}</h2><p>${I18n.t("ads.resetSent",{em:esc2(em)})}</p><p style="font-size:.85rem;opacity:.85">${esc2(I18n.t("ads.resetHint"))}</p>`;
  }catch(e){ $("#gErr").textContent=e.message; }
}
async function doSignIn(){ try{ await Auth.signInPassword($("#g_email").value.trim(),$("#g_pass").value); boot(); }catch(e){ $("#gErr").textContent=e.message; } }
async function doSignUp(){
  const em=$("#g_email").value.trim(), pw=$("#g_pass").value;
  if(!em||pw.length<6){ $("#gErr").textContent=I18n.t("ads.emailPwShort"); return; }
  try{ const d=await Auth.signUp(em,pw,{role:"annonceur"});
    if(d&&d.session){ boot(); } else { $("#gc").innerHTML=`<h2>${esc2(I18n.t("ads.accountCreated"))}</h2><p>${I18n.t("ads.confirmEmailHtml")}</p>`; }
  }catch(e){ $("#gErr").textContent=e.message; }
}
async function signOut(){ await Auth.signOut(); location.reload(); }

// ── studio ──
function fillIssues(){
  $("#f_issue").innerHTML = `<option value="all">${esc2(I18n.t("ads.allIssues"))}</option>` +
    Object.keys(PAPERS).map(k=>`<option value="${k}">${esc2(PAPERS[k].name||k)}</option>`).join("");
}
function fillLangs(){
  $("#f_lang").innerHTML = I18n.contentOptionsHTML("", false);
}
function fillCategories(){
  $("#f_category").innerHTML = (window.DAIHBI_AD_CATEGORIES||[]).map(c=>`<option value="${c.key}">${esc2(I18n.t("adcat."+c.key))}</option>`).join("");
}
const catLabel = k => I18n.t("adcat."+k);
function prev(url){ const p=$("#preview"); if(url){p.src=url;p.style.display="";}else p.style.display="none"; }
async function pick(file){ if(!file)return; $("#imgErr").textContent=I18n.t("ads.uploading"); try{ const up=await Media.upload(file,"ads"); pendingImg=up.url; $("#f_image").value=pendingImg; prev(pendingImg); $("#imgErr").textContent=""; }catch(e){ $("#imgErr").textContent=e.message; } }
function newAd(){ current=null; $("#formTitle").textContent=I18n.t("ads.formNew");
  ["f_title","f_maker","f_body","f_link","f_image"].forEach(i=>$("#"+i).value=""); $("#f_issue").value="all"; $("#f_category").value="fabricant";
  $("#f_lang").value=Prefs.contentLangLocal()||I18n.lang();
  Prefs.contentLang().then(l=>{ if(l && !current) $("#f_lang").value=l; }).catch(()=>{});
  prev(""); $("#delBtn").style.display="none"; $("#formErr").textContent=""; adPreviewLive(); }
function editAd(a){ current=a.id; $("#formTitle").textContent=I18n.t("ads.formEdit");
  $("#f_title").value=a.title||""; $("#f_maker").value=a.maker||""; $("#f_body").value=a.body||"";
  $("#f_link").value=a.link||""; $("#f_image").value=a.image_url||""; $("#f_issue").value=a.issue||"all";
  $("#f_category").value=a.category||"fabricant";
  $("#f_lang").value=a.lang||(Prefs.contentLangLocal()||I18n.lang());
  prev(a.image_url||""); $("#delBtn").style.display=""; $("#formErr").textContent=""; adPreviewLive(); openForm(); }
// ── create / edit modal open & close ──
function openForm(){ $("#adModal").classList.add("open"); }
function closeForm(){ $("#adModal").classList.remove("open"); }
function openNew(){ newAd(); openForm(); $("#f_title").focus(); }
// ── réclame preview: a faithful mini of paper.html's renderAd() ──
function renderAdBox(a){
  const cat = (window.DAIHBI_AD_CAT_LABEL && a.category) ? window.DAIHBI_AD_CAT_LABEL(a.category) : "";
  return `<div class="adbox cat-${esc2(a.category||"fabricant")}">
    <div class="ad-label">${esc2(cat)}</div>
    ${a.image_url?`<img src="${esc2(a.image_url)}" alt="">`:""}
    <h3 class="ad-title">${esc2(a.title||I18n.t("ads.untitled"))}</h3>
    ${a.maker?`<div class="ad-maker">${esc2(a.maker)}</div>`:""}
    ${a.body?`<div class="body"><p>${esc2(a.body)}</p></div>`:""}
    ${a.link?`<div class="ad-link">${esc2(a.link)}</div>`:""}
  </div>`;
}
function adPreviewLive(){ const lp=$("#livePrev"); if(lp) lp.innerHTML=renderAdBox(adData()); }
function adData(){ return { title:$("#f_title").value.trim(), maker:$("#f_maker").value.trim(),
  body:$("#f_body").value.trim(), link:$("#f_link").value.trim(), image_url:$("#f_image").value.trim(),
  category:$("#f_category").value, issue:$("#f_issue").value, lang:$("#f_lang").value||(Prefs.contentLangLocal()||I18n.lang()),
  advertiser_name:(MYPROFILE&&MYPROFILE.display_name)||"" }; }
async function save(action){
  const data=adData();
  if(!data.title){ $("#formErr").textContent=I18n.t("ads.needTitle"); return; }
  if(MYROLE==="editor"){ data.status = action==="review"?"approved":"draft"; data.approved = action==="review"; }
  else { data.status = action==="review"?"review":"draft"; data.approved=false; }
  try{ const saved = current==null ? await Ads.create(data) : await Ads.update(current,data);
    current=saved.id; $("#formErr").textContent=""; closeForm(); await loadList();
  }catch(e){ $("#formErr").textContent=e.message; }
}
async function delAd(){ if(current==null)return; if(!confirm(I18n.t("ads.confirmDelete")))return;
  try{ await Ads.remove(current); closeForm(); newAd(); await loadList(); }catch(e){ $("#formErr").textContent=e.message; } }
async function approve(id,ok){ try{ await Ads.update(id,{approved:ok, status: ok?"approved":"rejected"}); await loadList(); }catch(e){ alert(e.message); } }

function statusBadge(a){ const s=a.approved?"approved":(a.status||"draft");
  const lbl=I18n.t("adstatus."+s);
  return `<span class="st ${s}">${esc2(lbl)}</span>`; }

async function loadList(){
  try{ ADS = MYROLE==="editor" ? await Ads.listAll() : await Ads.listMine(); }
  catch(e){ $("#wall").innerHTML=`<div class="err">${esc2(e.message)}</div>`; return; }
  $("#listTitle").textContent = MYROLE==="editor" ? I18n.t("ads.listAll") : I18n.t("ads.listMine");
  $("#pendingWrap").style.display = MYROLE==="editor" ? "" : "none";
  renderFilters(); render();
}

// filter chips: by réclame category (counts from the loaded set)
function renderFilters(){
  const box=$("#filters"); if(!box) return;
  const cnt={}; ADS.forEach(a=>{ const c=a.category||"fabricant"; cnt[c]=(cnt[c]||0)+1; });
  let html=`<button class="chip ${activeCats.size?"":"on"}" data-cat="*">${esc2(I18n.t("ads.filterAll"))}</button>`;
  (window.DAIHBI_AD_CATEGORIES||[]).forEach(c=>{ const n=cnt[c.key]||0; if(!n) return;
    html+=`<button class="chip ${activeCats.has(c.key)?"on":""}" data-cat="${c.key}">${esc2(I18n.t("adcat."+c.key))}<span class="c">${n}</span></button>`; });
  box.innerHTML=html;
}
function filteredAds(){
  const term=($("#q").value||"").trim().toLowerCase();
  const pendingOnly=$("#pendingOnly")&&$("#pendingOnly").checked;
  let list=ADS.slice();
  if(pendingOnly) list=list.filter(a=>!a.approved);
  if(activeCats.size) list=list.filter(a=>activeCats.has(a.category||"fabricant"));
  if(term) list=list.filter(a=>((a.title||"")+" "+(a.maker||"")+" "+(a.body||"")+" "+(a.advertiser_name||"")).toLowerCase().includes(term));
  return list;
}
function adMeta(a){
  const ed = a.issue==="all" ? I18n.t("ads.allEditions") : ((PAPERS[a.issue]&&PAPERS[a.issue].name)||a.issue);
  return `${esc2(ed)} · ${esc2(I18n.langLabel(a.lang||"fr"))}${MYROLE==="editor"&&a.advertiser_name?" · "+esc2(a.advertiser_name):""}`;
}
function adTile(a){
  return `<figure class="adtile" data-id="${esc2(a.id)}">
    ${renderAdBox(a)}
    <div class="adtools">
      ${statusBadge(a)}
      <button data-act="edit" data-id="${esc2(a.id)}">${esc2(I18n.t("ads.edit"))}</button>
      ${MYROLE==="editor" && !a.approved ? `<button class="ok" data-act="approve" data-id="${esc2(a.id)}">${esc2(I18n.t("ads.approve"))}</button>`:""}
      ${MYROLE==="editor" && a.approved ? `<button class="no" data-act="withdraw" data-id="${esc2(a.id)}">${esc2(I18n.t("ads.withdraw"))}</button>`:""}
      <span class="tmeta">${adMeta(a)}</span>
    </div>
  </figure>`;
}
function render(){
  FILTERED=filteredAds(); SHOWN=0;
  $("#summary").textContent=I18n.t("ads.summary",{n:FILTERED.length});
  const wall=$("#wall");
  if(!FILTERED.length){ wall.innerHTML=`<div class="empty">${esc2(I18n.t("ads.none"))}</div>`; if(_io){_io.disconnect();_io=null;} return; }
  wall.innerHTML=""; showMore();
  if(_io) _io.disconnect();
  _io=new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)) showMore(); }, {rootMargin:"600px"});
  _io.observe($("#sentinel"));
}
function showMore(){
  const wall=$("#wall"); if(!wall) return;
  const next=FILTERED.slice(SHOWN, SHOWN+PAGE);
  wall.insertAdjacentHTML("beforeend", next.map(adTile).join(""));
  SHOWN+=next.length;
  if(SHOWN>=FILTERED.length && _io){ _io.disconnect(); _io=null; }
}
// chip filter clicks
document.addEventListener("click", e=>{
  const chip=e.target.closest("#filters .chip"); if(chip){ const c=chip.dataset.cat;
    if(c==="*") activeCats.clear(); else { activeCats.has(c)?activeCats.delete(c):activeCats.add(c); }
    renderFilters(); render(); return; }
  const t=e.target.closest(".adtile"); if(!t) return;
  const btn=e.target.closest("[data-act]");
  const a=ADS.find(x=>String(x.id)===t.dataset.id); if(!a) return;
  if(!btn || btn.dataset.act==="edit"){ editAd(a); }
  else if(btn.dataset.act==="approve"){ approve(a.id,true); }
  else if(btn.dataset.act==="withdraw"){ approve(a.id,false); }
});

async function boot(){
  I18n.apply(document);
  if(!configured){ showGate(`<h2>${esc2(I18n.t("ads.notConnectedTitle"))}</h2><p>${esc2(I18n.t("ads.notConfigured"))}</p>`); return; }
  const s = await Auth.session();
  if(!s){ const pr=new URLSearchParams(location.search).get("role"); loginScreen(pr?"signup":"signin"); Auth.onChange(x=>{ if(x) boot(); }); return; }
  MYPROFILE = await Profiles.me(); MYROLE=(MYPROFILE&&MYPROFILE.role)||"reader"; ME=s.user.id;
  I18n.adoptProfile(MYPROFILE);
  // Any signed-in user can post a réclame (editors still approve before it runs).
  hideGate(); $("#hdr").style.display=""; $("#app").style.display="";
  I18n.apply(document);
  NavUser.render($("#navuser"), {
    profile: MYPROFILE, email: s.user.email, role: MYROLE,
    roleLabel: r => I18n.t("role."+r), onLogout: signOut,
  });
  try{ PAPERS = await Papers.map(); }catch(e){}
  $("#adFormBody").addEventListener("input", adPreviewLive);
  $("#adFormBody").addEventListener("change", adPreviewLive);
  fillIssues(); fillLangs(); fillCategories(); newAd(); await loadList();
}
document.addEventListener("daihbi:langchange", ()=>{
  I18n.apply(document);
  // re-translate the category <select> labels and the ad list without clobbering
  // the user's in-progress form selections (lang/issue keep their codes).
  if($("#app").style.display!=="none"){
    const cat=$("#f_category").value; fillCategories(); $("#f_category").value=cat;
    if(current==null){ $("#formTitle").textContent=I18n.t("ads.formNew"); }
    adPreviewLive(); loadList();
  }
});
$("#adModal").addEventListener("click", e=>{ if(e.target.id==="adModal") closeForm(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("#adModal").classList.contains("open")) closeForm(); });
boot();
</script>
</body>
</html>
