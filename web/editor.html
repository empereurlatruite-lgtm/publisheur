<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publisheur — Newsroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=PT+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1f1c18;--accent:#7a1f1a;--line:#d8cdb2;--bg:#ece5d4;--panel:#f7f2e6;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{background:#211f1c;color:#f3ead6;display:flex;align-items:center;gap:1rem;padding:.6rem 1.1rem;flex:none}
  header h1{font-family:"Playfair Display",serif;font-size:1.3rem;margin:0;letter-spacing:.02em}
  header .grow{flex:1}
  header .who{font-size:.78rem;opacity:.8}
  header a,header button{font:inherit;color:#f3ead6;background:#3a3631;border:1px solid #555;border-radius:5px;padding:.4rem .7rem;text-decoration:none;cursor:pointer}
  header button.primary{background:var(--accent);border-color:#a33;color:#fff;font-weight:600}

  main{flex:1;display:grid;grid-template-columns:300px 1fr 1fr;min-height:0}
  .col{min-height:0;overflow:auto;border-right:1px solid var(--line)}

  #list{background:var(--panel)}
  .listhead{display:flex;align-items:center;padding:.7rem .9rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);font-weight:600}
  .listhead .grow{flex:1}
  .item{padding:.6rem .9rem;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:.5rem;align-items:flex-start}
  .item:hover{background:#fff}
  .item.sel{background:#fff;border-left:4px solid var(--accent);padding-left:calc(.9rem - 4px)}
  .item .h{font-family:"Playfair Display",serif;font-weight:700;font-size:.98rem;line-height:1.15}
  .item .meta{font-size:.72rem;color:#7a7060;margin-top:.2rem;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
  .tag{font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;padding:.05rem .35rem;border-radius:3px;border:1px solid #c9bda0;background:#efe7d4}
  .tag.lead{background:#7a1f1a;color:#fff;border-color:#7a1f1a}
  .tag.major{background:#b5532a;color:#fff;border-color:#b5532a}
  .tag.off{opacity:.5}
  .tag.rev{background:#caa23a;color:#1a1714;border-color:#caa23a}
  .tag.pub{background:#2f6b3f;color:#fff;border-color:#2f6b3f}
  .arrows{display:flex;flex-direction:column;gap:1px}
  .arrows button{border:1px solid var(--line);background:#fff;cursor:pointer;font-size:.6rem;line-height:1;padding:.1rem .25rem;border-radius:3px}
  .listtop{position:sticky;top:0;z-index:5;background:var(--panel)}
  .listfilter{display:flex;flex-direction:column;gap:.4rem;padding:.5rem .9rem;border-bottom:1px solid var(--line)}
  .listfilter input{font:inherit;border:1px solid var(--line);border-radius:6px;padding:.35rem .5rem;background:#fff}
  .whochips{display:flex;gap:.3rem}
  .wchip{font:inherit;font-size:.73rem;border:1px solid var(--line);background:#fff;border-radius:999px;padding:.2rem .65rem;cursor:pointer}
  .wchip:hover{background:#fff}
  .wchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .item .mine{font-size:.6rem;color:#2a7;border:1px solid #b9d9c4;background:#eaf6ee;border-radius:3px;padding:.02rem .3rem;text-transform:uppercase;letter-spacing:.04em}

  #form{background:#fbf8ef;padding:1rem 1.1rem}
  #form .row{margin-bottom:.8rem}
  #form label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:#6a6253;margin-bottom:.25rem;font-weight:600}
  #form input,#form select,#form textarea{width:100%;font:inherit;padding:.5rem .6rem;border:1px solid #c9bda0;border-radius:6px;background:#fff;color:var(--ink)}
  #form textarea{min-height:240px;font-family:"PT Serif",Georgia,serif;line-height:1.5;resize:vertical}
  #form input.head{font-family:"Playfair Display",serif;font-weight:700;font-size:1.15rem}
  .dropzone{border:1px dashed #c9bda0;border-radius:8px;padding:.6rem;background:#fffdf7}
  .dropzone.drag{border-color:var(--accent);background:#fbeee9}
  .dzrow{display:flex;gap:.5rem}
  .dzrow input{flex:1}
  .dzbtn{font:inherit;white-space:nowrap;border:1px solid #c9bda0;background:#fff;border-radius:6px;padding:.5rem .7rem;cursor:pointer}
  .dzbtn:hover{background:#f3ecdd}
  .dzhint{font-size:.72rem;color:#9a907c;margin-top:.35rem}
  .imgwrap{position:relative;margin-top:.5rem;display:inline-block}
  .imgwrap img{max-width:100%;max-height:180px;border:1px solid #b9ad90;border-radius:4px;display:block;filter:grayscale(.6) sepia(.2) contrast(1.03)}
  .imgx{position:absolute;top:.3rem;right:.3rem;border:none;background:rgba(20,18,16,.8);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;cursor:pointer;line-height:1}
  .upstatus{font-size:.75rem;color:#6a6253;margin-top:.35rem;min-height:1em}
  /* Portfolio modal */
  .pmodal{position:fixed;inset:0;background:rgba(20,18,16,.75);z-index:120;display:flex;align-items:center;justify-content:center;padding:1.2rem}
  .pcard{background:#fbf8ef;border:1px solid #c9bda0;border-radius:12px;width:min(960px,96vw);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
  .phead{display:flex;align-items:center;gap:.5rem;padding:.8rem 1rem;border-bottom:1px solid var(--line);font-family:"Playfair Display",serif;font-size:1.15rem}
  .phead .grow{flex:1}.phead .px{border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;padding:.2rem .55rem;font:inherit}
  .pupload{padding:.7rem 1rem;border-bottom:1px solid var(--line);background:#fffdf7;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  .pupload input[type=text]{flex:1;min-width:9rem;font:inherit;padding:.45rem .5rem;border:1px solid #c9bda0;border-radius:6px}
  .pupload button{font:inherit;border:1px solid #c9bda0;background:#fff;border-radius:6px;padding:.45rem .7rem;cursor:pointer}
  .pupload button.go{background:var(--accent);color:#fff;border-color:var(--accent)}
  .pgrid{padding:1rem;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.9rem}
  .pcell{border:1px solid #d8cdb2;border-radius:8px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
  .pcell img{width:100%;height:120px;object-fit:cover;filter:grayscale(.4) sepia(.18)}
  .pcell .cap{padding:.35rem .5rem;font-size:.78rem;line-height:1.2}
  .pcell .by{padding:0 .5rem;font-size:.68rem;color:#9a907c}
  .pcell .pacts{display:flex;gap:.3rem;padding:.4rem .5rem;margin-top:auto}
  .pcell .pacts button{flex:1;font:inherit;font-size:.74rem;border:1px solid #c9bda0;background:#fff;border-radius:5px;cursor:pointer;padding:.25rem}
  .pcell .pacts .use{background:var(--accent);color:#fff;border-color:var(--accent)}
  .pcell .pacts .rm{flex:0 0 auto;color:#b33}
  .pempty{grid-column:1/-1;color:#8a8070;font-style:italic;text-align:center;padding:2rem}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
  .formbar{display:flex;gap:.5rem;align-items:center;margin-top:.4rem;flex-wrap:wrap}
  .formbar .grow{flex:1}
  .formbar button{font:inherit;border-radius:6px;padding:.55rem .9rem;cursor:pointer;border:1px solid #c9bda0;background:#fff}
  .save.ghost{background:#fff;color:var(--ink)}
  .statuslbl{font-size:.8rem;color:#7a7060;font-style:italic}
  .imgwrap2{display:flex;justify-content:center;margin:.3rem 0}
  .avatarprev{width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid #5a534a}
  .avatarph{width:84px;height:84px;border-radius:50%;border:2px dashed #5a534a;display:flex;align-items:center;justify-content:center;color:#7a7060}
  .formbar button.save{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .formbar button.del{color:#7a1f1a;border-color:#d8b6b2}
  .hint{font-size:.72rem;color:#8a8070;margin-top:.3rem}
  .chk{display:flex;align-items:center;gap:.4rem;font-size:.85rem;text-transform:none;letter-spacing:0;color:var(--ink)}

  #preview{display:flex;flex-direction:column;border-right:none}
  #preview .pvhead{padding:.5rem .9rem;border-bottom:1px solid var(--line);background:var(--panel);font-size:.8rem;color:#6a6253;display:flex;align-items:center;gap:.5rem}
  #preview iframe{flex:1;border:none;width:100%;background:#6b6357}

  .toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:#211f1c;color:#f3ead6;padding:.6rem 1rem;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;font-size:.85rem}
  .toast.show{opacity:1}

  /* login / setup gate */
  .gate{position:fixed;inset:0;background:#211f1c;color:#f3ead6;display:flex;align-items:center;justify-content:center;z-index:100}
  .gate .card{background:#2c2924;border:1px solid #4a443c;border-radius:12px;padding:2rem 2.2rem;max-width:430px;width:90%;text-align:center}
  .gate h2{font-family:"Playfair Display",serif;font-size:2rem;margin:.2rem 0 .3rem}
  .gate p{opacity:.85;font-size:.9rem;line-height:1.5}
  .gate input{width:100%;font:inherit;padding:.7rem .8rem;margin:.8rem 0;border-radius:8px;border:1px solid #5a534a;background:#1f1c18;color:#f3ead6}
  .gate button{font:inherit;width:100%;padding:.7rem;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
  .gate .authtabs{display:flex;gap:.4rem;margin:.2rem 0 .2rem}
  .gate .authtabs button{flex:1;width:auto;background:#1f1c18;color:#cdc4b2;border:1px solid #5a534a;padding:.5rem;border-radius:8px}
  .gate .authtabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .gate a{color:#e8b9b2}
  .gate select{width:100%;font:inherit;padding:.6rem .7rem;margin:.4rem 0;border-radius:8px;border:1px solid #5a534a;background:#1f1c18;color:#f3ead6}
  .rolepick{display:flex;gap:.3rem;margin:.4rem 0}
  .rolepick label{flex:1;font-size:.8rem;background:#1f1c18;border:1px solid #5a534a;border-radius:8px;padding:.4rem .3rem;cursor:pointer;display:flex;align-items:center;gap:.3rem;justify-content:center}
  .rolepick input{width:auto;margin:0}
  .rolebadge{font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;background:#3a3631;color:#f3ead6;border:1px solid #5a534a;border-radius:4px;padding:.1rem .4rem;margin-left:.4rem}
  .gate .err{color:#ff9b8e;font-size:.82rem;margin-top:.6rem;min-height:1em}
  .gate code{background:#1f1c18;padding:.1rem .3rem;border-radius:4px}
</style>
</head>
<body>

<!-- login / setup gate -->
<div class="gate" id="gate" style="display:none">
  <div class="card" id="gateCard"></div>
</div>

<header style="display:none" id="hdr">
  <h1>Publisheur <span style="opacity:.6;font-size:.8rem;font-family:system-ui">· Newsroom</span></h1>
  <label style="display:flex;align-items:center;gap:.4rem;font-size:.8rem;opacity:.85">
    Édition
    <select id="editionSel" onchange="switchEdition(this.value)"
      style="font:inherit;background:#2c2924;color:#f3ead6;border:1px solid #555;border-radius:5px;padding:.25rem .4rem"></select>
  </label>
  <span class="grow"></span>
  <span class="who" id="who"></span><span class="rolebadge" id="rolebadge" style="display:none"></span>
  <button onclick="openPortfolio()">🖼 Portfolio</button>
  <button onclick="openProfile()">Mon profil</button>
  <button id="newBtn" onclick="newArticle()">+ Article</button>
  <a id="openPaper" href="paper.html" target="_blank">Open full paper ↗</a>
  <button onclick="doSignOut()">Sign out</button>
</header>

<main style="display:none" id="app">
  <div class="col" id="list">
    <div class="listtop">
      <div class="listhead"><span class="grow">Articles</span><span id="listcount" style="font-weight:400;color:#7a7060;font-size:.78rem"></span></div>
      <div class="listfilter">
        <input type="search" id="listq" placeholder="Filtrer par titre ou auteur…" oninput="setQuery(this.value)">
        <div class="whochips">
          <button class="wchip on" data-who="all"    onclick="setWho('all')">Tous</button>
          <button class="wchip"    data-who="mine"   onclick="setWho('mine')">Moi</button>
          <button class="wchip"    data-who="others" onclick="setWho('others')">Autres</button>
        </div>
      </div>
    </div>
    <div id="items"></div>
  </div>

  <div class="col" id="form">
    <div class="row"><label>Kicker (small overline)</label><input id="f_kicker" placeholder="e.g. FROM THE FRONT"></div>
    <div class="row"><label>Headline</label><input id="f_headline" class="head" placeholder="Your headline here"></div>
    <div class="row"><label>Subhead / deck</label><input id="f_subhead" placeholder="One-line summary"></div>
    <div class="twocol">
      <div class="row"><label>Byline</label><input id="f_byline" placeholder="Reporter name"></div>
      <div class="row"><label>Prominence</label>
        <select id="f_weight">
          <option value="lead">Lead — front banner</option>
          <option value="major">Major — wide story</option>
          <option value="minor" selected>Minor — column story</option>
          <option value="brief">Brief — short item</option>
        </select>
      </div>
    </div>
    <div class="row">
      <label>Image (optionnel)</label>
      <div id="dropzone" class="dropzone">
        <div class="dzrow">
          <input id="f_image" placeholder="https://…  ou glissez/téléversez une photo" oninput="showPreview(this.value)">
          <button type="button" class="dzbtn" onclick="document.querySelector('#f_file').click()">📷 Téléverser</button>
          <button type="button" class="dzbtn" onclick="openPortfolio(true)">🖼 Portfolio</button>
          <input id="f_file" type="file" accept="image/*" style="display:none" onchange="onPickFile(this.files[0])">
        </div>
        <div class="dzhint">Glissez une image ici, ou collez une URL.</div>
        <div class="imgwrap" id="imgwrap" style="display:none">
          <img id="f_preview" alt="">
          <button type="button" class="imgx" title="Retirer l’image" onclick="clearImage()">✕</button>
        </div>
        <div class="upstatus" id="upstatus"></div>
      </div>
    </div>
    <div class="row"><label>Body</label>
      <textarea id="f_body" placeholder="Write the article. Blank line = new paragraph. **bold**, *italic*."></textarea>
      <div class="hint">Blank line = new paragraph · <code>**bold**</code> · <code>*italic*</code></div>
    </div>
    <div class="formbar" id="formbar"></div>
    <div class="hint" id="savedAt"></div>
  </div>

  <div class="col" id="preview">
    <div class="pvhead">Live preview <span class="grow"></span><button onclick="reloadPreview()" style="font:inherit;border:1px solid var(--line);background:#fff;border-radius:5px;padding:.2rem .5rem;cursor:pointer">↻</button></div>
    <iframe id="pv" src="paper.html"></iframe>
  </div>
</main>

<div class="toast" id="toast"></div>

<!-- Portfolio modal -->
<div class="pmodal" id="pmodal" style="display:none">
  <div class="pcard">
    <div class="phead"><b>Portfolio des illustrateurs</b><span class="grow"></span><button class="px" onclick="closePortfolio()">✕</button></div>
    <div class="pupload" id="pUpload"></div>
    <div class="pgrid" id="pGrid"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="papers.js"></script>
<script src="daihbi.js"></script>
<script>
const $ = s => document.querySelector(s);
const { Auth, Articles, Media, Profiles, Portfolio, configured } = window.Daihbi;
const ISSUE = window.Daihbi.ISSUE;
const PAPERS = window.DAIHBI_PAPERS || {};
let current = null;
let MYROLE = "reader", MYPROFILE = null;
const ROLE_LABELS = { reader:"Lecteur", writer:"Rédacteur", illustrator:"Illustrateur", editor:"Éditeur", annonceur:"Annonceur" };
const roleLabel = r => ROLE_LABELS[r] || r;

const F = {
  kicker:$("#f_kicker"), headline:$("#f_headline"), subhead:$("#f_subhead"),
  byline:$("#f_byline"), weight:$("#f_weight"), image:$("#f_image"),
  body:$("#f_body"),
};
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }
function escapeHtml(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

// ── Gate: setup notice or login ──────────────────────────────────────────
function showGate(html){ $("#gate").style.display="flex"; $("#gateCard").innerHTML=html; }
function hideGate(){ $("#gate").style.display="none"; }

function setupNotice(){
  showGate(`<h2>Almost there</h2>
    <p>Connect your Supabase project: open <code>web/config.js</code> and paste your
    <b>Project URL</b> and <b>anon key</b> (Supabase → Settings → API), then reload.</p>`);
}
function loginScreen(msg, mode){
  mode = mode || "signin";
  const up = mode === "signup";
  showGate(`<h2>Publisheur</h2>
    <div class="authtabs">
      <button class="${up?"":"on"}" onclick="loginScreen(null,'signin')">Se connecter</button>
      <button class="${up?"on":""}" onclick="loginScreen(null,'signup')">Créer un compte</button>
    </div>
    <input id="email" type="email" placeholder="vous@exemple.com" autocomplete="username" autofocus>
    <input id="password" type="password" placeholder="${up?"choisir un mot de passe (6+ caractères)":"mot de passe"}" autocomplete="${up?"new-password":"current-password"}">
    ${up ? `
      <input id="display_name" type="text" placeholder="Nom de plume (affiché)" autocomplete="name">
      <div class="rolepick">
        <label><input type="radio" name="role" value="reader"> Lecteur</label>
        <label><input type="radio" name="role" value="writer" checked> Rédacteur</label>
        <label><input type="radio" name="role" value="illustrator"> Illustrateur</label>
        <label><input type="radio" name="role" value="annonceur"> Annonceur</label>
      </div>
      <select id="clan">${(window.DAIHBI_CLANS||["Indépendant"]).map(c=>`<option>${c}</option>`).join("")}</select>
    ` : ""}
    <button onclick="${up?"doSignUp()":"doPasswordLogin()"}">${up?"Créer le compte":"Se connecter"}</button>
    <div class="err" id="loginErr">${msg||""}</div>
    ${up
      ? `<p style="margin-top:1rem;font-size:.8rem;opacity:.7">Déjà un compte ? <a href="#" onclick="loginScreen(null,'signin');return false">Se connecter</a>.</p>`
      : `<p style="margin-top:1rem;font-size:.8rem;opacity:.7">Pas de mot de passe ? <a href="#" onclick="sendLink();return false">Recevoir un lien par e-mail</a>.</p>`}`);
  const act = up ? doSignUp : doPasswordLogin;
  const pw=$("#password"); if(pw) pw.addEventListener("keydown",e=>{if(e.key==="Enter")act();});
  const inp=$("#email"); if(inp) inp.addEventListener("keydown",e=>{if(e.key==="Enter")$("#password").focus();});
}
async function doPasswordLogin(){
  const email=$("#email").value.trim(), password=$("#password").value;
  if(!email||!password){ $("#loginErr").textContent="Entrez votre e-mail et votre mot de passe."; return; }
  try{ await Auth.signInPassword(email,password); /* onChange handler reloads the app */ }
  catch(e){ $("#loginErr").textContent=e.message; }
}
async function doSignUp(){
  const email=$("#email").value.trim(), password=$("#password").value;
  if(!email||!password){ $("#loginErr").textContent="Entrez un e-mail et un mot de passe."; return; }
  if(password.length<6){ $("#loginErr").textContent="Mot de passe : 6 caractères minimum."; return; }
  const role=(document.querySelector('input[name="role"]:checked')||{}).value||"reader";
  const clan=($("#clan")||{}).value||"";
  const display_name=($("#display_name")||{}).value.trim()||"";
  try{
    const data = await Auth.signUp(email,password,{role,clan,display_name});
    if(data && data.session){ /* auto-confirmé → onChange recharge l'app */ }
    else { $("#gateCard").innerHTML=`<h2>Compte créé ✓</h2>
      <p>Un e-mail de confirmation a été envoyé à <b>${escapeHtml(email)}</b>.</p>
      <p style="font-size:.85rem;opacity:.85">Cliquez le lien — <b>même si la page affiche une erreur</b>, votre compte est validé.
      Revenez ensuite ici et <a href="#" onclick="loginScreen(null,'signin');return false">connectez-vous</a> avec votre mot de passe.</p>`; }
  }catch(e){ $("#loginErr").textContent=e.message; }
}
async function sendLink(){
  const email=$("#email").value.trim();
  if(!email){ $("#loginErr").textContent="Entrez votre e-mail."; return; }
  try{ await Auth.signIn(email); $("#gateCard").innerHTML=`<h2>Vérifiez votre e-mail</h2><p>Lien de connexion envoyé à <b>${escapeHtml(email)}</b>. Ouvrez-le sur cet appareil.</p>`; }
  catch(e){ $("#loginErr").textContent=e.message; }
}
async function doSignOut(){ await Auth.signOut(); location.reload(); }

// ── Form ──────────────────────────────────────────────────────────────────
function formData(){
  return {
    kicker:F.kicker.value.trim(), headline:F.headline.value.trim()||"Untitled",
    subhead:F.subhead.value.trim(), byline:F.byline.value.trim(),
    weight:F.weight.value, image_url:F.image.value.trim(),
    body:F.body.value,
  };
}
function fill(a){
  current=a?a.id:null;
  F.kicker.value=a?.kicker||""; F.headline.value=a?.headline||"";
  F.subhead.value=a?.subhead||""; F.byline.value=a?.byline||"";
  F.weight.value=a?.weight||"minor"; F.image.value=a?.image_url||"";
  F.body.value=a?.body||"";
  const pub=$("#f_published"); if(pub) pub.checked = a ? !!a.published : false;
  const sl=$("#statusLbl"); if(sl) sl.textContent = a ? statusLabel(a) : "Nouveau brouillon";
  $("#delBtn").style.display=a?"":"none";
  $("#savedAt").textContent=a?.updated_at?"Modifié le "+new Date(a.updated_at).toLocaleString("fr-FR"):"";
  showPreview(a?.image_url||""); $("#upstatus").textContent="";
  highlight();
}
function newArticle(){ fill(null); F.headline.focus(); }

// ── Image upload ──────────────────────────────────────────────────────────
function showPreview(url){
  const wrap=$("#imgwrap"), img=$("#f_preview");
  if(url){ img.src=url; wrap.style.display=""; } else { wrap.style.display="none"; img.removeAttribute("src"); }
}
function clearImage(){ F.image.value=""; showPreview(""); $("#upstatus").textContent=""; }
function onPickFile(file){ if(file) uploadImage(file); }
async function uploadImage(file){
  if(!file) return;
  $("#upstatus").textContent="Envoi de l’image…";
  try{
    const url=await Media.upload(file);
    F.image.value=url; showPreview(url);
    $("#upstatus").textContent="✓ Image ajoutée. N’oubliez pas d’enregistrer.";
  }catch(e){ $("#upstatus").textContent="Erreur : "+e.message; }
}
function wireDropzone(){
  const dz=$("#dropzone"); if(!dz) return;
  ["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add("drag");}));
  ["dragleave","dragend"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove("drag");}));
  dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("drag");const f=e.dataTransfer?.files?.[0];if(f)uploadImage(f);});
}
function highlight(){ document.querySelectorAll(".item").forEach(el=>el.classList.toggle("sel",String(el.dataset.id)===String(current))); }

let ALL = [];                       // every article in this edition (cache)
let ME = null;                      // current user's id (set in boot)
const listFilter = { q:"", who:"all" };   // who: all | mine | others

async function loadList(){
  try{ ALL = await Articles.listAll(); }catch(e){ toast("Load error: "+e.message); return; }
  renderList();
}
function setQuery(v){ listFilter.q=v; renderList(); }
function setWho(w){
  listFilter.who=w;
  document.querySelectorAll(".wchip").forEach(c=>c.classList.toggle("on", c.dataset.who===w));
  renderList();
}
function matchFilter(a){
  if(listFilter.who==="mine"   && a.author_id!==ME) return false;
  if(listFilter.who==="others" && (!a.author_id || a.author_id===ME)) return false;
  const q=listFilter.q.trim().toLowerCase();
  if(q && !((a.headline||"")+" "+(a.byline||"")).toLowerCase().includes(q)) return false;
  return true;
}
function renderList(){
  const arts = ALL.filter(matchFilter);
  const total = ALL.length, others = ALL.filter(a=>a.author_id&&a.author_id!==ME).length;
  $("#listcount").textContent = `${arts.length}/${total}` + (others?` · ${others} d’autres`:"");
  $("#items").innerHTML = arts.length ? arts.map(itemHTML).join("")
    : `<div style="padding:1.4rem;color:#8a8070;font-style:italic">Aucun article pour ce filtre.</div>`;
  highlight();
}
function itemHTML(a){
  const mine = a.author_id && a.author_id===ME;
  return `<div class="item" data-id="${a.id}" onclick="edit('${a.id}')">
    <div style="flex:1">
      <div class="h">${escapeHtml(a.headline)}</div>
      <div class="meta"><span class="tag ${a.weight}">${a.weight}</span>
        <span class="tag ${a.published?'pub':(((a.status||'')==='review')?'rev':'off')}">${statusLabel(a)}</span>
        ${mine?'<span class="mine">vous</span>':""}${a.byline?escapeHtml(a.byline):""}</div>
    </div>
    <div class="arrows" onclick="event.stopPropagation()">
      <button title="Up" onclick="move('${a.id}','up')">▲</button>
      <button title="Down" onclick="move('${a.id}','down')">▼</button>
    </div>
  </div>`;
}
async function edit(id){ try{ fill(await Articles.get(id)); }catch(e){ toast(e.message); } }

function statusLabel(a){
  const s = a.status || (a.published ? "published" : "draft");
  return { draft:"Brouillon", review:"En relecture", published:"Publié" }[s] || s;
}
async function saveArticle(action){
  const data=formData();
  if(MYROLE==="editor"){
    const pub = $("#f_published") ? $("#f_published").checked : false;
    data.published = pub; data.status = pub ? "published" : "draft";
  } else if(action==="review"){ data.published=false; data.status="review"; }
  else { data.published=false; data.status="draft"; }
  try{
    const saved = current==null ? await Articles.create(data) : await Articles.update(current,data);
    current=saved.id;
    toast(saved.published ? "Publié ✓" : (saved.status==="review" ? "Soumis en relecture ✓" : "Brouillon enregistré ✓"));
    await loadList(); fill(saved); reloadPreview();
  }catch(e){ toast("Erreur : "+e.message); }
}
async function delArticle(){
  if(current==null) return;
  if(!confirm("Supprimer cet article ?")) return;
  try{ await Articles.remove(current); toast("Supprimé"); newArticle(); await loadList(); reloadPreview(); }
  catch(e){ toast(e.message); }
}
function renderFormBar(){
  const bar=$("#formbar"); if(!bar) return;
  if(MYROLE==="editor"){
    bar.innerHTML = `<label class="chk"><input type="checkbox" id="f_published"> Publié (visible des lecteurs)</label>
      <span class="grow"></span>
      <button class="del" id="delBtn" onclick="delArticle()" style="display:none">Supprimer</button>
      <button class="save" onclick="saveArticle()">Enregistrer</button>`;
  } else {
    bar.innerHTML = `<span class="statuslbl" id="statusLbl"></span>
      <span class="grow"></span>
      <button class="del" id="delBtn" onclick="delArticle()" style="display:none">Supprimer</button>
      <button class="save ghost" onclick="saveArticle('draft')">Brouillon</button>
      <button class="save" onclick="saveArticle('review')">Soumettre en relecture</button>`;
  }
}

// ── Profile ─────────────────────────────────────────────────────────────────
function openProfile(){
  const p=MYPROFILE||{};
  showGate(`<h2>Mon profil</h2>
    <div class="rolebadge" style="display:inline-block;margin:.2rem 0 .6rem">${roleLabel(MYROLE)}</div>
    <div class="imgwrap2" id="av_wrap">${p.avatar_url?`<img class="avatarprev" src="${escapeHtml(p.avatar_url)}">`:`<div class="avatarph">—</div>`}</div>
    <button onclick="document.querySelector('#p_avatar').click()">📷 Changer l’avatar</button>
    <input id="p_avatar" type="file" accept="image/*" style="display:none" onchange="uploadAvatar(this.files[0])">
    <input id="p_name" placeholder="Nom de plume" value="${escapeHtml(p.display_name||"")}">
    <select id="p_clan">${(window.DAIHBI_CLANS||[]).map(c=>`<option ${c===p.clan?"selected":""}>${escapeHtml(c)}</option>`).join("")}</select>
    <div class="err" id="profErr"></div>
    <button onclick="saveProfile()">Enregistrer</button>
    <p style="margin-top:.7rem;font-size:.85rem"><a href="#" onclick="hideGate();return false">Fermer</a></p>`);
}
async function uploadAvatar(file){
  if(!file) return;
  $("#profErr").textContent="Envoi…";
  try{
    const url=await Media.upload(file,"avatars");
    await Profiles.update({avatar_url:url}); MYPROFILE.avatar_url=url;
    $("#av_wrap").innerHTML=`<img class="avatarprev" src="${escapeHtml(url)}">`;
    $("#profErr").textContent="";
  }catch(e){ $("#profErr").textContent="Erreur : "+e.message; }
}
async function saveProfile(){
  try{
    const upd=await Profiles.update({ display_name:$("#p_name").value.trim(), clan:$("#p_clan").value });
    MYPROFILE=upd; $("#who").textContent=upd.display_name||MYPROFILE.display_name||"";
    hideGate(); toast("Profil enregistré");
  }catch(e){ $("#profErr").textContent="Erreur : "+e.message; }
}
function readerGate(){
  showGate(`<h2>Espace lecteur</h2>
    <p>Votre compte est en <b>Lecteur</b>. La rédaction est réservée aux rédacteurs, illustrateurs et éditeurs.</p>
    <a class="authlink" href="index.html" style="display:block;margin:.6rem 0;color:#e8b9b2">📰 Aller au kiosque →</a>
    <button onclick="becomeWriter()">Devenir rédacteur</button>
    <p style="margin-top:.6rem;font-size:.85rem"><a href="#" onclick="doSignOut();return false">Se déconnecter</a></p>`);
}
async function becomeWriter(){
  try{ await Profiles.update({role:"writer"}); location.reload(); }
  catch(e){ alert(e.message); }
}
function advertiserGate(){
  showGate(`<h2>Espace annonceur</h2>
    <p>Bienvenue ! Le studio publicitaire (créer une réclame, la faire valider par un éditeur, l’afficher dans le journal) arrive bientôt.</p>
    <a class="authlink" href="index.html" style="display:block;margin:.6rem 0;color:#e8b9b2">📰 Voir le kiosque →</a>
    <p style="margin-top:.6rem;font-size:.85rem"><a href="#" onclick="doSignOut();return false">Se déconnecter</a></p>`);
}

// ── Portfolio (illustrateurs) ───────────────────────────────────────────────
let pPendingUrl = null;
function openPortfolio(){ $("#pmodal").style.display="flex"; renderPUpload(); loadPGrid(); }
function closePortfolio(){ $("#pmodal").style.display="none"; pPendingUrl=null; }
function renderPUpload(){
  const can = (MYROLE==="illustrator"||MYROLE==="editor");
  const u=$("#pUpload"); u.style.display = can ? "flex" : "none";
  if(can) u.innerHTML = `
    <button onclick="document.querySelector('#pFile').click()">📷 Choisir une image</button>
    <input id="pFile" type="file" accept="image/*" style="display:none" onchange="pPickFile(this.files[0])">
    <input id="pCap" type="text" placeholder="Légende (optionnelle)">
    <button class="go" onclick="addToPortfolio()">Ajouter au portfolio</button>
    <span id="pStatus" style="font-size:.78rem;color:#6a6253"></span>`;
}
async function pPickFile(file){
  if(!file) return;
  $("#pStatus").textContent="Envoi…";
  try{ pPendingUrl = await Media.upload(file,"portfolio"); $("#pStatus").textContent="✓ prête — ajoutez une légende puis « Ajouter »."; }
  catch(e){ $("#pStatus").textContent="Erreur : "+e.message; }
}
async function addToPortfolio(){
  if(!pPendingUrl){ $("#pStatus").textContent="Choisissez d’abord une image."; return; }
  try{
    await Portfolio.add({ url:pPendingUrl, caption:($("#pCap")||{}).value||"", clan:(MYPROFILE&&MYPROFILE.clan)||"", uploader_name:(MYPROFILE&&MYPROFILE.display_name)||"" });
    pPendingUrl=null; if($("#pCap")) $("#pCap").value=""; $("#pStatus").textContent="✓ Ajoutée au portfolio.";
    await loadPGrid();
  }catch(e){ $("#pStatus").textContent="Erreur : "+e.message; }
}
async function loadPGrid(){
  let imgs=[]; try{ imgs=await Portfolio.list(); }catch(e){ $("#pGrid").innerHTML=`<div class="pempty">Portfolio indisponible.<br>${escapeHtml(e.message)}</div>`; return; }
  $("#pGrid").innerHTML = imgs.length ? imgs.map(im=>{
    const own = im.uploader_id===ME || MYROLE==="editor";
    return `<div class="pcell">
      <img src="${escapeHtml(im.url)}" alt="">
      ${im.caption?`<div class="cap">${escapeHtml(im.caption)}</div>`:""}
      <div class="by">par ${escapeHtml(im.uploader_name||"?")}${im.clan?" · "+escapeHtml(im.clan):""}</div>
      <div class="pacts">
        <button class="use" onclick="usePortfolioImage('${escapeHtml(im.url)}')">Utiliser</button>
        ${own?`<button class="rm" title="Supprimer" onclick="removePortfolioImage('${im.id}')">✕</button>`:""}
      </div></div>`;
  }).join("") : `<div class="pempty">Aucune image pour l’instant.${(MYROLE==="illustrator"||MYROLE==="editor")?" Ajoutez-en une ci-dessus.":""}</div>`;
}
function usePortfolioImage(url){ F.image.value=url; showPreview(url); closePortfolio(); toast("Image ajoutée à l’article — enregistrez."); }
async function removePortfolioImage(id){ if(!confirm("Retirer cette image du portfolio ?"))return; try{ await Portfolio.remove(id); await loadPGrid(); }catch(e){ alert(e.message); } }
async function move(id,dir){ try{ await Articles.move(id,dir); await loadList(); reloadPreview(); }catch(e){ toast(e.message); } }
function previewURL(){ return `paper.html?issue=${encodeURIComponent(ISSUE)}&_=${Date.now()}`; }
function reloadPreview(){ $("#pv").src=previewURL(); }
function switchEdition(issue){ location.href = `editor.html?issue=${encodeURIComponent(issue)}`; }
function initEditions(){
  const sel=$("#editionSel"); if(!sel) return;
  const keys=Object.keys(PAPERS);
  if(!keys.includes(ISSUE)) keys.unshift(ISSUE);          // unknown/custom edition still shows
  sel.innerHTML = keys.map(k=>{
    const name=(PAPERS[k]?.name)||k;
    return `<option value="${k}" ${k===ISSUE?"selected":""}>${name}</option>`;
  }).join("");
  // point the preview iframe + "open paper" at the current edition
  $("#pv").src = previewURL();
  $("#openPaper").href = `paper.html?issue=${encodeURIComponent(ISSUE)}`;
}

document.addEventListener("keydown",e=>{ if((e.ctrlKey||e.metaKey)&&e.key==="s"){ e.preventDefault(); saveArticle(MYROLE==="editor"?undefined:"draft"); } });

// ── Boot ───────────────────────────────────────────────────────────────────
async function boot(){
  if(!configured){ setupNotice(); return; }
  const session = await Auth.session();
  if(!session){ loginScreen(); Auth.onChange(s=>{ if(s) location.reload(); }); return; }
  // load profile + role
  MYPROFILE = await Profiles.me();
  MYROLE = (MYPROFILE && MYPROFILE.role) || "reader";
  if(MYROLE === "annonceur"){ advertiserGate(); return; }   // ad studio coming soon
  if(!["writer","illustrator","editor"].includes(MYROLE)){ readerGate(); return; }  // readers → kiosque
  // signed in as a contributor
  hideGate();
  $("#hdr").style.display=""; $("#app").style.display="";
  $("#who").textContent = MYPROFILE.display_name || session.user.email || "";
  $("#rolebadge").textContent = roleLabel(MYROLE); $("#rolebadge").style.display="";
  ME = session.user.id;
  renderFormBar();
  initEditions();
  wireDropzone();
  Articles.subscribe(loadList);
  await loadList(); newArticle();
}
boot();
</script>
