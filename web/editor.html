<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publisheur — Newsroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=PT+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1f1c18;--accent:#7a1f1a;--line:#d8cdb2;--bg:#ece5d4;--panel:#f7f2e6;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{background:#211f1c;color:#f3ead6;display:flex;align-items:center;gap:1rem;padding:.6rem 1.1rem;flex:none}
  header h1{font-family:"Playfair Display",serif;font-size:1.3rem;margin:0;letter-spacing:.02em}
  header .grow{flex:1}
  header .who{font-size:.78rem;opacity:.8}
  header a,header button{font:inherit;color:#f3ead6;background:#3a3631;border:1px solid #555;border-radius:5px;padding:.4rem .7rem;text-decoration:none;cursor:pointer}
  header button.primary{background:var(--accent);border-color:#a33;color:#fff;font-weight:600}

  main{flex:1;display:grid;grid-template-columns:300px 1fr 1fr;min-height:0}
  .col{min-height:0;overflow:auto;border-right:1px solid var(--line)}

  #list{background:var(--panel)}
  .listhead{display:flex;align-items:center;padding:.7rem .9rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);font-weight:600}
  .listhead .grow{flex:1}
  .item{padding:.6rem .9rem;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:.5rem;align-items:flex-start}
  .item:hover{background:#fff}
  .item.sel{background:#fff;border-left:4px solid var(--accent);padding-left:calc(.9rem - 4px)}
  .item .h{font-family:"Playfair Display",serif;font-weight:700;font-size:.98rem;line-height:1.15}
  .item .meta{font-size:.72rem;color:#7a7060;margin-top:.2rem;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
  .tag{font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;padding:.05rem .35rem;border-radius:3px;border:1px solid #c9bda0;background:#efe7d4}
  .tag.lead{background:#7a1f1a;color:#fff;border-color:#7a1f1a}
  .tag.major{background:#b5532a;color:#fff;border-color:#b5532a}
  .tag.off{opacity:.5}
  .tag.rev{background:#caa23a;color:#1a1714;border-color:#caa23a}
  .tag.pub{background:#2f6b3f;color:#fff;border-color:#2f6b3f}
  .arrows{display:flex;flex-direction:column;gap:1px}
  .arrows button{border:1px solid var(--line);background:#fff;cursor:pointer;font-size:.6rem;line-height:1;padding:.1rem .25rem;border-radius:3px}
  .listtop{position:sticky;top:0;z-index:5;background:var(--panel)}
  .listfilter{display:flex;flex-direction:column;gap:.4rem;padding:.5rem .9rem;border-bottom:1px solid var(--line)}
  .listfilter input{font:inherit;border:1px solid var(--line);border-radius:6px;padding:.35rem .5rem;background:#fff}
  .whochips{display:flex;gap:.3rem}
  .wchip{font:inherit;font-size:.73rem;border:1px solid var(--line);background:#fff;border-radius:999px;padding:.2rem .65rem;cursor:pointer}
  .wchip:hover{background:#fff}
  .wchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .item .mine{font-size:.6rem;color:#2a7;border:1px solid #b9d9c4;background:#eaf6ee;border-radius:3px;padding:.02rem .3rem;text-transform:uppercase;letter-spacing:.04em}

  #form{background:#fbf8ef;padding:1rem 1.1rem}
  #form .row{margin-bottom:.8rem}
  #form label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:#6a6253;margin-bottom:.25rem;font-weight:600}
  #form input,#form select,#form textarea{width:100%;font:inherit;padding:.5rem .6rem;border:1px solid #c9bda0;border-radius:6px;background:#fff;color:var(--ink)}
  #form textarea{min-height:240px;font-family:"PT Serif",Georgia,serif;line-height:1.5;resize:vertical}
  #form input.head{font-family:"Playfair Display",serif;font-weight:700;font-size:1.15rem}
  .dropzone{border:1px dashed #c9bda0;border-radius:8px;padding:.6rem;background:#fffdf7}
  .dropzone.drag{border-color:var(--accent);background:#fbeee9}
  .dzrow{display:flex;gap:.5rem}
  .dzrow input{flex:1}
  .dzbtn{font:inherit;white-space:nowrap;border:1px solid #c9bda0;background:#fff;border-radius:6px;padding:.5rem .7rem;cursor:pointer}
  .dzbtn:hover{background:#f3ecdd}
  .dzhint{font-size:.72rem;color:#9a907c;margin-top:.35rem}
  .imgwrap{position:relative;margin-top:.5rem;display:inline-block}
  .imgwrap img{max-width:100%;max-height:180px;border:1px solid #b9ad90;border-radius:4px;display:block;filter:grayscale(.6) sepia(.2) contrast(1.03)}
  .imgx{position:absolute;top:.3rem;right:.3rem;border:none;background:rgba(20,18,16,.8);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;cursor:pointer;line-height:1}
  .upstatus{font-size:.75rem;color:#6a6253;margin-top:.35rem;min-height:1em}
  /* Portfolio modal */
  .pmodal{position:fixed;inset:0;background:rgba(20,18,16,.75);z-index:120;display:flex;align-items:center;justify-content:center;padding:1.2rem}
  .pcard{background:#fbf8ef;border:1px solid #c9bda0;border-radius:12px;width:min(960px,96vw);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
  .phead{display:flex;align-items:center;gap:.5rem;padding:.8rem 1rem;border-bottom:1px solid var(--line);font-family:"Playfair Display",serif;font-size:1.15rem}
  .phead .grow{flex:1}.phead .px{border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;padding:.2rem .55rem;font:inherit}
  .pupload{padding:.7rem 1rem;border-bottom:1px solid var(--line);background:#fffdf7;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  .pupload input[type=text]{flex:1;min-width:9rem;font:inherit;padding:.45rem .5rem;border:1px solid #c9bda0;border-radius:6px}
  .pupload button{font:inherit;border:1px solid #c9bda0;background:#fff;border-radius:6px;padding:.45rem .7rem;cursor:pointer}
  .pupload button.go{background:var(--accent);color:#fff;border-color:var(--accent)}
  .pgrid{padding:1rem;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.9rem}
  .pcell{border:1px solid #d8cdb2;border-radius:8px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
  .pcell img{width:100%;height:120px;object-fit:cover;filter:grayscale(.4) sepia(.18)}
  .pcell .cap{padding:.35rem .5rem;font-size:.78rem;line-height:1.2}
  .pcell .by{padding:0 .5rem;font-size:.68rem;color:#9a907c}
  .pcell .pacts{display:flex;gap:.3rem;padding:.4rem .5rem;margin-top:auto}
  .pcell .pacts button{flex:1;font:inherit;font-size:.74rem;border:1px solid #c9bda0;background:#fff;border-radius:5px;cursor:pointer;padding:.25rem}
  .pcell .pacts .use{background:var(--accent);color:#fff;border-color:var(--accent)}
  .pcell .pacts .rm{flex:0 0 auto;color:#b33}
  .pempty{grid-column:1/-1;color:#8a8070;font-style:italic;text-align:center;padding:2rem}
  /* Journal create/manage */
  .jbody{padding:1rem;overflow:auto}
  .jbody label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:#6a6253;margin:.6rem 0 .2rem;font-weight:600}
  .jbody input,.jbody select{width:100%;font:inherit;padding:.5rem .6rem;border:1px solid #c9bda0;border-radius:6px;background:#fff}
  .jbody .two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
  .jbody .jbar{display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap;align-items:center}
  .jbody .jbar .grow{flex:1}
  .jbody .jbar button{font:inherit;border-radius:6px;padding:.55rem .9rem;cursor:pointer;border:1px solid #c9bda0;background:#fff}
  .jbody .jbar button.go{background:var(--accent);color:#fff;border-color:var(--accent)}
  .coed{display:flex;align-items:center;gap:.5rem;padding:.35rem 0;border-bottom:1px solid var(--line);font-size:.88rem}
  .coed .grow{flex:1}
  .coed button{font:inherit;font-size:.74rem;border:1px solid #c9bda0;background:#fff;border-radius:5px;padding:.2rem .5rem;cursor:pointer}
  .jerr{font-size:.82rem;min-height:1em;margin-top:.4rem;color:#b33}
  .revrow{border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem;margin-bottom:.6rem;background:#fff}
  .revmeta{display:flex;flex-wrap:wrap;gap:.4rem;align-items:baseline;justify-content:space-between}
  .revmeta b{font-family:"Playfair Display",serif}
  .revmeta span{font-size:.74rem;color:#7a7060}
  .revexcerpt{font-size:.85rem;color:#4a443c;margin:.3rem 0;line-height:1.4;max-height:3.6em;overflow:hidden}
  .revacts button{font:inherit;font-size:.78rem;border:1px solid #c9bda0;background:#fff;border-radius:5px;padding:.3rem .6rem;cursor:pointer}
  .revacts button:hover{background:#f3ecdd}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
  .formbar{display:flex;gap:.5rem;align-items:center;margin-top:.4rem;flex-wrap:wrap}
  .formbar .grow{flex:1}
  .formbar button{font:inherit;border-radius:6px;padding:.55rem .9rem;cursor:pointer;border:1px solid #c9bda0;background:#fff}
  .save.ghost{background:#fff;color:var(--ink)}
  .statuslbl{font-size:.8rem;color:#7a7060;font-style:italic}
  .imgwrap2{display:flex;justify-content:center;margin:.3rem 0}
  .avatarprev{width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid #5a534a}
  .avatarph{width:84px;height:84px;border-radius:50%;border:2px dashed #5a534a;display:flex;align-items:center;justify-content:center;color:#7a7060}
  .formbar button.save{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .formbar button.del{color:#7a1f1a;border-color:#d8b6b2}
  .hint{font-size:.72rem;color:#8a8070;margin-top:.3rem}
  .chk{display:flex;align-items:center;gap:.4rem;font-size:.85rem;text-transform:none;letter-spacing:0;color:var(--ink)}

  /* editions dashboard */
  #dash{display:block;background:var(--bg);overflow:auto}
  .dashwrap{max-width:1100px;margin:0 auto;padding:1.6rem 1.2rem 3rem}
  .dashhead{margin-bottom:1.2rem}
  .dashtitle{font-family:"Playfair Display",serif;font-size:1.9rem;margin:.2rem 0}
  .dashsub{color:#7a7060;margin:0;font-size:.9rem}
  .dashgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.1rem}
  .dcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.1rem .9rem;box-shadow:0 3px 12px rgba(0,0,0,.08);display:flex;flex-direction:column;min-height:150px}
  .dcard .dmast{font-family:"UnifrakturCook",serif;font-size:1.8rem;line-height:1.05;text-align:center;margin:.2rem 0}
  .dcard.anton .dmast{font-family:"Anton",Impact,sans-serif;text-transform:uppercase;font-size:1.7rem}
  .dcard.echo  .dmast{font-family:"Oswald",sans-serif;font-weight:700;text-transform:uppercase;color:#1f3a5f;font-size:1.6rem}
  .dcard .dtag{text-align:center;font-style:italic;color:#7a7060;font-size:.8rem;margin-bottom:.6rem}
  .dcard .dmeta{text-align:center;font-size:.74rem;color:#9a907c;margin-top:auto}
  .dcard .dacts{display:flex;gap:.5rem;margin-top:.7rem}
  .dcard .dacts .open{flex:1;font:inherit;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:.5rem;cursor:pointer;font-weight:600}
  .dcard .dacts .del{font:inherit;border:1px solid #d8b6b2;background:#fff;color:#7a1f1a;border-radius:6px;padding:.5rem .6rem;cursor:pointer}
  .dcard.dnew{align-items:center;justify-content:center;text-align:center;border:2px dashed #c9bda0;background:#fffdf7;cursor:pointer;color:#6a6253}
  .dcard.dnew:hover{border-color:var(--accent);color:var(--accent)}
  .dcard.dnew .dnew-plus{font-size:2.4rem;line-height:1}
  .dempty{grid-column:1/-1;color:#8a8070;font-style:italic;text-align:center;padding:2rem}

  /* chronicle workspace: list + form only (no paper preview) */
  #app.chron{grid-template-columns:minmax(260px,360px) 1fr}
  #app.chron #preview{display:none}
  #app.chron .whochips{display:none}
  #preview{display:flex;flex-direction:column;border-right:none}
  #preview .pvhead{padding:.5rem .9rem;border-bottom:1px solid var(--line);background:var(--panel);font-size:.8rem;color:#6a6253;display:flex;align-items:center;gap:.5rem}
  #preview iframe{flex:1;border:none;width:100%;background:#6b6357}

  .toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:#211f1c;color:#f3ead6;padding:.6rem 1rem;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;font-size:.85rem}
  .toast.show{opacity:1}

  /* login / setup gate */
  .gate{position:fixed;inset:0;background:#211f1c;color:#f3ead6;display:flex;align-items:center;justify-content:center;z-index:100}
  .gate .card{background:#2c2924;border:1px solid #4a443c;border-radius:12px;padding:2rem 2.2rem;max-width:430px;width:90%;text-align:center}
  .gate h2{font-family:"Playfair Display",serif;font-size:2rem;margin:.2rem 0 .3rem}
  .gate p{opacity:.85;font-size:.9rem;line-height:1.5}
  .gate input{width:100%;font:inherit;padding:.7rem .8rem;margin:.8rem 0;border-radius:8px;border:1px solid #5a534a;background:#1f1c18;color:#f3ead6}
  .gate button{font:inherit;width:100%;padding:.7rem;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
  .gate .authtabs{display:flex;gap:.4rem;margin:.2rem 0 .2rem}
  .gate .authtabs button{flex:1;width:auto;background:#1f1c18;color:#cdc4b2;border:1px solid #5a534a;padding:.5rem;border-radius:8px}
  .gate .authtabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .gate a{color:#e8b9b2}
  .gate select{width:100%;font:inherit;padding:.6rem .7rem;margin:.4rem 0;border-radius:8px;border:1px solid #5a534a;background:#1f1c18;color:#f3ead6}
  .rolepick{display:flex;gap:.3rem;margin:.4rem 0}
  .rolepick label{flex:1;font-size:.8rem;background:#1f1c18;border:1px solid #5a534a;border-radius:8px;padding:.4rem .3rem;cursor:pointer;display:flex;align-items:center;gap:.3rem;justify-content:center}
  .rolepick input{width:auto;margin:0}
  .rolebadge{font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;background:#3a3631;color:#f3ead6;border:1px solid #5a534a;border-radius:4px;padding:.1rem .4rem;margin-left:.4rem}
  .gate .err{color:#ff9b8e;font-size:.82rem;margin-top:.6rem;min-height:1em}
  .gate code{background:#1f1c18;padding:.1rem .3rem;border-radius:4px}
</style>
</head>
<body>

<!-- login / setup gate -->
<div class="gate" id="gate" style="display:none">
  <div class="card" id="gateCard"></div>
</div>

<header style="display:none" id="hdr">
  <h1>Publisheur <span style="opacity:.6;font-size:.8rem;font-family:system-ui">· Rédaction</span></h1>
  <button id="chronLink" style="display:none" onclick="showChronicles()">✍️ Mes chroniques</button>
  <button id="journauxLink" style="display:none" onclick="showJournaux()">📰 Mes journaux</button>
  <button id="homeLink" style="display:none" onclick="goDashboard()">🏠 Mes journaux</button>
  <label id="editionWrap" style="display:flex;align-items:center;gap:.4rem;font-size:.8rem;opacity:.85">
    Édition
    <select id="editionSel" onchange="switchEdition(this.value)"
      style="font:inherit;background:#2c2924;color:#f3ead6;border:1px solid #555;border-radius:5px;padding:.25rem .4rem"></select>
  </label>
  <span class="grow"></span>
  <span class="who" id="who"></span><span class="rolebadge" id="rolebadge" style="display:none"></span>
  <button id="portfolioLink" onclick="openPortfolio()">🖼 Portfolio</button>
  <a id="adsLink" href="ads.html" style="display:none">📣 Réclames</a>
  <button id="manageLink" style="display:none" onclick="openManageJournal()">⚙ Gérer le journal</button>
  <button id="printLink" style="display:none" onclick="runExport()">🖨 PDF imprimable</button>
  <button onclick="openProfile()">Mon profil</button>
  <button id="newBtn" onclick="newArticle()">+ Article</button>
  <a id="openPaper" href="paper.html" target="_blank">Open full paper ↗</a>
  <button onclick="doSignOut()">Sign out</button>
</header>

<!-- Editions dashboard (the landing for contributors) -->
<main style="display:none" id="dash">
  <div class="dashwrap">
    <div class="dashhead"><h2 class="dashtitle" id="dashTitle">Mes journaux</h2>
      <p class="dashsub" id="dashSub"></p></div>
    <div class="dashgrid" id="dashGrid"></div>
  </div>
</main>

<main style="display:none" id="app">
  <div class="col" id="list">
    <div class="listtop">
      <div class="listhead"><span class="grow">Mes chroniques</span><span id="listcount" style="font-weight:400;color:#7a7060;font-size:.78rem"></span></div>
      <div class="listfilter">
        <input type="search" id="listq" placeholder="Filtrer par titre ou auteur…" oninput="setQuery(this.value)">
        <div class="whochips">
          <button class="wchip on" data-who="all"    onclick="setWho('all')">Tous</button>
          <button class="wchip"    data-who="mine"   onclick="setWho('mine')">Moi</button>
          <button class="wchip"    data-who="others" onclick="setWho('others')">Autres</button>
        </div>
      </div>
    </div>
    <div id="items"></div>
  </div>

  <div class="col" id="form">
    <div class="row"><label>Surtitre (kicker)</label><input id="f_kicker" placeholder="ex. DÉPÊCHE DU FRONT"></div>
    <div class="row"><label>Titre</label><input id="f_headline" class="head" placeholder="Le titre de votre chronique"></div>
    <div class="row"><label>Chapô / sous-titre</label><input id="f_subhead" placeholder="Résumé en une ligne"></div>
    <div class="twocol">
      <div class="row"><label>Signature</label><input id="f_byline" placeholder="Votre nom de plume"></div>
      <div class="row"><label>De quel régiment ? (transparence)</label><select id="f_source"></select></div>
    </div>
    <div class="row">
      <label>Photo suggérée (optionnel) — l’éditeur décidera de la mise en page</label>
      <div id="dropzone" class="dropzone">
        <div class="dzrow">
          <input id="f_image" placeholder="https://…  ou glissez/téléversez une photo" oninput="showPreview(this.value)">
          <button type="button" class="dzbtn" onclick="document.querySelector('#f_file').click()">📷 Téléverser</button>
          <button type="button" class="dzbtn" onclick="openPortfolio(true)">🖼 Portfolio</button>
          <input id="f_file" type="file" accept="image/*" style="display:none" onchange="onPickFile(this.files[0])">
        </div>
        <div class="dzhint">Glissez une image ici, ou collez une URL.</div>
        <div class="imgwrap" id="imgwrap" style="display:none">
          <img id="f_preview" alt="">
          <button type="button" class="imgx" title="Retirer l’image" onclick="clearImage()">✕</button>
        </div>
        <div class="upstatus" id="upstatus"></div>
      </div>
    </div>
    <div class="row"><label>Body</label>
      <textarea id="f_body" placeholder="Write the article. Blank line = new paragraph. **bold**, *italic*."></textarea>
      <div class="hint">Blank line = new paragraph · <code>**bold**</code> · <code>*italic*</code></div>
    </div>
    <div class="formbar" id="formbar"></div>
    <div class="hint"><span id="savedAt"></span><a href="#" id="histLink" style="display:none;margin-left:.6rem;color:var(--accent)" onclick="openHistory();return false">🕘 Historique des révisions</a></div>
  </div>

  <div class="col" id="preview">
    <div class="pvhead">Live preview <span class="grow"></span><button onclick="reloadPreview()" style="font:inherit;border:1px solid var(--line);background:#fff;border-radius:5px;padding:.2rem .5rem;cursor:pointer">↻</button></div>
    <iframe id="pv" src="paper.html"></iframe>
  </div>
</main>

<div class="toast" id="toast"></div>

<!-- Portfolio modal -->
<div class="pmodal" id="pmodal" style="display:none">
  <div class="pcard">
    <div class="phead"><b>Portfolio des illustrateurs</b><span class="grow"></span><button class="px" onclick="closePortfolio()">✕</button></div>
    <div class="pupload" id="pUpload"></div>
    <div class="pgrid" id="pGrid"></div>
  </div>
</div>

<!-- Journal (edition) create/manage modal -->
<div class="pmodal" id="jmodal" style="display:none">
  <div class="pcard" style="max-width:620px">
    <div class="phead"><b id="jTitle">Journal</b><span class="grow"></span><button class="px" onclick="closeJournal()">✕</button></div>
    <div class="jbody" id="jBody"></div>
  </div>
</div>

<!-- Revision history modal -->
<div class="pmodal" id="hmodal" style="display:none">
  <div class="pcard" style="max-width:680px">
    <div class="phead"><b>Historique des révisions</b><span class="grow"></span><button class="px" onclick="closeHistory()">✕</button></div>
    <div class="jbody" id="hList"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="papers.js"></script>
<script src="daihbi.js"></script>
<script>
const $ = s => document.querySelector(s);
const { Auth, Chronicles, Placements, Media, Profiles, Portfolio, Papers, Revisions, configured } = window.Daihbi;
const ISSUE = window.Daihbi.ISSUE;
let PAPERS = window.DAIHBI_PAPERS || {};
let MY_MANAGED = [];   // issues this editor owns/co-edits
let current = null;
let MYROLE = "reader", MYPROFILE = null, MY_EMAIL = "";
let PROFMAP = {};   // user id → display name (for "édité par …")
const ROLE_LABELS = { reader:"Lecteur", writer:"Rédacteur", illustrator:"Illustrateur", editor:"Éditeur", annonceur:"Annonceur" };
const roleLabel = r => ROLE_LABELS[r] || r;
const nameOf = id => (id && PROFMAP[id]) || (id ? "—" : "");

const F = {
  kicker:$("#f_kicker"), headline:$("#f_headline"), subhead:$("#f_subhead"),
  byline:$("#f_byline"), source:$("#f_source"), image:$("#f_image"),
  body:$("#f_body"),
};
// régiment options for the provenance/transparency field
F.source.innerHTML = `<option value="">— régiment —</option>`
  + (window.DAIHBI_CLANS||[]).map(c=>`<option>${escapeHtml(c)}</option>`).join("");
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }
function escapeHtml(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

// ── Gate: setup notice or login ──────────────────────────────────────────
function showGate(html){ $("#gate").style.display="flex"; $("#gateCard").innerHTML=html; }
function hideGate(){ $("#gate").style.display="none"; }

function setupNotice(){
  showGate(`<h2>Almost there</h2>
    <p>Connect your Supabase project: open <code>web/config.js</code> and paste your
    <b>Project URL</b> and <b>anon key</b> (Supabase → Settings → API), then reload.</p>`);
}
function loginScreen(msg, mode, preRole){
  mode = mode || "signin";
  const up = mode === "signup";
  const r = preRole || "writer";
  const radio = (v,l) => `<label><input type="radio" name="role" value="${v}" ${v===r?"checked":""}> ${l}</label>`;
  showGate(`<h2>Publisheur</h2>
    <div class="authtabs">
      <button class="${up?"":"on"}" onclick="loginScreen(null,'signin')">Se connecter</button>
      <button class="${up?"on":""}" onclick="loginScreen(null,'signup','${r}')">Créer un compte</button>
    </div>
    <input id="email" type="email" placeholder="vous@exemple.com" autocomplete="username" autofocus>
    <input id="password" type="password" placeholder="${up?"choisir un mot de passe (6+ caractères)":"mot de passe"}" autocomplete="${up?"new-password":"current-password"}">
    ${up ? `
      <input id="display_name" type="text" placeholder="Nom de plume (affiché)" autocomplete="name">
      <div class="rolepick">
        ${radio("reader","Lecteur")}${radio("writer","Rédacteur")}${radio("illustrator","Illustrateur")}${radio("annonceur","Annonceur")}
      </div>
      <select id="clan">${(window.DAIHBI_CLANS||["Indépendant"]).map(c=>`<option>${c}</option>`).join("")}</select>
    ` : ""}
    <button onclick="${up?"doSignUp()":"doPasswordLogin()"}">${up?"Créer le compte":"Se connecter"}</button>
    <div class="err" id="loginErr">${msg||""}</div>
    ${up
      ? `<p style="margin-top:1rem;font-size:.8rem;opacity:.7">Déjà un compte ? <a href="#" onclick="loginScreen(null,'signin');return false">Se connecter</a>.</p>`
      : `<p style="margin-top:1rem;font-size:.8rem;opacity:.7">Pas de mot de passe ? <a href="#" onclick="sendLink();return false">Recevoir un lien par e-mail</a>.</p>`}`);
  const act = up ? doSignUp : doPasswordLogin;
  const pw=$("#password"); if(pw) pw.addEventListener("keydown",e=>{if(e.key==="Enter")act();});
  const inp=$("#email"); if(inp) inp.addEventListener("keydown",e=>{if(e.key==="Enter")$("#password").focus();});
}
async function doPasswordLogin(){
  const email=$("#email").value.trim(), password=$("#password").value;
  if(!email||!password){ $("#loginErr").textContent="Entrez votre e-mail et votre mot de passe."; return; }
  try{ await Auth.signInPassword(email,password); /* onChange handler reloads the app */ }
  catch(e){ $("#loginErr").textContent=e.message; }
}
async function doSignUp(){
  const email=$("#email").value.trim(), password=$("#password").value;
  if(!email||!password){ $("#loginErr").textContent="Entrez un e-mail et un mot de passe."; return; }
  if(password.length<6){ $("#loginErr").textContent="Mot de passe : 6 caractères minimum."; return; }
  const role=(document.querySelector('input[name="role"]:checked')||{}).value||"reader";
  const clan=($("#clan")||{}).value||"";
  const display_name=($("#display_name")||{}).value.trim()||"";
  try{
    const data = await Auth.signUp(email,password,{role,clan,display_name});
    if(data && data.session){ /* auto-confirmé → onChange recharge l'app */ }
    else { $("#gateCard").innerHTML=`<h2>Compte créé ✓</h2>
      <p>Un e-mail de confirmation a été envoyé à <b>${escapeHtml(email)}</b>.</p>
      <p style="font-size:.85rem;opacity:.85">Cliquez le lien — <b>même si la page affiche une erreur</b>, votre compte est validé.
      Revenez ensuite ici et <a href="#" onclick="loginScreen(null,'signin');return false">connectez-vous</a> avec votre mot de passe.</p>`; }
  }catch(e){ $("#loginErr").textContent=e.message; }
}
async function sendLink(){
  const email=$("#email").value.trim();
  if(!email){ $("#loginErr").textContent="Entrez votre e-mail."; return; }
  try{ await Auth.signIn(email); $("#gateCard").innerHTML=`<h2>Vérifiez votre e-mail</h2><p>Lien de connexion envoyé à <b>${escapeHtml(email)}</b>. Ouvrez-le sur cet appareil.</p>`; }
  catch(e){ $("#loginErr").textContent=e.message; }
}
async function doSignOut(){ await Auth.signOut(); location.reload(); }

// ── Form ──────────────────────────────────────────────────────────────────
function formData(){
  return {
    kicker:F.kicker.value.trim(), headline:F.headline.value.trim()||"Sans titre",
    subhead:F.subhead.value.trim(), byline:F.byline.value.trim(),
    source:F.source.value, image_url:F.image.value.trim(),
    body:F.body.value,
  };
}
function fill(a){
  current=a?a.id:null;
  F.kicker.value=a?.kicker||""; F.headline.value=a?.headline||"";
  F.subhead.value=a?.subhead||""; F.byline.value=a?.byline||"";
  F.source.value = a ? (a.source||"") : ((MYPROFILE&&MYPROFILE.clan)||"");   // default to my régiment
  F.image.value=a?.image_url||"";
  F.body.value=a?.body||"";
  const sl=$("#statusLbl"); if(sl) sl.textContent = a ? statusLabel(a) : "Nouvelle chronique";
  $("#delBtn").style.display=a?"":"none";
  $("#savedAt").textContent=a?.updated_at
    ? "Modifié le "+new Date(a.updated_at).toLocaleString("fr-FR")+(a.last_edited_by?" par "+nameOf(a.last_edited_by):"")
    : "";
  $("#histLink").style.display = a ? "" : "none";
  showPreview(a?.image_url||""); $("#upstatus").textContent="";
  highlight();
}
function newArticle(){ fill(null); F.headline.focus(); }

// ── Image upload ──────────────────────────────────────────────────────────
function showPreview(url){
  const wrap=$("#imgwrap"), img=$("#f_preview");
  if(url){ img.src=url; wrap.style.display=""; } else { wrap.style.display="none"; img.removeAttribute("src"); }
}
function clearImage(){ F.image.value=""; showPreview(""); $("#upstatus").textContent=""; }
function onPickFile(file){ if(file) uploadImage(file); }
async function uploadImage(file){
  if(!file) return;
  $("#upstatus").textContent="Envoi de l’image…";
  try{
    const url=await Media.upload(file);
    F.image.value=url; showPreview(url);
    $("#upstatus").textContent="✓ Image ajoutée. N’oubliez pas d’enregistrer.";
  }catch(e){ $("#upstatus").textContent="Erreur : "+e.message; }
}
function wireDropzone(){
  const dz=$("#dropzone"); if(!dz) return;
  ["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add("drag");}));
  ["dragleave","dragend"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove("drag");}));
  dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("drag");const f=e.dataTransfer?.files?.[0];if(f)uploadImage(f);});
}
function highlight(){ document.querySelectorAll(".item").forEach(el=>el.classList.toggle("sel",String(el.dataset.id)===String(current))); }

let ALL = [];                       // every article in this edition (cache)
let ME = null;                      // current user's id (set in boot)
const listFilter = { q:"", who:"all" };   // who: all | mine | others

async function loadList(){
  try{ ALL = await Chronicles.listMine(); }catch(e){ toast("Load error: "+e.message); return; }
  renderList();
}
function setQuery(v){ listFilter.q=v; renderList(); }
function setWho(w){
  listFilter.who=w;
  document.querySelectorAll(".wchip").forEach(c=>c.classList.toggle("on", c.dataset.who===w));
  renderList();
}
function matchFilter(a){
  if(listFilter.who==="mine"   && a.author_id!==ME) return false;
  if(listFilter.who==="others" && (!a.author_id || a.author_id===ME)) return false;
  const q=listFilter.q.trim().toLowerCase();
  if(q && !((a.headline||"")+" "+(a.byline||"")).toLowerCase().includes(q)) return false;
  return true;
}
function renderList(){
  const arts = ALL.filter(matchFilter);
  $("#listcount").textContent = `${arts.length}`;
  $("#items").innerHTML = arts.length ? arts.map(itemHTML).join("")
    : `<div style="padding:1.4rem;color:#8a8070;font-style:italic">Aucune chronique. Cliquez « + Chronique ».</div>`;
  highlight();
}
function itemHTML(a){
  return `<div class="item" data-id="${a.id}" onclick="edit('${a.id}')">
    <div style="flex:1">
      <div class="h">${escapeHtml(a.headline)}</div>
      <div class="meta"><span class="tag ${a.status==='submitted'?'pub':'off'}">${statusLabel(a)}</span>
        ${a.byline?escapeHtml(a.byline):""}</div>
    </div>
  </div>`;
}
async function edit(id){ try{ fill(await Chronicles.get(id)); }catch(e){ toast(e.message); } }

function statusLabel(a){
  return { draft:"Brouillon", submitted:"Soumise au pool", review:"Soumise au pool", published:"Soumise au pool" }[a.status||"draft"] || (a.status||"draft");
}
async function saveArticle(action){
  const data=formData();
  if(action==="draft"){ data.status="draft"; }
  else if(action==="submit"){ data.status="submitted"; }
  // else: generic save — leave status untouched
  try{
    const saved = current==null ? await Chronicles.create(data) : await Chronicles.update(current,data);
    current=saved.id;
    toast(saved.status==="submitted" ? "Soumise au pool ✓ — un éditeur peut la mettre en page." : "Enregistrée ✓");
    await loadList(); fill(saved);
  }catch(e){ toast("Erreur : "+e.message); }
}
async function delArticle(){
  if(current==null) return;
  if(!confirm("Supprimer cette chronique ?")) return;
  try{ await Chronicles.remove(current); toast("Supprimée"); newArticle(); await loadList(); }
  catch(e){ toast(e.message); }
}
function renderFormBar(){
  const bar=$("#formbar"); if(!bar) return;
  bar.innerHTML = `<span class="statuslbl" id="statusLbl"></span><span class="grow"></span>
    <button class="del" id="delBtn" onclick="delArticle()" style="display:none">Supprimer</button>
    <button class="save ghost" onclick="saveArticle('draft')">Brouillon</button>
    <button class="save" onclick="saveArticle('submit')">Soumettre au pool</button>`;
}

async function uploadAvatar(file){
  if(!file) return;
  $("#profErr").textContent="Envoi…";
  try{
    const url=await Media.upload(file,"avatars");
    await Profiles.update({avatar_url:url}); MYPROFILE.avatar_url=url;
    $("#av_wrap").innerHTML=`<img class="avatarprev" src="${escapeHtml(url)}">`;
    $("#profErr").textContent="";
  }catch(e){ $("#profErr").textContent="Erreur : "+e.message; }

async function saveProfile(){

    const upd=await Profiles.update({ display_name:$("#p_name").value.trim(), clan:$("#p_clan").value });

// ── Portfolio (illustrateurs) ───────────────────────────────────────────────
let pPendingUrl = null;
function openPortfolio(){ $("#pmodal").style.display="flex"; renderPUpload(); loadPGrid(); }
function closePortfolio(){ $("#pmodal").style.display="none"; pPendingUrl=null; }
function renderPUpload(){
  const can = (MYROLE==="illustrator"||MYROLE==="editor");
  const u=$("#pUpload"); u.style.display = can ? "flex" : "none";
  if(can) u.innerHTML = `
    <button onclick="document.querySelector('#pFile').click()">📷 Choisir une image</button>
    <input id="pFile" type="file" accept="image/*" style="display:none" onchange="pPickFile(this.files[0])">
    <input id="pCap" type="text" placeholder="Légende (optionnelle)">
    <button class="go" onclick="addToPortfolio()">Ajouter au portfolio</button>
    <span id="pStatus" style="font-size:.78rem;color:#6a6253"></span>`;
}
async function pPickFile(file){
  if(!file) return;
  $("#pStatus").textContent="Envoi…";
  try{ pPendingUrl = await Media.upload(file,"portfolio"); $("#pStatus").textContent="✓ prête — ajoutez une légende puis « Ajouter »."; }
  catch(e){ $("#pStatus").textContent="Erreur : "+e.message; }
}
async function addToPortfolio(){
  if(!pPendingUrl){ $("#pStatus").textContent="Choisissez d’abord une image."; return; }
  try{
    await Portfolio.add({ url:pPendingUrl, caption:($("#pCap")||{}).value||"", clan:(MYPROFILE&&MYPROFILE.clan)||"", uploader_name:(MYPROFILE&&MYPROFILE.display_name)||"" });
    pPendingUrl=null; if($("#pCap")) $("#pCap").value=""; $("#pStatus").textContent="✓ Ajoutée au portfolio.";
    await loadPGrid();
  }catch(e){ $("#pStatus").textContent="Erreur : "+e.message; }
}
async function loadPGrid(){
  let imgs=[]; try{ imgs=await Portfolio.list(); }catch(e){ $("#pGrid").innerHTML=`<div class="pempty">Portfolio indisponible.<br>${escapeHtml(e.message)}</div>`; return; }
  $("#pGrid").innerHTML = imgs.length ? imgs.map(im=>{
    const own = im.uploader_id===ME || MYROLE==="editor";
    return `<div class="pcell">
      <img src="${escapeHtml(im.url)}" alt="">
      ${im.caption?`<div class="cap">${escapeHtml(im.caption)}</div>`:""}
      <div class="by">par ${escapeHtml(im.uploader_name||"?")}${im.clan?" · "+escapeHtml(im.clan):""}</div>
      <div class="pacts">
        <button class="use" onclick="usePortfolioImage('${escapeHtml(im.url)}')">Utiliser</button>
        ${own?`<button class="rm" title="Supprimer" onclick="removePortfolioImage('${im.id}')">✕</button>`:""}
      </div></div>`;
  }).join("") : `<div class="pempty">Aucune image pour l’instant.${(MYROLE==="illustrator"||MYROLE==="editor")?" Ajoutez-en une ci-dessus.":""}</div>`;
}
function usePortfolioImage(url){ F.image.value=url; showPreview(url); closePortfolio(); toast("Image ajoutée à l’article — enregistrez."); }
async function removePortfolioImage(id){ if(!confirm("Retirer cette image du portfolio ?"))return; try{ await Portfolio.remove(id); await loadPGrid(); }catch(e){ alert(e.message); } }

// ── Journaux : créer / gérer une édition ────────────────────────────────────
function journalForm(p, isNew){
  const plates=[["plate-fraktur","Gothique (fraktur)"],["plate-anton","Condensé (Anton)"],["plate-echo","Sobre (navy/Oswald)"]];
  return `
    <label>Nom du journal</label><input id="j_name" value="${escapeHtml(p.name||"")}" placeholder="L’Étendard du 8e">
    ${isNew?`<label>Identifiant (URL, sans espaces)</label><input id="j_issue" value="" placeholder="etendard-8e">`:""}
    <label>Sous-titre</label><input id="j_tagline" value="${escapeHtml(p.tagline||"")}" placeholder="Devise du journal">
    <div class="two">
      <div><label>Style du titre</label><select id="j_plate">${plates.map(([v,l])=>`<option value="${v}" ${((p.plate||"plate-fraktur")===v)?"selected":""}>${l}</option>`).join("")}</select></div>
      <div><label>Régiment</label><select id="j_clan">${(window.DAIHBI_CLANS||[]).map(c=>`<option ${c===p.clan?"selected":""}>${escapeHtml(c)}</option>`).join("")}</select></div>
    </div>
    <label>Bandeau (gauche · centre · droite)</label>
    <div class="two" style="grid-template-columns:1fr 1fr 1fr">
      <input id="j_ear0" value="${escapeHtml((p.ear&&p.ear[0])||"")}" placeholder="gauche">
      <input id="j_ear1" value="${escapeHtml((p.ear&&p.ear[1])||"")}" placeholder="centre">
      <input id="j_ear2" value="${escapeHtml((p.ear&&p.ear[2])||"")}" placeholder="droite">
    </div>
    <label>Slogans de pied (séparés par « | »)</label>
    <input id="j_slogans" value="${escapeHtml((p.slogans||[]).join(" | "))}" placeholder="Vive les Wardens | …">
    <div class="two">
      <div><label>Emblème gauche (URL)</label><input id="j_eleft" value="${escapeHtml(p.emblemLeft||"")}" placeholder="https://…"></div>
      <div><label>Emblème droit (URL)</label><input id="j_eright" value="${escapeHtml(p.emblemRight||"")}" placeholder="https://…"></div>
    </div>
    <div class="jerr" id="jErr"></div>`;
}
function readJournal(isNew){
  return { issue: isNew ? $("#j_issue").value.trim().toLowerCase().replace(/[^a-z0-9-]+/g,"-").replace(/^-+|-+$/g,"") : ISSUE,
    name:$("#j_name").value.trim(), tagline:$("#j_tagline").value.trim(), plate:$("#j_plate").value, clan:$("#j_clan").value,
    ear:[$("#j_ear0").value.trim(),$("#j_ear1").value.trim(),$("#j_ear2").value.trim()],
    slogans:$("#j_slogans").value.split("|").map(s=>s.trim()).filter(Boolean),
    emblemLeft:$("#j_eleft").value.trim(), emblemRight:$("#j_eright").value.trim() };
}
function openCreateJournal(){
  // a ready-made template so the editor isn't starting from a blank page
  const tmpl = { plate:"plate-fraktur", ear:["Édition du Front", "", "Warden"],
    slogans:["Vive les Wardens"], clan:(MYPROFILE&&MYPROFILE.clan)||"" };
  $("#jTitle").textContent="Créer un journal";
  $("#jBody").innerHTML = journalForm(tmpl,true) + `<div class="jbar"><span class="grow"></span><button class="go" onclick="createJournal()">Créer le journal</button></div>`;
  $("#jmodal").style.display="flex";
}
async function createJournal(){
  const p=readJournal(true);
  if(!p.name){ $("#jErr").textContent="Donnez un nom."; return; }
  if(!p.issue){ $("#jErr").textContent="Donnez un identifiant (lettres/chiffres/tirets)."; return; }
  if(PAPERS[p.issue]){ $("#jErr").textContent="Cet identifiant existe déjà."; return; }
  try{
    await Papers.create(p);
    location.href=`board.html?issue=${encodeURIComponent(p.issue)}`;   // lay it out (pull from the pool)
  }catch(e){ $("#jErr").textContent=e.message; }
}
function openManageJournal(){
  const p = Object.assign({issue:ISSUE}, PAPERS[ISSUE]||{});
  $("#jTitle").textContent="Gérer : "+(p.name||ISSUE);
  $("#jBody").innerHTML = journalForm(p,false)
    + `<div class="jbar"><span class="grow"></span><button class="go" onclick="saveJournal()">Enregistrer le journal</button></div>
       <div id="coeds"></div>`;
  $("#jmodal").style.display="flex";
  loadCoEditors();
}
async function saveJournal(){
  try{ await Papers.update(ISSUE, readJournal(false)); PAPERS=await Papers.map(); reloadPreview();
    $("#jErr").textContent="✓ Enregistré."; }
  catch(e){ $("#jErr").textContent=e.message; }
}
async function loadCoEditors(){
  try{
    const ids = await Papers.editors(ISSUE);
    const profs = await Profiles.all();
    const byId = Object.fromEntries(profs.map(p=>[p.id,p]));
    const rows = ids.map(id=>{ const pr=byId[id]||{}; return `<div class="coed"><span class="grow">${escapeHtml(pr.display_name||id.slice(0,8))}${id===ME?" (vous)":""}</span>${id===ME?"":`<button onclick="rmCoEditor('${id}')">Retirer</button>`}</div>`; }).join("");
    const addable = profs.filter(p=>p.role==="editor" && !ids.includes(p.id));
    const addOpts = addable.map(p=>`<option value="${p.id}">${escapeHtml(p.display_name||p.id.slice(0,8))}</option>`).join("");
    $("#coeds").innerHTML = `<label style="display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:#6a6253;margin:.8rem 0 .2rem;font-weight:600">Éditeurs du journal</label>
      ${rows||"<div class='coed'>—</div>"}
      ${addOpts?`<div class="jbar"><select id="coSel" style="flex:1;padding:.5rem;border:1px solid #c9bda0;border-radius:6px">${addOpts}</select><button onclick="addCoEditor()">Ajouter</button></div>`
               :"<div style='font-size:.8rem;color:#7a7060;margin-top:.4rem'>Aucun autre éditeur à ajouter.</div>"}`;
  }catch(e){ $("#coeds").innerHTML=`<div class="jerr">${escapeHtml(e.message)}</div>`; }
}
async function addCoEditor(){ try{ await Papers.addEditor(ISSUE,$("#coSel").value); loadCoEditors(); }catch(e){ alert(e.message); } }
async function rmCoEditor(id){ try{ await Papers.removeEditor(ISSUE,id); loadCoEditors(); }catch(e){ alert(e.message); } }
function closeJournal(){ $("#jmodal").style.display="none"; }

// ── Export print-grade PDF (Scribus via GitHub Action) ──────────────────────
async function runExport(){
  const s = await Auth.session(); if(!s){ toast("Connectez-vous."); return; }
  toast("Export imprimable lancé…");
  try{
    const res = await fetch("/api/export", { method:"POST",
      headers:{ "content-type":"application/json", "Authorization":"Bearer "+s.access_token },
      body: JSON.stringify({ issue: ISSUE }) });
    const data = await res.json().catch(()=>({}));
    if(!res.ok){ toast("Erreur : "+(data.error||res.status)); return; }
    toast("Scribus met en page le PDF… (~1–2 min)");
    pollExport(data.pdf);
  }catch(e){ toast("Erreur : "+e.message+" (export disponible une fois le token GitHub configuré)"); }
}
function pollExport(pdfUrl){
  let tries=0;
  const iv=setInterval(async()=>{
    tries++;
    try{
      const r = await fetch(pdfUrl+"?t="+Date.now(), { cache:"no-store" });
      if(r.ok){ clearInterval(iv); toast("PDF imprimable prêt ✓"); window.open(pdfUrl,"_blank"); return; }
    }catch(e){}
    if(tries>=30){ clearInterval(iv); toast("PDF bientôt prêt — réessayez « PDF imprimable » dans 1 min."); }
  }, 6000);
}

// ── Historique des révisions ────────────────────────────────────────────────
async function openHistory(){
  if(current==null) return;
  $("#hmodal").style.display="flex"; $("#hList").innerHTML="<div style='padding:1rem;color:#7a7060'>Chargement…</div>";
  try{
    const revs = await Revisions.list(current);
    $("#hList").innerHTML = revs.length ? revs.map(r=>{
      const who=nameOf(r.edited_by||r.author_id)||"?";
      const body=(r.body||""); const ex=body.slice(0,160)+(body.length>160?"…":"");
      return `<div class="revrow">
        <div class="revmeta"><b>${escapeHtml(r.headline||"(sans titre)")}</b>
          <span>${new Date(r.created_at).toLocaleString("fr-FR")} · ${escapeHtml(who)} · ${escapeHtml(statusLabel(r))}</span></div>
        <div class="revexcerpt">${escapeHtml(ex)||"<i>(vide)</i>"}</div>
        <div class="revacts"><button onclick='restoreRevision(${JSON.stringify(r).replace(/'/g,"&#39;")})'>↩ Restaurer ce texte</button></div>
      </div>`;
    }).join("") : `<div style="padding:1.2rem;color:#7a7060;font-style:italic">Aucune révision encore. L’historique se remplit à chaque enregistrement modifiant le texte.</div>`;
  }catch(e){ $("#hList").innerHTML=`<div class="jerr" style="padding:1rem">${escapeHtml(e.message)}</div>`; }
}
function closeHistory(){ $("#hmodal").style.display="none"; }
async function restoreRevision(r){
  if(!confirm("Restaurer ce texte ? La version actuelle sera conservée dans l’historique."))return;
  try{
    const saved = await Chronicles.update(current, { kicker:r.kicker||"", headline:r.headline||"", subhead:r.subhead||"",
      byline:r.byline||"", body:r.body||"", image_url:r.image_url||"" });
    fill(saved); await loadList(); closeHistory(); toast("Révision restaurée ✓");
  }catch(e){ alert(e.message); }
}
function reloadPreview(){ /* chronicle workspace has no paper preview */ }
function switchEdition(issue){
  if(issue==="__new"){ $("#editionSel").value=ISSUE; openCreateJournal(); return; }
  location.href = `editor.html?issue=${encodeURIComponent(issue)}`;
}
async function initEditions(){
  const sel=$("#editionSel"); if(!sel) return;
  // editors only see the papers they manage; others see all editions
  let keys = (MYROLE==="editor") ? MY_MANAGED.slice() : Object.keys(PAPERS);
  if(!keys.includes(ISSUE)) keys.unshift(ISSUE);
  sel.innerHTML = keys.map(k=>{
    const name=(PAPERS[k]?.name)||k;
    return `<option value="${k}" ${k===ISSUE?"selected":""}>${name}</option>`;
  }).join("") + (MYROLE==="editor" ? `<option value="__new">+ Créer un journal…</option>` : "");
  $("#pv").src = previewURL();
  $("#openPaper").href = `paper.html?issue=${encodeURIComponent(ISSUE)}`;
}

document.addEventListener("keydown",e=>{ if((e.ctrlKey||e.metaKey)&&e.key==="s"){ e.preventDefault(); saveArticle(); } });

// ── Boot ───────────────────────────────────────────────────────────────────
async function boot(){
  if(!configured){ setupNotice(); return; }
  const session = await Auth.session();
  if(!session){
    const pr=new URLSearchParams(location.search).get("role");   // from the kiosque intro
    loginScreen(null, pr?"signup":"signin", pr);
    Auth.onChange(s=>{ if(s) location.reload(); }); return;
  }
  // load profile + role
  MYPROFILE = await Profiles.me();
  MYROLE = (MYPROFILE && MYPROFILE.role) || "reader";
  if(MYROLE === "annonceur"){ advertiserGate(); return; }   // ad studio coming soon
  if(!["writer","illustrator","editor"].includes(MYROLE)){ readerGate(); return; }  // readers → kiosque
  // signed in as a contributor
  hideGate();
  ME = session.user.id; MY_EMAIL = session.user.email || "";
  $("#hdr").style.display="";
  $("#who").textContent = MYPROFILE.display_name || MY_EMAIL;
  $("#rolebadge").textContent = roleLabel(MYROLE); $("#rolebadge").style.display="";
  // chronicle workspace: hide paper-specific header controls
  ["editionWrap","manageLink","printLink","openPaper","homeLink"].forEach(id=>{const e=$("#"+id); if(e) e.style.display="none";});
  const nb=$("#newBtn"); if(nb) nb.textContent="✍️ Nouvelle chronique";
  try{ const ps=await Profiles.all(); PROFMAP=Object.fromEntries(ps.map(p=>[p.id, p.display_name||""])); }catch(e){}
  if(MYROLE==="editor"){
    $("#adsLink").style.display="";
    $("#journauxLink").style.display=""; $("#chronLink").style.display="";
    try{ PAPERS = await Papers.map(); MY_MANAGED = await Papers.myManaged(); }catch(e){}
  }
  showChronicles();
}
function showChronicles(){
  $("#dash").style.display="none"; $("#app").style.display=""; $("#app").classList.add("chron");
  $("#newBtn").style.display="";
  renderFormBar(); wireDropzone();
  Chronicles.subscribe(loadList);
  loadList().then(()=>newArticle());
}
function showJournaux(){ $("#app").style.display="none"; renderDashboard(); }
function goDashboard(){ showJournaux(); }
function renderDashboard(){
  $("#app").style.display="none"; $("#dash").style.display="";
  // hide article-context header controls on the dashboard
  ["homeLink","editionWrap","manageLink","printLink","newBtn","openPaper"].forEach(id=>{const e=$("#"+id); if(e) e.style.display="none";});
  const isEd = MYROLE==="editor";
  $("#dashTitle").textContent = isEd ? "Mes journaux" : "Choisir un journal";
  $("#dashSub").textContent = isEd
    ? "Ouvrez une édition pour écrire et publier, ou créez-en une nouvelle."
    : "Ouvrez le journal pour lequel vous voulez contribuer.";
  const issues = isEd ? MY_MANAGED.slice() : Object.keys(PAPERS);
  const cards = issues.map(is => dashCard(is, PAPERS[is] || {name:is}));
  if(isEd) cards.push(`<div class="dcard dnew" onclick="openCreateJournal()"><div class="dnew-plus">＋</div><div>Créer un journal</div></div>`);
  $("#dashGrid").innerHTML = cards.length ? cards.join("")
    : `<div class="dempty">${isEd?"Vous ne gérez encore aucun journal. Cliquez « Créer un journal ».":"Aucun journal disponible pour l’instant."}</div>`;
}
function dashCard(issue, p){
  const cls = ({"plate-anton":"anton","plate-echo":"echo"}[p.plate]||"fraktur");
  return `<div class="dcard ${cls}">
    <div class="dmast">${escapeHtml(p.name||issue)}</div>
    ${p.tagline?`<div class="dtag">${escapeHtml(p.tagline)}</div>`:""}
    <div class="dmeta">${escapeHtml(p.clan||"")}</div>
    <div class="dacts">
      <button class="open" onclick="openEdition('${issue}')">Mettre en page →</button>
      <button class="del" title="Supprimer le journal" onclick="deleteEdition('${issue}')">🗑</button>
    </div></div>`;
}
function openEdition(issue){ location.href = "board.html?issue="+encodeURIComponent(issue); }
async function deleteEdition(issue){
  const nm = (PAPERS[issue]&&PAPERS[issue].name)||issue;
  if(!confirm(`Supprimer le journal « ${nm} » ?\nLe titre disparaît du kiosque ; les articles déjà écrits restent en base.`)) return;
  try{ await Papers.remove(issue); MY_MANAGED = await Papers.myManaged(); PAPERS = await Papers.map(); renderDashboard(); toast("Journal supprimé"); }
  catch(e){ alert("Suppression refusée (seul le propriétaire peut supprimer) : "+e.message); }
}
boot();
</script>
